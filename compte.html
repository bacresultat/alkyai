<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon espace – ALKYAI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14110f;--y:#ffc400;--hot:#ff4b1f;--mut:#6d6760;--ok:#18b872;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f4f1ea;color:var(--ink);font:500 16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding:0 0 60px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;max-width:1040px;margin:0 auto}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;background:var(--ink);color:var(--y);padding:4px 12px;border-radius:10px;transform:rotate(-3deg);text-decoration:none}
.ghost{background:#fff;color:var(--ink);border:0;border-radius:99px;padding:9px 16px;font:700 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 2px 8px rgba(20,17,15,.12);margin-left:8px}
main{max-width:1040px;margin:0 auto;padding:0 18px}
h1{font:800 clamp(30px,6vw,44px)/1.05 'Bricolage Grotesque',sans-serif;margin:4px 0}
h2{font:800 24px 'Bricolage Grotesque',sans-serif;margin:34px 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.hero{background:var(--y);border-radius:28px;padding:26px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hero small{font-weight:700;opacity:.7}.hero p{margin:0}
.badge{background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;font-weight:800;white-space:nowrap}
.badge.pro{background:#fff;color:var(--ink)}
.note{background:#fff;border-left:6px solid var(--hot);border-radius:14px;padding:14px 16px;margin-top:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.plan{position:relative;background:#fff;border-radius:26px;padding:24px;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(20,17,15,.08)}
.plan.pro{background:var(--ink);color:#fff;transform:translateY(-8px);box-shadow:0 18px 40px rgba(20,17,15,.35)}
@media(max-width:860px){.plan.pro{transform:none}}
.ribbon{position:absolute;top:-12px;right:18px;background:var(--hot);color:#fff;font-weight:800;font-size:12px;padding:4px 12px;border-radius:99px}
.plan h3{font:800 22px 'Bricolage Grotesque',sans-serif;margin:0}
.price{font:800 44px/1.1 'Bricolage Grotesque',sans-serif;margin:8px 0 2px}.price small{font:600 14px 'Plus Jakarta Sans',sans-serif;opacity:.7}
.plan ul{list-style:none;padding:0;margin:14px 0;flex:1}
.plan li{padding:6px 0 6px 28px;position:relative;font-size:15px}
.plan li::before{content:'✓';position:absolute;left:0;font-weight:800;color:var(--ok)}
.plan.pro li::before{color:var(--y)}
.plan li.no{opacity:.45}.plan li.no::before{content:'✕';color:var(--mut)}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:16px;padding:14px;font:800 16px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-decoration:none;margin-top:8px}
.btn.hot{background:var(--hot);color:#fff}.btn.dark{background:var(--ink);color:#fff}.btn.light{background:#fff;color:var(--ink)}
.btn.out{background:transparent;border:2px solid currentColor;color:inherit}
.btn.off{background:#e3ded4;color:var(--mut);cursor:default}
.steps{font-size:13px;opacity:.85;margin:6px 0 0;padding-left:18px}
.cur{background:#e9f9f1;color:#0a7d4a;font-weight:800;text-align:center;border-radius:14px;padding:12px;margin-top:8px}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 4px 18px rgba(20,17,15,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:860px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:13px;margin-top:12px}
input{width:100%;padding:13px 14px;border:2px solid #e3ded4;border-radius:12px;font:500 16px 'Plus Jakarta Sans',sans-serif;margin-top:4px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.res button{display:block;width:100%;text-align:left;background:#faf8f4;border:0;border-left:6px solid var(--y);border-radius:12px;padding:10px 12px;margin-top:8px;font:inherit;cursor:pointer}
.res small{color:var(--mut)}
.row{padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.k{display:inline-block;font:800 11px 'Bricolage Grotesque',sans-serif;text-transform:uppercase;background:var(--y);border-radius:6px;padding:2px 8px;margin-right:6px}
.load{padding:60px;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,200px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;transition:transform .25s;z-index:9;max-width:92vw;text-align:center}#toast.on{transform:translate(-50%,0)}
</style></head><body>
<header class="bar"><a class="logo" href="index.html">ALKYAI</a><div><a class="ghost" href="index.html">🗺 Carte</a><button class="ghost" id="out">Déconnexion</button></div></header>
<main id="app"><div class="load">Chargement de ton espace…</div></main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL='https://gspingiinfhefdfqwyjf.supabase.co',SB_KEY='sb_publishable_d2GwO2bGEJ5koaTSxDUD_w_ywV8xVBf';
/* TES LIENS DE PAIEMENT (PayPal.me, Lydia, Mollie, HelloAsso…) */
var PAY_PRO='',PAY_COLLECTIF='',PAY_SECOURS='';
var sb=supabase.createClient(SB_URL,SB_KEY),U=null,PE=null,enc=encodeURIComponent;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},3200)}
function ago(i){var m=Math.round((Date.now()-new Date(i))/60000);return m<60?'il y a '+Math.max(m,1)+' min':m<1440?'il y a '+Math.round(m/60)+' h':'il y a '+Math.round(m/1440)+' j'}
function km(a,b,c,d){var r=Math.PI/180,x=Math.pow(Math.sin((c-a)*r/2),2)+Math.cos(a*r)*Math.cos(c*r)*Math.pow(Math.sin((d-b)*r/2),2);return 12742*Math.asin(Math.sqrt(x))}
$('out').onclick=function(){sb.auth.signOut().then(function(){location.href='index.html'})};
sb.auth.getSession().then(function(r){if(!r.data.session){location.href='inscription.html';return}U=r.data.session.user;init()});
function init(){
 var u=U.id;
 Promise.all([
  sb.from('subscriptions').select('*').eq('user_id',u).maybeSingle(),
  sb.from('profiles').select('*').eq('user_id',u).maybeSingle(),
  sb.from('pay_requests').select('*').eq('user_id',u).eq('done',false),
  sb.from('reports').select('type,name,updated').eq('user_id',u).order('updated',{ascending:false}).limit(8),
  sb.from('reports').select('type,lat,lng')
 ]).then(function(a){draw(a[0].data,a[1].data,a[2].data||[],a[3].data||[],a[4].data||[])});
}
function draw(sub,prof,reqs,mine,all){
 var pro=!!(sub&&sub.status==='active'&&(!sub.until||new Date(sub.until)>new Date()));
 var days=pro&&sub.until?Math.max(0,Math.ceil((new Date(sub.until)-Date.now())/864e5)):0;
 var name=(prof&&prof.pseudo)||U.email.split('@')[0];
 var pend=reqs.length?'<div class="note">⏳ Paiement reçu en vérification ('+esc(reqs[0].plan)+'). Ton compte est activé dès qu’on a vu le paiement (24 h max).</div>':'';
 var near='';
 if(prof&&prof.lat!=null){var n=all.filter(function(x){return x.type==='blocus'&&km(prof.lat,prof.lng,x.lat,x.lng)<2}).length;near='<div class="note">📍 <b>'+n+'</b> blocus signalé(s) à moins de 2 km de '+esc(prof.etab_name)+' (24 h).</div>'}
 function pay(link,label,k,dark){
  var steps='<ol class="steps"><li>Paie avec ton e-mail en message</li><li>Reviens ici et touche « J’ai payé »</li><li>Activation sous 24 h</li></ol>';
  return (link?'<a class="btn hot" href="'+esc(link)+'" target="_blank" rel="noopener">'+label+'</a>':'<div class="btn off">Paiement bientôt disponible</div>')+
   '<button class="btn '+(dark?'light':'out')+'" data-pay="'+k+'">J’ai payé ✓</button>'+steps}
 var h='<section class="hero"><div><small>Mon espace</small><h1>Salut '+esc(name)+' 👋</h1><p>'+esc(U.email)+'</p></div>'+
  <label>Mon lycée ou ma fac<input id="ps" autocomplete="off" placeholder="Tape son nom" value="'+esc(prof&&prof.etab_name)+'"></label><div class="res" id="pr"></div><button class="btn dark" id="pv">Enregistrer</button></div></div>'+
  '<div><h2>Mes signalements</h2><div class="card">'+(mine.length?mine.map(function(x){return'<div class="row"><span class="k">'+esc(x.type)+'</span>'+esc(x.name)+' · '+ago(x.updated)+'</div>'}).join(''):'<p class="sub" style="margin:0">Aucun pour l’instant. Touche le bouton + sur la carte pour signaler.</p>')+'<a class="btn hot" href="index.html">Aller sur la carte</a></div></div></div>';
 $('app').innerHTML=h;
 document.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=function(){b.disabled=true;sb.from('pay_requests').insert({user_id:U.id,email:U.email,plan:b.dataset.pay}).then(function(r){b.disabled=false;toast(r.error?'Erreur : '+r.error.message:'Demande envoyée ✓ Activation après vérification');if(!r.error)init()})}});
 var t0;$('ps').oninput=function(){var v=this.value.trim();clearTimeout(t0);t0=setTimeout(function(){if(v.length<3){$('pr').innerHTML='';return}
  fetch('https://data.education.gouv.fr/api/records/1.0/search/?dataset=fr-en-annuaire-education&rows=6&q='+enc(v)).then(function(r){return r.json()}).then(function(d){
   var rs=(d.records||[]).map(function(r){var f=r.fields||{},g=r.geometry&&r.geometry.coordinates;return g?{id:r.recordid,name:f.nom_etablissement,lat:g[1],lng:g[0],city:f.nom_commune||'',cp:f.code_postal||''}:null}).filter(function(x){return x&&x.name});
   $('pr').innerHTML=rs.length?'':'<small>Aucun résultat</small>';
   rs.forEach(function(o){var b=document.createElement('button');b.innerHTML='<b>'+esc(o.name)+'</b><br><small>'+esc(o.cp)+' '+esc(o.city)+'</small>';b.onclick=function(){PE=o;$('ps').value=o.name;$('pr').innerHTML='<small>Sélectionné ✓</small>'};$('pr').appendChild(b)})
  }).catch(function(){$('pr').innerHTML='<small>Recherche indisponible (ouvre la page depuis alkyai.fr)</small>'})},300)};
 $('pv').onclick=function(){var o=PE||(prof&&prof.lat!=null?{id:prof.etab_id,name:prof.etab_name,lat:prof.lat,lng:prof.lng,city:prof.city}:null);
  sb.from('profiles').upsert({user_id:U.id,pseudo:$('pp').value.trim()||null,etab_name:o?o.name:null,etab_id:o?o.id:null,lat:o?o.lat:null,lng:o?o.lng:null,city:o?o.city:null}).then(function(r){toast(r.error?'Erreur : '+r.error.message:'Profil enregistré ✓');if(!r.error)init()})};
}
</script></body></html>
