<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compte – ALKYAI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14110f;--y:#ffc400;--hot:#ff4b1f;--mut:#6d6760;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--y);color:var(--ink);font:500 16px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:28px;padding:28px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(20,17,15,.3)}
.logo{display:inline-block;font:800 22px 'Bricolage Grotesque',sans-serif;background:var(--ink);color:var(--y);padding:4px 12px;border-radius:10px;transform:rotate(-3deg);text-decoration:none}
h1{font:800 34px/1.05 'Bricolage Grotesque',sans-serif;margin:18px 0 6px}
p{margin:0 0 14px;color:var(--mut)}
.g{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:14px;font:700 16px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.g:hover{background:#f5f2ea}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);margin:16px 0;font-size:13px}.or::before,.or::after{content:'';flex:1;height:1px;background:#e3ded4}
.tabs{display:flex;background:#f1ede5;border-radius:14px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px;font:700 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
label{display:block;font-weight:700;font-size:13px;margin-top:12px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:13px 14px;border:2px solid #e3ded4;border-radius:12px;font:500 16px 'Plus Jakarta Sans',sans-serif;margin-top:4px}
input:focus-visible,button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:13px;margin-top:14px;color:var(--mut)}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
a{color:var(--hot)}
.go{width:100%;margin-top:16px;background:var(--hot);color:#fff;border:0;border-radius:16px;padding:15px;font:800 17px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
#msg{margin-top:14px;font-weight:700;font-size:14px;min-height:20px}#msg.err{color:#c4210a}#msg.ok{color:#0a7d4a}
.back{display:block;text-align:center;margin-top:16px;font-size:14px}
[hidden]{display:none!important}
</style></head><body>
<main class="card">
  <a class="logo" href="index.html">ALKYAI</a>
  <h1 id="h">Crée ton compte</h1>
  <p id="sub">Gratuit. Pour suivre ton lycée ou ta fac, être alerté et passer Pro si tu veux.</p>

  <button class="g" id="g" type="button">
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
    Continuer avec Google</button>
  <div class="or">ou avec ton e-mail</div>

  <div class="tabs" role="tablist"><button id="tu" class="on" type="button">Créer un compte</button><button id="ti" type="button">Me connecter</button></div>
  <form id="f" novalidate>
    <label id="lp">Pseudo (facultatif)<input id="p" type="text" maxlength="30" autocomplete="nickname" placeholder="ex. Lina"></label>
    <label>E-mail<input id="e" type="email" autocomplete="email" placeholder="ton@email.fr" required></label>
    <label>Mot de passe (8 caractères minimum)<input id="w" type="password" autocomplete="new-password" required></label>
    <label class="chk" id="lc"><input id="cg" type="checkbox"><span>J’ai 15 ans ou plus et j’accepte les <a href="cgv.html" target="_blank">CGV</a> et la <a href="confidentialite.html" target="_blank">politique de confidentialité</a>.</span></label>
    <button class="go" id="ok" type="submit">Créer mon compte</button>
  </form>
  <div id="msg" role="status"></div>
  <a class="back" href="index.html">← Retour à la carte</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL='https://gspingiinfhefdfqwyjf.supabase.co',SB_KEY='sb_publishable_d2GwO2bGEJ5koaTSxDUD_w_ywV8xVBf';
var sb=supabase.createClient(SB_URL,SB_KEY),mode='up';
function $(i){return document.getElementById(i)}
function msg(t,ok){var m=$('msg');m.textContent=t;m.className=ok?'ok':'err'}
function fr(e){var m=(e&&e.message)||'Erreur inconnue';
 if(/Invalid login/i.test(m))return'E-mail ou mot de passe incorrect.';
 if(/already registered/i.test(m))return'Ce compte existe déjà : clique sur « Me connecter ».';
 if(/at least/i.test(m))return'Mot de passe trop court (8 caractères minimum).';
 if(/rate limit/i.test(m))return'Trop d’essais, réessaie dans quelques minutes.';
 if(/not enabled|Unsupported provider/i.test(m))return'Connexion Google pas encore activée dans Supabase.';
 if(/not confirmed/i.test(m))return'Confirme ton e-mail avant de te connecter.';
 return m}
function home(){location.href=new URL('index.html',location.href).href}
sb.auth.getSession().then(function(r){if(r.data.session)home()});
function setMode(m){mode=m;$('tu').classList.toggle('on',m==='up');$('ti').classList.toggle('on',m==='in');
 $('lp').hidden=$('lc').hidden=m==='in';$('h').textContent=m==='up'?'Crée ton compte':'Content de te revoir';
 $('ok').textContent=m==='up'?'Créer mon compte':'Me connecter';$('w').autocomplete=m==='up'?'new-password':'current-password';msg('')}
$('tu').onclick=function(){setMode('up')};$('ti').onclick=function(){setMode('in')};
$('g').onclick=function(){
 if(mode==='up'&&!$('cg').checked){msg('Coche la case (15 ans et CGV) pour continuer.');return}
 sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:new URL('index.html',location.href).href}}).then(function(r){if(r.error)msg(fr(r.error))});
};
$('f').onsubmit=function(ev){
 ev.preventDefault();var e=$('e').value.trim(),w=$('w').value;
 if(!/^\S+@\S+\.\S+$/.test(e)){msg('Adresse e-mail invalide.');return}
 if(w.length<8){msg('Mot de passe trop court (8 caractères minimum).');return}
 $('ok').disabled=true;
 if(mode==='in'){sb.auth.signInWithPassword({email:e,password:w}).then(function(r){$('ok').disabled=false;if(r.error)msg(fr(r.error));else home()});return}
 if(!$('cg').checked){$('ok').disabled=false;msg('Coche la case (15 ans et CGV) pour continuer.');return}
 sb.auth.signUp({email:e,password:w,options:{emailRedirectTo:new URL('index.html',location.href).href}}).then(function(r){
  $('ok').disabled=false;if(r.error){msg(fr(r.error));return}
  if(r.data.session){var p=$('p').value.trim();if(p)sb.from('profiles').upsert({user_id:r.data.user.id,pseudo:p}).then(home);else home()}
  else msg('Compte créé ! Vérifie ta boîte mail (et les spams) pour confirmer, puis reviens te connecter.',1)});
};
</script></body></html>
