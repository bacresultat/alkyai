<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALKYAI – admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14110f;--y:#ffc400;--hot:#ff4b1f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:500 15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;background:#f4f1ea;color:var(--ink);padding:16px}
h1{font:800 32px 'Bricolage Grotesque',sans-serif;margin:0 0 8px}
h2{font:800 21px 'Bricolage Grotesque',sans-serif;margin:26px 0 8px;padding-left:10px;border-left:6px solid var(--y)}
input,button{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #e3ded4;margin:4px 6px 4px 0;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--hot);color:#fff;border:0;font-weight:700}
button.g{background:#fff;color:var(--ink);border:2px solid var(--ink)}button.ok{background:#18b872;color:#fff}
#login{max-width:420px;margin:60px auto;background:#fff;padding:26px;border-radius:24px;box-shadow:0 16px 50px rgba(20,17,15,.2)}
.w{overflow-x:auto;background:#fff;border-radius:16px;padding:6px 10px;box-shadow:0 2px 10px rgba(20,17,15,.08)}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.b{display:inline-block;padding:2px 9px;border-radius:6px;font-weight:700;color:var(--ink)}a{color:var(--hot)}
</style></head><body>
<div id="login"><h1>Admin ALKYAI</h1>
<input id="e" type="email" placeholder="e-mail admin"><input id="p" type="password" placeholder="mot de passe"><button id="go">Connexion</button><p id="msg"></p></div>
<div id="app" hidden>
<button id="r" class="g">Tout rafraîchir</button><button id="out" class="g">Quitter</button>
<h2>Demandes de paiement à vérifier (<span id="n1">0</span>)</h2><div class="w"><table><tbody id="t1"></tbody></table></div>
<h2>Abonnés (<span id="n2">0</span>)</h2><div class="w"><table><tbody id="t2"></tbody></table></div>
<h2>Signalements (<span id="n3">0</span>)</h2><button id="old">Supprimer ce qui a +24 h</button><div class="w"><table><tbody id="t3"></tbody></table></div>
<h2>Étudiants inscrits (<span id="n4">0</span>)</h2><div class="w"><table><tbody id="t4"></tbody></table></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL='https://gspingiinfhefdfqwyjf.supabase.co',SB_KEY='sb_publishable_d2GwO2bGEJ5koaTSxDUD_w_ywV8xVBf';
var sb=supabase.createClient(SB_URL,SB_KEY),C={blocus:'#ff3d6e',manif:'#d9ff3f',aide:'#5cffb0',rdv:'#fff',police:'#3b8cff'},D30=30*864e5;
function $(i){return document.getElementById(i)}
function td(tr,t){var c=document.createElement('td');if(t&&t.nodeType)c.appendChild(t);else c.textContent=t==null?'':t;tr.appendChild(c)}
function btn(t,cls,f){var b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=f;return b}
function fd(x){return x?new Date(x).toLocaleString('fr-FR'):'—'}
function fill(id,n,rows,mk){$(n).textContent=rows.length;var t=$(id);t.innerHTML='';rows.forEach(function(x){var tr=document.createElement('tr');mk(tr,x);t.appendChild(tr)})}
function err(q){if(q&&q.error){alert(q.error.message);return 1}}
function grant(x){
 sb.from('subscriptions').upsert({user_id:x.user_id,plan:x.plan||'pro',status:'active',email:x.email,until:new Date(Date.now()+D30).toISOString(),updated:new Date().toISOString()}).then(function(q){if(err(q))return;
  if(x.id)sb.from('pay_requests').update({done:true}).eq('id',x.id).then(loadAll);else loadAll()})
}
function loadAll(){
 sb.from('pay_requests').select('*').eq('done',false).order('created',{ascending:false}).then(function(r){if(r.error){$('msg').textContent=r.error.message;return}
  fill('t1','n1',r.data,function(tr,x){td(tr,fd(x.created));td(tr,x.email);td(tr,x.plan);var c=document.createElement('span');c.appendChild(btn('Activer 30 j','ok',function(){grant(x)}));c.appendChild(btn('Rejeter','g',function(){sb.from('pay_requests').update({done:true}).eq('id',x.id).then(loadAll)}));td(tr,c)})});
 sb.from('subscriptions').select('*').order('updated',{ascending:false}).then(function(r){if(r.error)return;
  fill('t2','n2',r.data,function(tr,x){td(tr,x.email||x.user_id.slice(0,8));td(tr,x.plan);td(tr,x.status);td(tr,'jusqu’au '+fd(x.until));var c=document.createElement('span');c.appendChild(btn('+30 j','ok',function(){x.until=new Date(Math.max(Date.now(),new Date(x.until||0).getTime())+D30).toISOString();grant(x)}));c.appendChild(btn('Désactiver','g',function(){sb.from('subscriptions').update({status:'inactive'}).eq('user_id',x.user_id).then(loadAll)}));td(tr,c)})});
 sb.from('reports').select('*').order('updated',{ascending:false}).limit(500).then(function(r){if(r.error)return;
  fill('t3','n3',r.data,function(tr,x){td(tr,fd(x.updated));var b=document.createElement('span');b.className='b';b.style.background=C[x.type]||'#fff';b.textContent=x.type;td(tr,b);td(tr,x.name);td(tr,x.note);var a=document.createElement('a');a.href='https://www.openstreetmap.org/?mlat='+x.lat+'&mlon='+x.lng+'#map=16/'+x.lat+'/'+x.lng;a.target='_blank';a.rel='noopener';a.textContent='voir';td(tr,a);td(tr,btn('Supprimer','',function(){sb.from('reports').delete().eq('id',x.id).then(function(q){if(!err(q))loadAll()})}))})});
 sb.from('profiles').select('*').order('created',{ascending:false}).limit(300).then(function(r){if(r.error)return;
  fill('t4','n4',r.data,function(tr,x){td(tr,fd(x.created));td(tr,x.pseudo);td(tr,x.etab_name);td(tr,x.city)})});
}
function show(on){$('login').hidden=on;$('app').hidden=!on;if(on)loadAll()}
$('go').onclick=function(){sb.auth.signInWithPassword({email:$('e').value,password:$('p').value}).then(function(r){if(r.error)$('msg').textContent=r.error.message;else show(true)})};
$('r').onclick=loadAll;
$('old').onclick=function(){if(confirm('Supprimer tout ce qui a plus de 24 h ?'))sb.from('reports').delete().lt('updated',new Date(Date.now()-864e5).toISOString()).then(loadAll)};
$('out').onclick=function(){sb.auth.signOut().then(function(){show(false)})};
sb.auth.getSession().then(function(r){if(r.data.session)show(true)});
</script></body></html>
