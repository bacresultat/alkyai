  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_ANON_KEY = "sb_publishable_Bha__1CDuR3ppdQUtSQTqQ_2_KJ2NgP";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SUBSCRIPTION_PLANS = [

    const DAILY_CHALLENGES_POOL = [
      { id: 1, title: "20 Pompes sur un banc public", category: "SPORT", points: "+1 ALKY", latOffset: 0.002, lngOffset: 0.001, desc: "Trouve le parc ou la place la plus proche et enchaîne 20 pompes." },
      { id: 2, title: "Selfie devant la fontaine locale", category: "CULTURE", points: "+1 ALKY", latOffset: -0.001, lngOffset: 0.003, desc: "Repère l'eau qui coule dans ton quartier et prends ton équipe en photo." },
      { id: 3, title: "Ramasser 3 déchets urbains", category: "ÉCOLOGIE", points: "+1 ALKY", latOffset: 0.0015, lngOffset: -0.002, desc: "Nettoie un petit coin de ta rue et jette les déchets à la poubelle." },
      { id: 4, title: "Sprint de 100m chronométré", category: "SPORT", points: "+1 ALKY", latOffset: -0.0025, lngOffset: -0.001, desc: "Choisis une ligne droite sécurisée et tape ton record entre amis." },
      { id: 5, title: "Photo du plus vieux bâtiment du coin", category: "CULTURE", points: "+1 ALKY", latOffset: 0.003, lngOffset: 0.002, desc: "Trouve l'architecture la plus ancienne de ton secteur géographique." },
      { id: 6, title: "Saluer un inconnu avec le signe Alky", category: "SOCIAL", points: "+1 ALKY", latOffset: -0.0015, lngOffset: -0.003, desc: "Fais preuve d'audace et répands la bonne humeur autour de toi." },

      { id: 8, title: "Prendre une photo de rue insolite", category: "CULTURE", points: "+1 ALKY", latOffset: -0.002, lngOffset: 0.0015, desc: "Trouve un détail rigolo ou étrange dans ton quartier." },
      { id: 9, title: "Partager sa gourde d'eau", category: "VIE", points: "+1 ALKY", latOffset: 0.0025, lngOffset: -0.0015, desc: "L'hydratation c'est la base, surtout en pleine session de défis." },
      { id: 10, title: "Faire une pyramide humaine", category: "SPORT", points: "+1 ALKY", latOffset: -0.003, lngOffset: -0.002, desc: "Attention à la stabilité ! Prends une photo mémorable de ton groupe." }
    ];

    function MapView({ userLocation, challengesToShow }) {
      const mapInstanceRef = useRef(null);

      useEffect(() => {
        const center = userLocation ? [userLocation.lat, userLocation.lng] : [48.8566, 2.3522];
        
        if (!mapInstanceRef.current) {
          const map = L.map('map').setView(center, 14);
          L.tileLayer('https://{s}.tile.openstreetmap.de/tiles/osmde/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          mapInstanceRef.current = map;
        } else {
          mapInstanceRef.current.setView(center, 14);
        }

        const map = mapInstanceRef.current;
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) {
            map.removeLayer(layer);
          }
        });

        if (userLocation) {
          L.marker([userLocation.lat, userLocation.lng])
            .addTo(map)
            .bindPopup("<b>Tu es ici !</b>")
            .openPopup();
        }

        if (challengesToShow && challengesToShow.length > 0) {
          challengesToShow.forEach((ch, idx) => {
            const baseLat = userLocation ? userLocation.lat : 48.8566;
            const baseLng = userLocation ? userLocation.lng : 2.3522;
            const markerLat = baseLat + (ch.latOffset || (idx * 0.001));
            const markerLng = baseLng + (ch.lngOffset || (idx * 0.001));

            L.marker([markerLat, markerLng])
              .addTo(map)
              .bindPopup(`<b>Défi #${idx + 1}: ${ch.title}</b><br>${ch.points} — ${ch.category}`);
          });
        }
      }, [userLocation, challengesToShow]);

      return <div id="map" className="w-full h-full"></div>;
    }

    function App() {
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [currentTab, setCurrentTab] = useState('home');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showAgeModal, setShowAgeModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [pendingTab, setPendingTab] = useState(null);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const [leaderboardTab, setLeaderboardTab] = useState('solo');
      const [soloLeaderboard, setSoloLeaderboard] = useState([]);
      const [groupLeaderboard, setGroupLeaderboard] = useState([]);
      const [selectedPublicUser, setSelectedPublicUser] = useState(null);
      const [userLocation, setUserLocation] = useState(null);
      const [isLocating, setIsLocating] = useState(false);
      const [searchAddress, setSearchAddress] = useState('');
      const [searchLoading, setSearchLoading] = useState(false);

      const [dailyChallenges, setDailyChallenges] = useState([]);
      const [selectedChallenge, setSelectedChallenge] = useState(null);
      const [proofFile, setProofFile] = useState(null);
      const [uploadingProof, setUploadingProof] = useState(false);
      const [proofMessage, setProofMessage] = useState({ text: '', type: '' });

      // Admin submissions
      const [adminSubmissions, setAdminSubmissions] = useState([]);

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [birthdate, setBirthdate] = useState('');
      const [requiredBirthdate, setRequiredBirthdate] = useState('');
      const [authError, setAuthError] = useState('');

      const [newUsername, setNewUsername] = useState('');
      const [profileMessage, setProfileMessage] = useState({ text: '', type: '' });

      const [groupName, setGroupName] = useState('');
      const [groupSecret, setGroupSecret] = useState('');
      const [joinCode, setJoinCode] = useState('');
      const [groupMessage, setGroupMessage] = useState({ text: '', type: '' });

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            setSession(session);
            fetchOrCreateProfile(session.user);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) {
            fetchOrCreateProfile(session.user);
            if (pendingTab) {
              setCurrentTab(pendingTab);
              setPendingTab(null);
            }
          } else {
            setProfile(null);
          }
        });

        return () => subscription.unsubscribe();
      }, [pendingTab]);

      useEffect(() => {
        fetchAllLeaderboards();
        fetchAdminSubmissions();

        const channel = supabase
          .channel('public:profiles')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
            fetchAllLeaderboards();
          })
          .subscribe();

        const subChannel = supabase
          .channel('public:submissions')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'submissions' }, () => {
            fetchAdminSubmissions();
          })
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
          supabase.removeChannel(subChannel);
        };
      }, []);

      useEffect(() => {
        const limit = profile?.daily_challenges_limit || 1;
        const todayStr = new Date().toDateString();
        let seed = 0;
        for (let i = 0; i < todayStr.length; i++) {
          seed += todayStr.charCodeAt(i);
        }

        const shuffled = [...DAILY_CHALLENGES_POOL].sort((a, b) => {
          return ((seed * a.id) % 10) - ((seed * b.id) % 10);
        });

        setDailyChallenges(shuffled.slice(0, limit));
      }, [profile]);

      const fetchOrCreateProfile = async (user) => {
        try {
          let { data } = await supabase.from('profiles').select('*').eq('id', user.id).single();
          
          if (!data) {
            const defaultUsername = user.user_metadata?.full_name || user.email.split('@')[0];
            const newProfile = {
              id: user.id,
              username: defaultUsername,
              birthdate: null,
              alky_balance: 0,
              streak_days: 0,
              subscription_tier: 'gratuit',
              daily_challenges_limit: 1,
              last_username_change: null,
              completed_challenges_count: 0,
              group_name: null,
              group_code: null,
              is_group_admin: false,
              group_creations_count: 0,
              last_group_creation_reset: new Date().toISOString(),
              created_at: new Date().toISOString(),
              is_admin: false
            };
            await supabase.from('profiles').upsert([newProfile]);
            setProfile(newProfile);
            setNewUsername(newProfile.username);
            setShowAgeModal(true);
          } else {
            setProfile(data);
            setNewUsername(data.username);
            if (!data.birthdate) {
              setShowAgeModal(true);
            }
          }
        } catch (err) {
          console.error("Erreur profil:", err);
        }
      };

      const fetchAllLeaderboards = async () => {
        const { data: soloData } = await supabase
          .from('profiles')
          .select('id, username, alky_balance, created_at, completed_challenges_count, group_name, group_code, is_group_admin')
          .order('alky_balance', { ascending: false });

        if (soloData) {
          setSoloLeaderboard(soloData);

          const groupMap = {};
          soloData.forEach(user => {
            const gName = user.group_name ? user.group_name.trim() : '';
            
            if (gName) {
              if (!groupMap[gName]) {
                groupMap[gName] = { 
                  name: gName, 
                  totalAlky: 0, 
                  memberCount: 0, 
                  members: [], 
                  adminCode: user.group_code || '' 
                };
              }
              groupMap[gName].totalAlky += (user.alky_balance || 0);
              groupMap[gName].memberCount += 1;
              groupMap[gName].members.push({
                username: user.username,
                alky: user.alky_balance || 0,
                isAdmin: user.is_group_admin
              });
            }
          });

          Object.values(groupMap).forEach(g => {
            g.members.sort((a, b) => b.alky - a.alky);
          });

          const groupsArray = Object.values(groupMap).sort((a, b) => b.totalAlky - a.totalAlky);
          setGroupLeaderboard(groupsArray);
        }
      };

      const fetchAdminSubmissions = async () => {
        const { data } = await supabase
          .from('submissions')
          .select('*')
          .eq('status', 'pending')
          .order('created_at', { ascending: false });
        if (data) setAdminSubmissions(data);
      };

      const handleSaveBirthdate = async (e) => {
        e.preventDefault();
        if (!requiredBirthdate) return;

        const updated = { ...profile, birthdate: requiredBirthdate };
        const { error } = await supabase.from('profiles').upsert([updated]);

        if (!error) {
          setProfile(updated);
          setShowAgeModal(false);
        } else {
          alert("Erreur lors de l'enregistrement de votre date de naissance.");
        }
      };

      const handleUpdateProfileInfo = async (e) => {
        e.preventDefault();
        setProfileMessage({ text: '', type: '' });

        if (!newUsername.trim()) {
          setProfileMessage({ text: "Le pseudonyme ne peut pas être vide.", type: 'error' });
          return;
        }

        if (newUsername === profile.username) {
          setProfileMessage({ text: "Tu as déjà ce pseudonyme actuellement.", type: 'error' });
          return;
        }

        const localLastChange = localStorage.getItem(`alky_last_change_${profile.id}`);
        const lastChangeDateStr = profile.last_username_change || localLastChange;

        if (lastChangeDateStr) {
          const lastChange = new Date(lastChangeDateStr);
          const now = new Date();
          const diffDays = (now - lastChange) / (1000 * 60 * 60 * 24);

          if (diffDays < 14) {
            const remainingDays = Math.ceil(14 - diffDays);
            setProfileMessage({ 
              text: `Impossible de changer de pseudo : tu dois attendre encore ${remainingDays} jour(s).`, 
              type: 'error' 
            });
            return;
          }
        }

        const { data: existingUser } = await supabase
          .from('profiles')
          .select('id')
          .eq('username', newUsername)
          .maybeSingle();

        if (existingUser && existingUser.id !== profile.id) {
          setProfileMessage({ 
            text: `Le pseudonyme "${newUsername}" est déjà pris par un autre utilisateur.`, 
            type: 'error' 
          });
          return;
        }

        const nowIso = new Date().toISOString();
        const updatedData = {
          ...profile,
          username: newUsername,
          last_username_change: nowIso
        };

        let { error: updateError } = await supabase.from('profiles').upsert([updatedData]);

        if (updateError) {
          setProfileMessage({ text: `Erreur : ${updateError.message}`, type: 'error' });
        } else {
          setProfile(updatedData);
          localStorage.setItem(`alky_last_change_${profile.id}`, nowIso);
          setProfileMessage({ text: `Ton pseudonyme a bien été changé en "${newUsername}" !`, type: 'success' });
        }
      };

      const handleCreateGroup = async (e) => {
        e.preventDefault();
        setGroupMessage({ text: '', type: '' });

        if (!groupName.trim() || !groupSecret.trim()) {
          setGroupMessage({ text: "Remplis le nom du groupe et le code secret.", type: 'error' });
          return;
        }

        const currentPlanObj = SUBSCRIPTION_PLANS.find(p => p.id === profile.subscription_tier) || SUBSCRIPTION_PLANS[0];
        const maxCreations = currentPlanObj.createLimit;

        let creationsCount = profile.group_creations_count || 0;
        const lastReset = profile.last_group_creation_reset ? new Date(profile.last_group_creation_reset) : new Date();
        const now = new Date();
        const diffDays = (now - lastReset) / (1000 * 60 * 60 * 24);

        if (diffDays >= 30) creationsCount = 0;

        if (creationsCount >= maxCreations) {
          setGroupMessage({ text: `Limite atteinte pour ta formule (${currentPlanObj.name}) : ${maxCreations} max / mois.`, type: 'error' });
          return;
        }

        const updatedProfile = {
          ...profile,
          group_name: groupName.trim(),
          group_code: groupSecret.trim(),
          is_group_admin: true,
          group_creations_count: creationsCount + 1,
          last_group_creation_reset: diffDays >= 30 ? now.toISOString() : profile.last_group_creation_reset
        };

        const { error } = await supabase.from('profiles').upsert([updatedProfile]);

        if (!error) {
          setProfile(updatedProfile);
          setGroupMessage({ text: `Groupe "${groupName}" créé avec succès !`, type: 'success' });
          setGroupName('');
          setGroupSecret('');
          fetchAllLeaderboards();
        } else {
          setGroupMessage({ text: "Erreur lors de la création du groupe.", type: 'error' });
        }
      };

      const handleJoinGroup = async (e) => {
        e.preventDefault();
        setGroupMessage({ text: '', type: '' });

        if (!joinCode.trim()) {
          setGroupMessage({ text: "Entre un code d'invitation valide.", type: 'error' });
          return;
        }

        const { data: groupMembers, error } = await supabase
          .from('profiles')
          .select('group_name, group_code')
          .eq('group_code', joinCode.trim())
          .limit(1);

        if (error || !groupMembers || groupMembers.length === 0) {
          setGroupMessage({ text: "Aucun groupe ne correspond à ce code secret.", type: 'error' });
          return;
        }

        const targetGroup = groupMembers[0];
        const updatedProfile = {
          ...profile,
          group_name: targetGroup.group_name,
          group_code: targetGroup.group_code,
          is_group_admin: false
        };

        const { error: updateErr } = await supabase.from('profiles').upsert([updatedProfile]);

        if (!updateErr) {
          setProfile(updatedProfile);
          setGroupMessage({ text: `Tu as rejoint le groupe "${targetGroup.group_name}" !`, type: 'success' });
          setJoinCode('');
          fetchAllLeaderboards();
        } else {
          setGroupMessage({ text: "Erreur lors de l'adhésion.", type: 'error' });
        }
      };

      const handleLeaveGroup = async () => {
        if (!confirm("Veux-tu vraiment quitter ton groupe actuel ?")) return;

        const updatedProfile = {
          ...profile,
          group_name: null,
          group_code: null,
          is_group_admin: false
        };

        const { error } = await supabase.from('profiles').upsert([updatedProfile]);
        if (!error) {
          setProfile(updatedProfile);
          setGroupMessage({ text: "Tu as quitté ton groupe.", type: 'success' });
          fetchAllLeaderboards();
        }
      };

      const handleUpdateSubscription = async (plan) => {
        if (!session || !profile) {
          setPendingTab('home');
          setShowAuthModal(true);
          return;
        }

        const isMinor = new Date().getFullYear() - new Date(profile.birthdate).getFullYear() < 18;
        if (plan.id !== 'gratuit' && isMinor) {
          const confirmParent = confirm("Notice de protection des mineurs :\nPour souscrire un abonnement payant, un accord parental est requis. As-tu l'accord de tes parents ?");
          if (!confirmParent) return;
        }

        const updatedProfile = {
          ...profile,
          subscription_tier: plan.id,
          daily_challenges_limit: plan.limit
        };

        const { error } = await supabase.from('profiles').upsert([updatedProfile]);

        if (!error) {
          setProfile(updatedProfile);
          alert(`Félicitations ! Abonnement mis à jour vers "${plan.name}". Tu as désormais ${plan.limit} défi(s) par jour.`);
        } else {
          alert("Erreur lors de la mise à jour de l'abonnement.");
        }
      };

      const handleLocateMe = () => {
        if (navigator.geolocation) {
          setIsLocating(true);
          navigator.geolocation.getCurrentPosition(
            (position) => {
              setUserLocation({
                lat: position.coords.latitude,
                lng: position.coords.longitude
              });
              setIsLocating(false);
            },
            () => {
              alert("Impossible de récupérer votre position.");
              setIsLocating(false);
            },
            { timeout: 10000 }
          );
        } else {
          alert("La géolocalisation n'est pas supportée par votre navigateur.");
        }
      };

      const handleSearchAddress = async (e) => {
        e.preventDefault();
        if (!searchAddress.trim()) return;

        setSearchLoading(true);
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchAddress)}`);
          const data = await response.json();
          if (data && data.length > 0) {
            setUserLocation({
              lat: parseFloat(data[0].lat),
              lng: parseFloat(data[0].lon)
            });
          } else {
            alert("Aucun lieu trouvé pour cette recherche.");
          }
        } catch (err) {
          alert("Erreur lors de la recherche d'adresse.");
        } finally {
          setSearchLoading(false);
        }
      };

      const handleSubmitProof = async (e) => {
        e.preventDefault();
        if (!proofFile || !selectedChallenge) return;

        setUploadingProof(true);
        setProofMessage({ text: '', type: '' });

        try {
          // 1. Upload de l'image dans le bucket proofs
          const fileExt = proofFile.name.split('.').pop();
          const fileName = `${profile.id}-${Date.now()}.${fileExt}`;
          const { error: uploadError } = await supabase.storage.from('proofs').upload(fileName, proofFile);

          if (uploadError) throw uploadError;

          // 2. Récupérer l'URL publique
          const { data: { publicUrl } } = supabase.storage.from('proofs').getPublicUrl(fileName);

          // 3. Enregistrer dans la table submissions (En attente)
          const { error: insertError } = await supabase.from('submissions').insert([{
            user_id: profile.id,
            username: profile.username,
            challenge_title: selectedChallenge.title,
            proof_url: publicUrl,
            status: 'pending'
          }]);

          if (insertError) throw insertError;

          setProofMessage({ text: "Preuve envoyée ! Elle est en attente de vérification par un administrateur ⏳", type: 'success' });
          setTimeout(() => {
            setSelectedChallenge(null);
            setProofFile(null);
            setProofMessage({ text: '', type: '' });
          }, 3000);
        } catch (err) {
          setProofMessage({ text: `Erreur : ${err.message}`, type: 'error' });
        } finally {
          setUploadingProof(false);
        }
      };

      const handleApproveSubmission = async (sub) => {
        // 1. Récupérer le solde actuel de l'utilisateur
        const { data: targetUser } = await supabase.from('profiles').select('alky_balance, completed_challenges_count').eq('id', sub.user_id).single();
        if (!targetUser) return;

        const newBalance = (targetUser.alky_balance || 0) + 1;
        const newCount = (targetUser.completed_challenges_count || 0) + 1;

        // 2. Mettre à jour le profil de l'utilisateur
        await supabase.from('profiles').update({
          alky_balance: newBalance,
          completed_challenges_count: newCount
        }).eq('id', sub.user_id);

        // 3. Mettre à jour la soumission en 'approved'
        await supabase.from('submissions').update({ status: 'approved' }).eq('id', sub.id);

        fetchAdminSubmissions();
        fetchAllLeaderboards();
      };

      const handleRejectSubmission = async (subId) => {
        await supabase.from('submissions').update({ status: 'rejected' }).eq('id', subId);
        fetchAdminSubmissions();
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          setAuthError(error.message);
        } else {
          setShowAuthModal(false);
          if (pendingTab) {
            setCurrentTab(pendingTab);
            setPendingTab(null);
          }
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { data, error: signUpError } = await supabase.auth.signUp({ 
          email, 
          password,
          options: {
            data: { username, birthdate }
          }
        });

        if (signUpError) {
          setAuthError(signUpError.message);
          return;
        }

        if (data.user) {
          const newProfile = {
            id: data.user.id,
            username,
            birthdate,
            alky_balance: 0,
            streak_days: 0,
            subscription_tier: 'gratuit',
            daily_challenges_limit: 1,
            last_username_change: new Date().toISOString(),
            completed_challenges_count: 0,
            group_name: null,
            group_code: null,
            is_group_admin: false,
            group_creations_count: 0,
            last_group_creation_reset: new Date().toISOString(),
            created_at: new Date().toISOString(),
            is_admin: false
          };
          await supabase.from('profiles').upsert([newProfile]);
          setProfile(newProfile);
          setNewUsername(username);
          setShowAuthModal(false);
          if (pendingTab) {
            setCurrentTab(pendingTab);
            setPendingTab(null);
          }
        }
      };

      const handleGoogleAuth = async () => {
        setAuthError('');
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });
        if (error) setAuthError(error.message);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setProfile(null);
        setCurrentTab('home');
      };

      const navigateProtectedTab = (targetTab) => {
        if (session) {
          setCurrentTab(targetTab);
        } else {
          setPendingTab(targetTab);
          setShowAuthModal(true);
        }
      };

      const formatDaysPlayed = (dateString) => {
        if (!dateString) return "Membre récent";
        const created = new Date(dateString);
        const now = new Date();
        const diffDays = Math.floor(Math.abs(now - created) / (1000 * 60 * 60 * 24));
        if (diffDays === 0) return "Aujourd'hui";
        if (diffDays === 1) return "Depuis 1 jour";
        return `Depuis ${diffDays} jours`;
      };

      const isVipUser = profile?.subscription_tier && profile.subscription_tier !== 'gratuit';
      const currentPlan = SUBSCRIPTION_PLANS.find(p => p.id === profile?.subscription_tier) || SUBSCRIPTION_PLANS[0];

      const currentGroupIndex = groupLeaderboard.findIndex(g => g.name === profile?.group_name);
      const currentGroupData = currentGroupIndex !== -1 ? groupLeaderboard[currentGroupIndex] : null;
      const groupRank = currentGroupIndex !== -1 ? currentGroupIndex + 1 : '-';
      const topContributor = currentGroupData && currentGroupData.members.length > 0 ? currentGroupData.members[0] : null;

      return (
        <div className="min-h-screen bg-white text-slate-900 flex flex-col font-sans pb-12 md:pb-0 md:pt-20 relative overflow-x-hidden">
          
          {/* HEADER DESKTOP */}
          <header className="hidden md:flex fixed top-0 left-0 right-0 h-20 bg-white/95 backdrop-blur-xl border-b border-slate-200 z-50 px-8 items-center justify-between shadow-sm">
            <div className="cursor-pointer flex items-center" onClick={() => setCurrentTab('home')}>
              <img 
                src="logo.png" 
                alt="AlkyAI Logo" 
                className="h-10 w-auto object-contain hover:scale-105 transition-transform" 
                style={{ mixBlendMode: 'multiply' }}
                onError={(e) => { e.target.style.display='none'; }} 
              />
            </div>

            <nav className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
              <NavButton active={currentTab === 'home'} onClick={() => setCurrentTab('home')} label="ACCUEIL" />
              <NavButton active={currentTab === 'challenges'} onClick={() => setCurrentTab('challenges')} label="DÉFIS" />
              <NavButton active={currentTab === 'map'} onClick={() => setCurrentTab('map')} label="CARTE" />
              <NavButton active={currentTab === 'leaderboard'} onClick={() => setCurrentTab('leaderboard')} label="CLASSEMENT" />
              <NavButton active={currentTab === 'groups'} onClick={() => navigateProtectedTab('groups')} label="GROUPES" />
              {profile?.is_admin && (
                <NavButton active={currentTab === 'admin'} onClick={() => setCurrentTab('admin')} label="ADMIN" />
              )}
            </nav>

            <div>
              {session ? (
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-4 py-2 rounded-2xl">
                    <span className="font-black text-alky-blue font-pop text-lg">{profile?.alky_balance || 0}</span>
                    <span className="text-xs text-alky-pink font-extrabold">ALKY</span>
                  </div>
                  <button 
                    onClick={() => setCurrentTab('profile')}
                    className="px-6 py-2.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                  >
                    {profile?.username || 'MON PROFIL'}
                  </button>
                </div>
              ) : (
                <button 
                  onClick={() => { setPendingTab('profile'); setShowAuthModal(true); }} 
                  className="px-6 py-3 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                >
                  MON COMPTE / CONNEXION
                </button>
              )}
            </div>
          </header>

          {/* HEADER MOBILE & BURGER */}
          <header className="md:hidden fixed top-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-xl border-b border-slate-200 z-50 px-4 flex items-center justify-between shadow-sm">
            <div className="cursor-pointer flex items-center" onClick={() => setCurrentTab('home')}>
              <img 
                src="logo.png" 
                alt="AlkyAI Logo" 
                className="h-8 w-auto object-contain" 
                style={{ mixBlendMode: 'multiply' }}
                onError={(e) => { e.target.style.display='none'; }} 
              />
            </div>

            <div className="flex items-center gap-3">
              {session && (
                <div className="flex items-center gap-1.5 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl">
                  <span className="font-black text-alky-blue font-pop text-sm">{profile?.alky_balance || 0}</span>
                  <span className="text-[10px] text-alky-pink font-extrabold">ALKY</span>
                </div>
              )}

              <button 
                onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                className="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-800 transition-colors shadow-sm"
                aria-label="Menu"
              >
                <span className="text-xl font-bold">{isMobileMenuOpen ? '✕' : '☰'}</span>
              </button>
            </div>
          </header>

          {/* MENU DÉROULANT MOBILE (BURGER) */}
          {isMobileMenuOpen && (
            <div className="md:hidden fixed inset-x-0 top-16 bg-white/95 backdrop-blur-xl border-b border-slate-200 shadow-xl z-40 p-4 space-y-2">
              <MobileBurgerButton active={currentTab === 'home'} onClick={() => { setCurrentTab('home'); setIsMobileMenuOpen(false); }} label="ACCUEIL" />
              <MobileBurgerButton active={currentTab === 'challenges'} onClick={() => { setCurrentTab('challenges'); setIsMobileMenuOpen(false); }} label="DÉFIS" />
              <MobileBurgerButton active={currentTab === 'map'} onClick={() => { setCurrentTab('map'); setIsMobileMenuOpen(false); }} label="CARTE" />
              <MobileBurgerButton active={currentTab === 'leaderboard'} onClick={() => { setCurrentTab('leaderboard'); setIsMobileMenuOpen(false); }} label="CLASSEMENT" />
              <MobileBurgerButton active={currentTab === 'groups'} onClick={() => { navigateProtectedTab('groups'); setIsMobileMenuOpen(false); }} label="GROUPES" />
              {profile?.is_admin && (
                <MobileBurgerButton active={currentTab === 'admin'} onClick={() => { setCurrentTab('admin'); setIsMobileMenuOpen(false); }} label="ADMIN" />
              )}
              <div className="pt-2 border-t border-slate-200">
                <button 
                  onClick={() => { session ? setCurrentTab('profile') : setShowAuthModal(true); setIsMobileMenuOpen(false); }} 
                  className="w-full py-3 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md tracking-wider text-center"
                >
                  {session ? 'Mon Profil' : 'Mon Compte / Connexion'}
                </button>
              </div>
            </div>
          )}

          {/* CONTENU PRINCIPAL */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 md:p-8 relative z-10 space-y-8 md:space-y-12 mt-12 md:mt-0">
            {currentTab === 'home' && (
              <div className="space-y-8 md:space-y-12">
                <div className="bg-gradient-to-br from-blue-50/60 via-purple-50/40 to-pink-50/30 border-2 border-slate-200 rounded-[2rem] md:rounded-[2.5rem] p-6 md:p-14 flex flex-col md:flex-row items-center gap-6 md:gap-10 relative overflow-hidden shadow-sm">
                  <div className="shrink-0 flex items-center justify-center">
                    <img 
                      src="favicon.png" 
                      alt="AlkyAI Logo" 
                      className="w-36 md:w-52 h-auto object-contain animate-bounce duration-1000" 
                      style={{ mixBlendMode: 'multiply' }}
                      onError={(e) => { e.target.style.display='none'; }} 
                    />
                  </div>
                  
                  <div className="flex-1 text-center md:text-left space-y-4">
                    <span className="inline-flex items-center gap-2 text-[11px] md:text-xs font-black font-pop uppercase tracking-widest text-white gradient-alky px-4 py-1.5 rounded-full shadow-sm">
                      <img src="favicon.png" alt="Icon" className="w-4 h-4 object-contain inline-block" onError={(e)=>{e.target.style.display='none';}} />
                      🔥 Défie tes amis
                    </span>
                    <h1 className="text-2xl md:text-5xl font-black font-pop text-slate-900 tracking-wide leading-tight flex flex-wrap items-center justify-center md:justify-start gap-2">
                      <span>Relève des défis épiques, gagne des</span> 
                      <span className="gradient-text-alky">Alky !</span> 
                    </h1>
                    <p className="text-slate-600 text-xs md:text-base font-medium leading-relaxed max-w-xl">
                      <strong>AlkyAI</strong> transforme ta ville et ton quotidien en un immense terrain de jeu. Tes défis changent chaque jour selon ta géolocalisation.
                    </p>
                    
                    <div className="pt-2 flex flex-col sm:flex-row gap-3 justify-center md:justify-start">
                      {!session ? (
                        <button 
                          onClick={() => { setPendingTab('profile'); setShowAuthModal(true); }} 
                          className="w-full sm:w-auto px-6 md:px-8 py-3.5 md:py-4 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-lg btn-pop tracking-wider"
                        >
                          CRÉER UN COMPTE GRATUIT
                        </button>
                      ) : (
                        <button 
                          onClick={() => setCurrentTab('challenges')} 
                          className="w-full sm:w-auto px-6 md:px-8 py-3.5 md:py-4 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-lg btn-pop tracking-wider"
                        >
                          VOIR MES DÉFIS DU JOUR
                        </button>
                      )}
                      <button 
                        onClick={() => setCurrentTab('map')} 
                        className="w-full sm:w-auto px-6 py-3.5 md:py-4 bg-white border-2 border-slate-200 hover:border-alky-blue text-slate-800 font-black font-pop text-xs rounded-2xl transition-all shadow-sm"
                      >
                        VOIR LA CARTE 🗺️
                      </button>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-5 md:gap-6">
                  <div className="card-street rounded-3xl p-6 md:p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-blue-100 text-alky-blue rounded-2xl flex items-center justify-center font-black text-xl mb-4 shadow-sm">📍</div>
                      <h3 className="text-lg md:text-xl font-black font-pop text-slate-900">1. Missions géolocalisées</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Tes défis quotidiens s'affichent sur la carte autour de chez toi. Active ta position GPS !</p>
                    </div>
                    <button onClick={handleLocateMe} disabled={isLocating} className="w-full py-3 bg-blue-50 hover:bg-blue-100 text-alky-blue font-black font-pop text-xs rounded-xl transition-all flex items-center justify-center gap-2">
                      {isLocating ? (
                        <>
                          <span className="w-4 h-4 border-2 border-alky-blue border-t-transparent rounded-full animate-spin"></span>
                          Recherche GPS...
                        </>
                      ) : (
                        userLocation ? "📍 Position activée !" : "Activer ma position"
                      )}
                    </button>
                  </div>

                  <div className="card-street rounded-3xl p-6 md:p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-pink-100 text-alky-pink rounded-2xl flex items-center justify-center font-black text-xl mb-4 shadow-sm">📸</div>
                      <h3 className="text-lg md:text-xl font-black font-pop text-slate-900">2. Preuve photo en attente</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Envoie ta photo de preuve, un administrateur la vérifie pour t'attribuer tes Alky.</p>
                    </div>
                    <button onClick={() => setCurrentTab('challenges')} className="w-full py-3 bg-pink-50 hover:bg-pink-100 text-alky-pink font-black font-pop text-xs rounded-xl transition-all">
                      Voir mes défis
                    </button>
                  </div>

                  <div className="card-street rounded-3xl p-6 md:p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-purple-100 text-alky-purple rounded-2xl flex items-center justify-center font-black text-xl mb-4 shadow-sm">🏆</div>
                      <h3 className="text-lg md:text-xl font-black font-pop text-slate-900">3. Grimpe au classement</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Chaque défi validé te rapporte 1 Alky. Vois ton solde grimper et surclasse ta ville !</p>
                    </div>
                    <button onClick={() => setCurrentTab('leaderboard')} className="w-full py-3 bg-purple-50 hover:bg-purple-100 text-alky-purple font-black font-pop text-xs rounded-xl transition-all">
                      Voir le classement
                    </button>
                  </div>
                </div>

                {/* SECTION ABONNEMENTS / VIP */}
                <div className="space-y-6 pt-4">
                  <div className="text-center space-y-3 px-2">
                    <span className="text-xs font-black font-pop uppercase tracking-widest text-alky-blue bg-blue-50 px-4 py-1.5 rounded-full border border-blue-200">
                      FORMULES D'ABONNEMENT ALKYAI
                    </span>
                    <h2 className="text-2xl md:text-4xl font-black font-pop text-slate-900">Choisis ton accès aux défis</h2>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                    {SUBSCRIPTION_PLANS.map((plan) => {
                      const isCurrent = profile?.subscription_tier === plan.id;
                      return (
                        <div key={plan.id} className={`card-street rounded-3xl p-6 flex flex-col justify-between space-y-6 ${plan.color} relative overflow-hidden`}>
                          {isCurrent && (
                            <div className="absolute top-3 right-3 px-3 py-1 bg-emerald-500 text-white font-black text-[9px] rounded-full uppercase tracking-wider">
                              Actif
                            </div>
                          )}
                          <div className="space-y-4">
                            <div>
                              <h3 className="font-pop font-black text-slate-900 text-base">{plan.name}</h3>
                              <p className="text-2xl font-black font-pop text-alky-blue mt-1">{plan.price}</p>
                            </div>
                            <div className="pt-2 border-t border-slate-200/60 space-y-2">
                              <div>
                                <span className="text-xs font-extrabold text-slate-700">Défis quotidiens :</span>
                                <p className="text-sm font-black font-pop text-alky-pink">{plan.limit} défi{plan.limit > 1 ? 's' : ''} / jour</p>
                              </div>
                            </div>
                          </div>

                          {isCurrent ? (
                            <button disabled className="w-full py-3 bg-slate-200 text-slate-500 font-black font-pop text-xs rounded-xl cursor-not-allowed">
                              OFFRE ACTUELLE
                            </button>
                          ) : (
                            <button onClick={() => handleUpdateSubscription(plan)} className="w-full py-3 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                              CHOISIR CETTE OFFRE
                            </button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {currentTab === 'challenges' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-black font-pop text-slate-900">⚡ TES DÉFIS DU JOUR</h1>
                    <p className="text-slate-500 text-xs mt-1 font-semibold">
                      {session ? `Formule : ${currentPlan.name} (${dailyChallenges.length} défi(s) disponible(s) - 1 Alky chacun)` : "Connecte-toi pour découvrir tes défis personnalisés !"}
                    </p>
                  </div>
                </div>

                {!session ? (
                  <div className="card-street rounded-3xl p-8 md:p-12 text-center bg-slate-50 space-y-4">
                    <h2 className="text-xl font-black font-pop text-slate-900">🔒 Connexion requise</h2>
                    <p className="text-slate-500 text-xs max-w-md mx-auto font-medium">Pour accéder à tes défis quotidiens et soumettre tes preuves photo, connecte-toi.</p>
                    <button onClick={() => { setPendingTab('challenges'); setShowAuthModal(true); }} className="px-8 py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider">
                      SE CONNECTER / S'INSCRIRE
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {dailyChallenges.map((ch, idx) => (
                      <div key={ch.id || idx} className="card-street rounded-3xl p-6 flex flex-col justify-between bg-slate-50 space-y-4">
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-[10px] font-black font-pop uppercase px-3 py-1 bg-blue-100 text-blue-700 rounded-full shadow-sm">
                              {ch.category}
                            </span>
                            <span className="text-xs font-black text-alky-pink bg-pink-50 px-2.5 py-1 rounded-full border border-pink-100 font-pop">
                              {ch.points}
                            </span>
                          </div>
                          <h3 className="text-lg font-black font-pop text-slate-900 mb-2">{ch.title}</h3>
                          <p className="text-slate-500 text-xs font-medium leading-relaxed">{ch.desc}</p>
                        </div>
                        <button onClick={() => setSelectedChallenge(ch)} className="w-full gradient-alky text-white font-black font-pop py-3 rounded-xl text-xs shadow-sm btn-pop tracking-wider">
                          ENVOYER UNE PREUVE PHOTO 📸
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {currentTab === 'map' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-black font-pop text-slate-900">🗺️ CARTE DES DÉFIS DU JOUR</h1>
                    <p className="text-slate-500 text-xs mt-1 font-semibold">Retrouve tes missions géolocalisées autour de ta position.</p>
                  </div>
                  
                  <form onSubmit={handleSearchAddress} className="flex gap-2 w-full sm:w-auto">
                    <input 
                      type="text" 
                      placeholder="Chercher une ville, une adresse..." 
                      value={searchAddress} 
                      onChange={e => setSearchAddress(e.target.value)}
                      className="bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold flex-1 sm:w-64"
                    />
                    <button type="submit" disabled={searchLoading} className="px-5 py-3 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop flex items-center justify-center shrink-0">
                      {searchLoading ? <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> : "🔍 Rechercher"}
                    </button>
                  </form>
                </div>

                <div className="flex justify-start">
                  <button onClick={handleLocateMe} disabled={isLocating} className="px-6 py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider flex items-center justify-center gap-2">
                    {isLocating ? (
                      <>
                        <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        Recherche GPS...
                      </>
                    ) : (
                      "📍 Me localiser (GPS)"
                    )}
                  </button>
                </div>

                <div className="h-[420px] md:h-[500px] card-street rounded-3xl p-2 bg-slate-50 relative overflow-hidden shadow-sm">
                  <MapView userLocation={userLocation} challengesToShow={dailyChallenges} />
                </div>
              </div>
            )}

            {currentTab === 'leaderboard' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <div className="text-center space-y-2">
                  <h1 className="text-2xl md:text-3xl font-black font-pop text-slate-900">🏆 CLASSEMENT EN DIRECT</h1>
                  <p className="text-xs text-slate-500 font-medium">Classement actualisé selon le nombre total d'Alky accumulés.</p>
                </div>

                <div className="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 max-w-md mx-auto">
                  <button onClick={() => setLeaderboardTab('solo')} className={`flex-1 py-3 text-xs font-black font-pop rounded-xl transition-all ${leaderboardTab === 'solo' ? 'bg-white text-alky-blue shadow-md' : 'text-slate-500'}`}>
                    SOLO ({soloLeaderboard.length})
                  </button>
                  <button onClick={() => setLeaderboardTab('groups')} className={`flex-1 py-3 text-xs font-black font-pop rounded-xl transition-all ${leaderboardTab === 'groups' ? 'bg-white text-alky-pink shadow-md' : 'text-slate-500'}`}>
                    PAR GROUPE ({groupLeaderboard.length})
                  </button>
                </div>

                <div className="card-street rounded-3xl p-4 md:p-6 bg-slate-50 space-y-3 shadow-sm">
                  {leaderboardTab === 'solo' ? (
                    soloLeaderboard.length === 0 ? (
                      <p className="text-center text-slate-400 text-xs font-semibold py-8">Aucun joueur au classement.</p>
                    ) : (
                      soloLeaderboard.map((user, index) => (
                        <div key={user.id || index} onClick={() => setSelectedPublicUser(user)} className="flex justify-between items-center p-3.5 md:p-4 bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-alky-blue cursor-pointer transition-all gap-3">
                          <div className="flex items-center gap-3 min-w-0">
                            <span className="font-pop font-black text-alky-blue text-sm md:text-base w-6 shrink-0">#{index + 1}</span>
                            <div className="w-9 h-9 md:w-10 md:h-10 gradient-alky rounded-xl flex items-center justify-center font-black text-white text-xs shadow-sm shrink-0">
                              {user.username?.substring(0, 2).toUpperCase() || 'U'}
                            </div>
                            <div className="min-w-0">
                              <span className="font-black text-slate-800 text-xs md:text-sm flex items-center gap-1.5 truncate">
                                <span className="truncate">{user.username}</span>
                                {user.is_group_admin && <span className="text-[9px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold shrink-0">Admin 👑</span>}
                              </span>
                            </div>
                          </div>
                          <span className="font-pop font-black text-alky-pink text-xs md:text-sm bg-pink-50 px-3 py-1.5 rounded-xl border border-pink-100 shrink-0">
                            {user.alky_balance || 0} ALKY
                          </span>
                        </div>
                      ))
                    )
                  ) : (
                    groupLeaderboard.length === 0 ? (
                      <p className="text-center text-slate-400 text-xs font-semibold py-8">Aucun groupe actif.</p>
                    ) : (
                      groupLeaderboard.map((grp, index) => (
                        <div key={index} className="flex justify-between items-center p-3.5 md:p-4 bg-white rounded-2xl border border-slate-200 shadow-sm gap-3">
                          <div className="flex items-center gap-3 min-w-0">
                            <span className="font-pop font-black text-alky-purple text-sm md:text-base w-6 shrink-0">#{index + 1}</span>
                            <div className="min-w-0">
                              <span className="font-black text-slate-800 text-xs md:text-sm block truncate">🛡️ {grp.name}</span>
                              <span className="text-[10px] text-slate-400 font-bold">{grp.memberCount} membre{grp.memberCount > 1 ? 's' : ''}</span>
                            </div>
                          </div>
                          <span className="font-pop font-black text-alky-purple text-xs md:text-sm bg-purple-50 px-3 py-1.5 rounded-xl border border-purple-100 shrink-0">
                            {grp.totalAlky} ALKY
                          </span>
                        </div>
                      ))
                    )
                  )}
                </div>
              </div>
            )}

            {currentTab === 'admin' && profile?.is_admin && (
              <div className="space-y-6 max-w-4xl mx-auto py-4">
                <div className="text-center space-y-2">
                  <h1 className="text-2xl md:text-3xl font-black font-pop text-slate-900">🛡️ PANNEAU ADMINISTRATEUR</h1>
                  <p className="text-xs text-slate-500 font-medium">Valide ou refuse les preuves photo postées par les joueurs.</p>
                </div>

                <div className="card-street rounded-3xl p-6 bg-slate-50 space-y-4">
                  <h2 className="text-base font-black font-pop text-slate-900">Preuves en attente de vérification ({adminSubmissions.length})</h2>

                  {adminSubmissions.length === 0 ? (
                    <p className="text-center text-slate-400 text-xs font-semibold py-8">Aucune preuve en attente pour le moment !</p>
                  ) : (
                    <div className="space-y-4">
                      {adminSubmissions.map((sub) => (
                        <div key={sub.id} className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4 shadow-sm">
                          <div className="flex items-center gap-4 w-full md:w-auto">
                            <a href={sub.proof_url} target="_blank" rel="noopener noreferrer">
                              <img src={sub.proof_url} alt="Preuve" className="w-20 h-20 object-cover rounded-xl border border-slate-200 hover:scale-105 transition-transform" />
                            </a>
                            <div>
                              <span className="text-xs font-black text-alky-blue block">Joueur : {sub.username}</span>
                              <h3 className="text-sm font-black font-pop text-slate-800 mt-0.5">{sub.challenge_title}</h3>
                              <span className="text-[10px] text-slate-400 font-bold block mt-1">Envoyé le : {new Date(sub.created_at).toLocaleString()}</span>
                            </div>
                          </div>

                          <div className="flex gap-2 w-full md:w-auto">
                            <button onClick={() => handleApproveSubmission(sub)} className="flex-1 md:flex-none px-4 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-black font-pop rounded-xl shadow-md">
                              Valider (+1 Alky) ✅
                            </button>
                            <button onClick={() => handleRejectSubmission(sub.id)} className="flex-1 md:flex-none px-4 py-2.5 bg-red-100 hover:bg-red-200 text-red-600 text-xs font-black font-pop rounded-xl">
                              Refuser ❌
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {currentTab === 'groups' && session && (
              <div className="space-y-6 md:space-y-8 max-w-3xl mx-auto py-2 md:py-6">
                <div className="text-center space-y-2">
                  <h1 className="text-2xl md:text-3xl font-black font-pop text-slate-900">👥 GESTION DES GROUPES</h1>
                  <p className="text-slate-500 text-xs font-medium px-2">
                    {profile?.group_name ? (
                      <span>Tu fais partie de l'équipe : <strong className="text-alky-blue font-bold">{profile.group_name}</strong> {profile.is_group_admin ? <span className="text-amber-600 font-black">(👑 Administrateur)</span> : <span className="text-slate-400">(Membre)</span>}</span>
                    ) : (
                      <span>Tu n'as pas de groupe. Rejoins une équipe ou crée la tienne.</span>
                    )}
                  </p>
                </div>

                {groupMessage.text && (
                  <div className={`p-3 rounded-2xl text-xs font-bold text-center ${groupMessage.type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`}>
                    {groupMessage.text}
                  </div>
                )}

                {profile?.group_name ? (
                  <div className="space-y-6">
                    <div className="card-street rounded-3xl p-6 md:p-8 bg-slate-50 space-y-6">
                      <div className="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-200 pb-6 text-center md:text-left">
                        <div className="flex flex-col md:flex-row items-center gap-4">
                          <div className="w-14 h-14 md:w-16 md:h-16 gradient-alky rounded-3xl flex items-center justify-center text-2xl md:text-3xl shadow-md text-white font-black shrink-0">
                            🛡️
                          </div>
                          <div>
                            <h2 className="text-xl md:text-2xl font-black font-pop text-slate-900">{profile.group_name}</h2>
                            <p className="text-xs text-alky-purple font-extrabold mt-0.5">Position au classement : <strong className="text-sm">#{groupRank}</strong></p>
                          </div>
                        </div>

                        {profile.is_group_admin && (
                          <div className="w-full md:w-auto bg-white p-3 rounded-2xl border border-slate-200 text-center">
                            <span className="text-[10px] text-slate-400 font-bold uppercase block">Code Secret (Admin)</span>
                            <span className="font-mono font-black text-alky-blue text-sm">{profile.group_code}</span>
                          </div>
                        )}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 text-center space-y-1">
                          <span className="text-[10px] text-slate-400 font-bold uppercase block">Membres</span>
                          <p className="text-xl font-black font-pop text-slate-800">{currentGroupData ? currentGroupData.memberCount : 1}</p>
                        </div>
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 text-center space-y-1">
                          <span className="text-[10px] text-slate-400 font-bold uppercase block">Points Totaux</span>
                          <p className="text-xl font-black font-pop text-alky-pink">{currentGroupData ? currentGroupData.totalAlky : profile.alky_balance || 0} ALKY</p>
                        </div>
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 text-center space-y-1">
                          <span className="text-[10px] text-slate-400 font-bold uppercase block">Top Fournisseur 🏆</span>
                          <p className="text-xs md:text-sm font-black font-pop text-alky-blue truncate">{topContributor ? `${topContributor.username} (${topContributor.alky} pts)` : profile.username}</p>
                        </div>
                      </div>

                      <button onClick={handleLeaveGroup} className="w-full py-3.5 bg-red-50 hover:bg-red-100 text-red-600 font-black font-pop text-xs rounded-xl transition-colors">
                        QUITTER LE GROUPE
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="card-street rounded-3xl p-6 bg-slate-50 space-y-4">
                      <h3 className="text-base md:text-lg font-black font-pop text-slate-900">🛡️ Créer mon groupe</h3>
                      <form onSubmit={handleCreateGroup} className="space-y-3">
                        <input type="text" placeholder="Nom du groupe" value={groupName} onChange={e => setGroupName(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold" required />
                        <input type="text" placeholder="Code secret (ex: POTES2026)" value={groupSecret} onChange={e => setGroupSecret(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold" required />
                        <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop">
                          CRÉER ET DEVENIR ADMIN 👑
                        </button>
                      </form>
                    </div>

                    <div className="card-street rounded-3xl p-6 bg-slate-50 space-y-4">
                      <h3 className="text-base md:text-lg font-black font-pop text-slate-900">🔗 Rejoindre un groupe</h3>
                      <form onSubmit={handleJoinGroup} className="space-y-3">
                        <input type="text" placeholder="Entrer le code secret du groupe" value={joinCode} onChange={e => setJoinCode(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold" required />
                        <div className="h-2 md:h-10"></div>
                        <button type="submit" className="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop">
                          REJOINDRE L'ÉQUIPE ✨
                        </button>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            )}

            {currentTab === 'profile' && session && (
              <div className="space-y-6 md:space-y-8 max-w-2xl mx-auto py-2 md:py-4">
                <div className="card-street rounded-3xl p-6 md:p-8 bg-slate-50 space-y-6 md:space-y-8">
                  <div className="flex flex-col sm:flex-row items-center sm:items-start justify-between gap-4 border-b border-slate-200 pb-6 text-center sm:text-left">
                    <div className="flex flex-col sm:flex-row items-center gap-4">
                      <div className="w-16 h-16 gradient-alky rounded-2xl flex items-center justify-center text-2xl font-black font-pop text-white shadow-md shrink-0">
                        {profile?.username?.substring(0, 2).toUpperCase() || 'U'}
                      </div>
                      <div className="min-w-0">
                        <h1 className="text-xl md:text-2xl font-black font-pop text-slate-900 truncate">{profile?.username}</h1>
                        <p className="text-xs text-slate-500 font-medium truncate">{session.user.email}</p>
                      </div>
                    </div>
                    <button onClick={handleLogout} className="px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-extrabold rounded-xl transition-colors shrink-0">
                      Déconnexion
                    </button>
                  </div>

                  <form onSubmit={handleUpdateProfileInfo} className="space-y-4">
                    <h3 className="text-sm md:text-base font-black font-pop text-slate-900">⚙️ Informations Personnelles</h3>
                    {profileMessage.text && (
                      <div className={`p-3 rounded-xl text-xs font-bold text-center ${profileMessage.type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`}>
                        {profileMessage.text}
                      </div>
                    )}
                    <div className="space-y-2">
                      <label className="text-xs font-extrabold text-slate-700">Pseudonyme unique</label>
                      <input type="text" value={newUsername} onChange={e => setNewUsername(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold" required />
                    </div>
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                      ENREGISTRER
                    </button>
                  </form>
                </div>
              </div>
            )}
          </main>

          {/* MODALE SOUMISSION DE PREUVE PHOTO */}
          {selectedChallenge && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full relative border border-slate-200 shadow-2xl space-y-5 text-center">
                <button onClick={() => { setSelectedChallenge(null); setProofFile(null); setProofMessage({text:'', type:''}); }} className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 font-black text-lg">
                  ✕
                </button>

                <div>
                  <span className="text-[10px] font-black font-pop uppercase px-3 py-1 bg-blue-100 text-blue-700 rounded-full">
                    {selectedChallenge.category}
                  </span>
                  <h2 className="text-xl font-black font-pop text-slate-900 mt-2">{selectedChallenge.title}</h2>
                  <p className="text-slate-500 text-xs mt-1 font-medium">{selectedChallenge.desc}</p>
                </div>

                {proofMessage.text ? (
                  <div className={`p-4 rounded-2xl text-xs font-bold ${proofMessage.type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`}>
                    {proofMessage.text}
                  </div>
                ) : (
                  <form onSubmit={handleSubmitProof} className="space-y-4 text-left">
                    <div className="space-y-1">
                      <label className="text-xs font-extrabold text-slate-700">Preuve photo obligatoire 📸</label>
                      <input 
                        type="file" 
                        accept="image/*"
                        required
                        onChange={e => setProofFile(e.target.files[0])}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 font-bold file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-alky-blue file:text-white hover:file:bg-blue-600"
                      />
                    </div>
                    <div className="bg-pink-50 p-3 rounded-xl border border-pink-100 flex justify-between items-center text-xs font-black text-slate-700">
                      <span>Récompense :</span>
                      <span className="text-alky-pink font-pop">+1 ALKY (Après validation)</span>
                    </div>
                    <button type="submit" disabled={uploadingProof} className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider flex items-center justify-center gap-2">
                      {uploadingProof ? (
                        <>
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                          Envoi de la photo...
                        </>
                      ) : (
                        "SOUMETTRE LA PREUVE À L'ADMIN ✨"
                      )}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* MODALE D'ÂGE OBLIGATOIRE */}
          {showAgeModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full border border-slate-200 shadow-2xl space-y-6 text-center">
                <div>
                  <span className="text-3xl">🎂</span>
                  <h2 className="text-xl md:text-2xl font-black font-pop text-slate-900 mt-2">Information requise</h2>
                  <p className="text-slate-500 text-xs mt-1 font-medium leading-relaxed">Indique ta date de naissance.</p>
                </div>
                <form onSubmit={handleSaveBirthdate} className="space-y-4">
                  <input type="date" required value={requiredBirthdate} onChange={e => setRequiredBirthdate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 font-bold" />
                  <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop">VALIDER 🚀</button>
                </form>
              </div>
            </div>
          )}

          {/* MODALE D'AUTHENTIFICATION */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full relative border border-slate-200 shadow-2xl">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 font-black text-lg">✕</button>
                <div className="text-center mb-6">
                  <h2 className="text-xl font-black font-pop text-slate-900">MON COMPTE</h2>
                </div>
                {authError && <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-extrabold rounded-xl text-center">{authError}</div>}
                
                <div className="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 mb-6">
                  <button onClick={() => setAuthMode('login')} className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'login' ? 'bg-white text-alky-blue shadow-sm' : 'text-slate-500'}`}>Connexion</button>
                  <button onClick={() => setAuthMode('register')} className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'register' ? 'bg-white text-alky-pink shadow-sm' : 'text-slate-500'}`}>Inscription</button>
                </div>

                {authMode === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-4">
                    <input type="email" required placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <input type="password" required placeholder="Mot de passe" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md">SE CONNECTER</button>
                  </form>
                ) : (
                  <form onSubmit={handleRegister} className="space-y-4">
                    <input type="text" required placeholder="Pseudonyme" value={username} onChange={e => setUsername(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <input type="date" required value={birthdate} onChange={e => setBirthdate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <input type="email" required placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <input type="password" required placeholder="Mot de passe" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md">CRÉER MON COMPTE</button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function NavButton({ active, onClick, label }) {
      return (
        <button onClick={onClick} className={`px-4 py-2 rounded-xl text-xs font-black font-pop tracking-wider transition-all ${active ? 'gradient-alky text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'}`}>
          {label}
        </button>
      );
    }

    function MobileBurgerButton({ active, onClick, label }) {
      return (
        <button onClick={onClick} className={`w-full text-left px-4 py-3 rounded-xl text-xs font-black font-pop tracking-wider transition-all ${active ? 'gradient-alky text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100'}`}>
          {label}
        </button>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
