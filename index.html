<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AlkyAI - Défie tes amis</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            alky: {
              white: '#ffffff',
              light: '#f8fafc',
              border: '#e2e8f0',
              text: '#0f172a',
              cyan: '#00d2ff',
              blue: '#0066ff',
              purple: '#8a2be2',
              pink: '#ff2a85'
            }
          }
        }
      }
    }
  </script>

  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

    body {
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-pop {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    .gradient-alky {
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 35%, #8a2be2 70%, #ff2a85 100%);
    }

    .gradient-text-alky {
      background: linear-gradient(135deg, #00d2ff 0%, #8a2be2 50%, #ff2a85 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-pop {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-pop:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 20px -5px rgba(0, 102, 255, 0.35);
    }
    .btn-pop:active {
      transform: translateY(1px) scale(0.98);
    }

    .card-street {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-street:hover {
      border-color: #0066ff;
      transform: translateY(-4px);
      box-shadow: 0 15px 30px -10px rgba(0, 102, 255, 0.15);
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      border-radius: 1.5rem;
      z-index: 10;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #ffffff;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="selection:bg-alky-pink selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // CONFIGURATION SUPABASE
    const SUPABASE_URL = "https://hsvxubtiblbdqtpvascr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Bha__1CDuR3ppdQUtSQTqQ_2_KJ2NgP";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function MapView({ userLocation }) {
      useEffect(() => {
        const map = L.map('map').setView(
          userLocation ? [userLocation.lat, userLocation.lng] : [48.8566, 2.3522], 
          13
        );

        L.tileLayer('https://{s}.tile.openstreetmap.de/tiles/osmde/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        if (userLocation) {
          L.marker([userLocation.lat, userLocation.lng])
            .addTo(map)
            .bindPopup("<b>Tu es ici !</b>")
            .openPopup();
        }

        return () => {
          map.remove();
        };
      }, [userLocation]);

      return <div id="map" className="w-full h-full"></div>;
    }

    function App() {
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [currentTab, setCurrentTab] = useState('home');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [pendingAction, setPendingAction] = useState(null); // 'vip' ou 'groups'

      const [leaderboard, setLeaderboard] = useState([]);
      const [userLocation, setUserLocation] = useState(null);

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [birthdate, setBirthdate] = useState('2006-01-01');
      const [authError, setAuthError] = useState('');

      const [groupName, setGroupName] = useState('');
      const [groupSecret, setGroupSecret] = useState('');
      const [joinCode, setJoinCode] = useState('');

      useEffect(() => {
        const hash = window.location.hash;
        if (hash.includes('vip-plans')) {
          setCurrentTab('vip-plans');
        } else if (hash.includes('groups')) {
          setCurrentTab('groups');
        }

        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            setSession(session);
            fetchProfile(session.user.id);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) {
            fetchProfile(session.user.id);
            if (pendingAction === 'vip' || hash.includes('vip-plans')) {
              setCurrentTab('vip-plans');
              setPendingAction(null);
            } else if (pendingAction === 'groups' || hash.includes('groups')) {
              setCurrentTab('groups');
              setPendingAction(null);
            }
          } else {
            setProfile(null);
          }
        });

        return () => subscription.unsubscribe();
      }, [pendingAction]);

      useEffect(() => {
        fetchLeaderboard();

        const channel = supabase
          .channel('public:profiles')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
            fetchLeaderboard();
          })
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, []);

      const fetchProfile = async (userId) => {
        try {
          const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
          if (data) setProfile(data);
        } catch (err) {
          console.error(err);
        }
      };

      const fetchLeaderboard = async () => {
        const { data, error } = await supabase
          .from('profiles')
          .select('username, alky_balance')
          .order('alky_balance', { ascending: false });

        if (!error && data) {
          setLeaderboard(data);
        }
      };

      const handleLocateMe = () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              setUserLocation({
                lat: position.coords.latitude,
                lng: position.coords.longitude
              });
            },
            () => {
              alert("Impossible de récupérer votre position.");
            }
          );
        } else {
          alert("La géolocalisation n'est pas supportée par votre navigateur.");
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          setAuthError(error.message);
        } else {
          setShowAuthModal(false);
          // Redirection immédiate après connexion email
          if (pendingAction === 'vip') {
            setCurrentTab('vip-plans');
            setPendingAction(null);
          } else if (pendingAction === 'groups') {
            setCurrentTab('groups');
            setPendingAction(null);
          }
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { data, error: signUpError } = await supabase.auth.signUp({ 
          email, 
          password,
          options: {
            data: { username, birthdate }
          }
        });

        if (signUpError) {
          setAuthError(signUpError.message);
          return;
        }

        if (data.user) {
          await supabase.from('profiles').upsert([{
            id: data.user.id,
            username,
            birthdate,
            alky_balance: 0,
            streak_days: 0,
            subscription_tier: 'gratuit',
            is_admin: false
          }]);
          fetchProfile(data.user.id);
          setShowAuthModal(false);
          // Redirection immédiate après inscription email
          if (pendingAction === 'vip') {
            setCurrentTab('vip-plans');
            setPendingAction(null);
          } else if (pendingAction === 'groups') {
            setCurrentTab('groups');
            setPendingAction(null);
          }
        }
      };

      const handleGoogleAuth = async () => {
        setAuthError('');
        
        let redirectUrl = window.location.origin + window.location.pathname;
        if (pendingAction === 'vip') {
          redirectUrl += '#vip-plans';
        } else if (pendingAction === 'groups') {
          redirectUrl += '#groups';
        }

        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: redirectUrl
          }
        });
        if (error) setAuthError(error.message);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setProfile(null);
        setCurrentTab('home');
        window.location.hash = '';
      };

      const handleRequireAuth = (actionType) => {
        if (session) {
          // Déjà connecté : on va direct sur la page demandée
          if (actionType === 'vip') setCurrentTab('vip-plans');
          if (actionType === 'groups') setCurrentTab('groups');
        } else {
          // Pas connecté : on mémorise l'action et on ouvre la modale
          setPendingAction(actionType);
          setShowAuthModal(true);
        }
      };

      return (
        <div className="min-h-screen bg-white text-slate-900 flex flex-col font-sans pb-24 md:pb-0 md:pt-20 relative overflow-x-hidden">
          
          {/* HEADER DESKTOP */}
          <header className="hidden md:flex fixed top-0 left-0 right-0 h-20 bg-white/95 backdrop-blur-xl border-b border-slate-200 z-50 px-8 items-center justify-between shadow-sm">
            <div className="cursor-pointer flex items-center" onClick={() => { setCurrentTab('home'); window.location.hash=''; }}>
              <img 
                src="logo.png" 
                alt="AlkyAI Logo" 
                className="h-10 w-auto object-contain hover:scale-105 transition-transform" 
                style={{ mixBlendMode: 'multiply' }}
                onError={(e) => { e.target.style.display='none'; }} 
              />
            </div>

            <nav className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
              <NavButton active={currentTab === 'home'} onClick={() => { setCurrentTab('home'); window.location.hash=''; }} label="ACCUEIL" />
              <NavButton active={currentTab === 'challenges'} onClick={() => { setCurrentTab('challenges'); window.location.hash=''; }} label="DÉFIS" />
              <NavButton active={currentTab === 'map'} onClick={() => { setCurrentTab('map'); window.location.hash=''; }} label="CARTE" />
              <NavButton active={currentTab === 'leaderboard'} onClick={() => { setCurrentTab('leaderboard'); window.location.hash=''; }} label="CLASSEMENT" />
              <NavButton active={currentTab === 'groups'} onClick={() => { handleRequireAuth('groups'); }} label="GROUPES" />
            </nav>

            <div>
              {session ? (
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-4 py-2 rounded-2xl">
                    <span className="font-black text-alky-blue font-pop text-lg">{profile?.alky_balance || 0}</span>
                    <span className="text-xs text-alky-pink font-extrabold">ALKY</span>
                  </div>
                  <button 
                    onClick={() => setCurrentTab('profile')}
                    className="px-6 py-2.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                  >
                    {profile?.username || 'MON PROFIL'}
                  </button>
                </div>
              ) : (
                <button 
                  onClick={() => { setPendingAction(null); setShowAuthModal(true); }} 
                  className="px-6 py-3 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                >
                  MON COMPTE / CONNEXION
                </button>
              )}
            </div>
          </header>

          {/* BARRE DE NAVIGATION MOBILE */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-xl border-t border-slate-200 z-50 px-2 flex items-center justify-around shadow-lg">
            <MobileNavButton active={currentTab === 'home'} onClick={() => { setCurrentTab('home'); window.location.hash=''; }} label="Accueil" />
            <MobileNavButton active={currentTab === 'challenges'} onClick={() => { setCurrentTab('challenges'); window.location.hash=''; }} label="Défis" />
            <MobileNavButton active={currentTab === 'map'} onClick={() => { setCurrentTab('map'); window.location.hash=''; }} label="Carte" />
            <MobileNavButton active={currentTab === 'leaderboard'} onClick={() => { setCurrentTab('leaderboard'); window.location.hash=''; }} label="Classement" />
            <MobileNavButton active={currentTab === 'groups'} onClick={() => { handleRequireAuth('groups'); }} label="Groupes" />
            <button 
              onClick={() => session ? setCurrentTab('profile') : setShowAuthModal(true)} 
              className="flex flex-col items-center justify-center font-black text-[11px] text-alky-blue uppercase font-pop"
            >
              <span>{session ? 'Profil' : 'Compte'}</span>
            </button>
          </nav>

          {/* CONTENU PRINCIPAL */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 relative z-10 space-y-12">
            {currentTab === 'home' && (
              <div className="space-y-12">
                {/* Hero Banner Ultra Intuitif & Dynamique */}
                <div className="bg-gradient-to-br from-blue-50/60 via-purple-50/40 to-pink-50/30 border-2 border-slate-200 rounded-[2.5rem] p-8 md:p-14 flex flex-col md:flex-row items-center gap-10 relative overflow-hidden shadow-sm">
                  <div className="shrink-0 flex items-center justify-center">
                    <img 
                      src="logo.png" 
                      alt="AlkyAI Logo" 
                      className="w-52 h-auto object-contain animate-bounce duration-1000" 
                      style={{ mixBlendMode: 'multiply' }}
                      onError={(e) => { e.target.style.display='none'; }} 
                    />
                  </div>
                  
                  <div className="flex-1 text-center md:text-left space-y-4">
                    <span className="inline-block text-xs font-black font-pop uppercase tracking-widest text-white gradient-alky px-4 py-1.5 rounded-full shadow-sm">
                      🔥 Défie tes amis
                    </span>
                    <h1 className="text-3xl md:text-5xl font-black font-pop text-slate-900 tracking-wide leading-tight">
                      Relève des défis épiques, gagne des <span className="gradient-text-alky">Alky</span> !
                    </h1>
                    <p className="text-slate-600 text-sm md:text-base font-medium leading-relaxed max-w-xl">
                      <strong>AlkyAI</strong> transforme ta ville et ton quotidien en un immense terrain de jeu. Affronte tes amis, valide tes preuves en photo et prends la tête du classement en direct !
                    </p>
                    
                    <div className="pt-2 flex flex-wrap gap-4 justify-center md:justify-start">
                      {!session ? (
                        <button 
                          onClick={() => { setPendingAction(null); setShowAuthModal(true); }} 
                          className="px-8 py-4 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-lg btn-pop tracking-wider"
                        >
                          CRÉER UN COMPTE GRATUIT
                        </button>
                      ) : (
                        <button 
                          onClick={() => setCurrentTab('challenges')} 
                          className="px-8 py-4 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-lg btn-pop tracking-wider"
                        >
                          VOIR MES DÉFIS PERSONNELS
                        </button>
                      )}
                      <button 
                        onClick={() => setCurrentTab('map')} 
                        className="px-6 py-4 bg-white border-2 border-slate-200 hover:border-alky-blue text-slate-800 font-black font-pop text-xs rounded-2xl transition-all shadow-sm"
                      >
                        VOIR LA CARTE 🗺️
                      </button>
                    </div>
                  </div>
                </div>

                {/* Section Explicative claire et intuitive */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="card-street rounded-3xl p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-blue-100 text-alky-blue rounded-2xl flex items-center justify-center font-black text-xl mb-4">📍</div>
                      <h3 className="text-xl font-black font-pop text-slate-900">1. Trouve des missions</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Ouvre la carte interactive, repère les défis autour de toi grâce à ta géolocalisation et sors t'amuser.</p>
                    </div>
                    <button onClick={handleLocateMe} className="w-full py-3 bg-blue-50 hover:bg-blue-100 text-alky-blue font-black font-pop text-xs rounded-xl transition-all">
                      {userLocation ? "📍 Position activée !" : "Activer ma position"}
                    </button>
                  </div>

                  <div className="card-street rounded-3xl p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-pink-100 text-alky-pink rounded-2xl flex items-center justify-center font-black text-xl mb-4">📸</div>
                      <h3 className="text-xl font-black font-pop text-slate-900">2. Prends une photo</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Réalise l'action demandée avec tes amis, prends une photo de preuve et valide ton exploit.</p>
                    </div>
                    <button onClick={() => setCurrentTab('challenges')} className="w-full py-3 bg-pink-50 hover:bg-pink-100 text-alky-pink font-black font-pop text-xs rounded-xl transition-all">
                      Voir les défis disponibles
                    </button>
                  </div>

                  <div className="card-street rounded-3xl p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-purple-100 text-alky-purple rounded-2xl flex items-center justify-center font-black text-xl mb-4">🏆</div>
                      <h3 className="text-xl font-black font-pop text-slate-900">3. Grimpe au classement</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Chaque défi validé te rapporte des Alky. Vois ton solde grimper et surclasse tes potes en direct !</p>
                    </div>
                    <button onClick={() => setCurrentTab('leaderboard')} className="w-full py-3 bg-purple-50 hover:bg-purple-100 text-alky-purple font-black font-pop text-xs rounded-xl transition-all">
                      Voir le classement en direct
                    </button>
                  </div>
                </div>

                {/* SECTION GROUPE ANIMÉE & IMMERSIVE */}
                <div className="relative rounded-[3.5rem] p-8 md:p-16 gradient-alky text-white shadow-2xl overflow-hidden animate-float">
                  <div className="relative z-10 grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
                    <div className="space-y-6 text-center lg:text-left">
                      <span className="inline-block text-xs font-black font-pop uppercase tracking-widest text-slate-900 bg-white px-4 py-1.5 rounded-full shadow-md">
                        🔥 MODE GROUPE & AMIS
                      </span>
                      <h2 className="text-3xl md:text-5xl font-black font-pop leading-tight">
                        Joue avec tes amis, créez votre groupe et dominez tout !
                      </h2>
                      <p className="text-white/90 text-sm md:text-base font-medium leading-relaxed">
                        Le cœur d'AlkyAI, c'est l'affrontement entre potes. Rejoins un groupe ou crée ton propre clan pour partager vos exploits, multiplier vos gains d'Alky et régner sur le classement de la ville.
                      </p>
                      <div>
                        <button 
                          onClick={() => handleRequireAuth('groups')} 
                          className="px-10 py-4 bg-slate-900 text-white font-black font-pop text-xs rounded-2xl shadow-xl hover:bg-slate-800 transition-all transform hover:scale-105 tracking-wider"
                        >
                          REJOINDRE OU CRÉER UN GROUPE 🚀
                        </button>
                      </div>
                    </div>

                    <div className="flex items-center justify-center">
                      <div className="w-full h-64 md:h-80 bg-white/10 backdrop-blur-md rounded-3xl border-2 border-white/30 flex flex-col items-center justify-center p-6 text-center shadow-inner group">
                        <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-3xl mb-3 shadow">
                          🖼️
                        </div>
                        <p className="text-white font-black font-pop text-sm">Zone prête pour ton illustration</p>
                        <p className="text-white/70 text-xs mt-1 font-medium">Glisse ton image ici ou personnalise ce bloc plus tard</p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* SECTION ABONNEMENTS & PASS VIP */}
                <div className="card-street rounded-[2.5rem] p-8 md:p-10 bg-gradient-to-r from-slate-900 to-slate-800 text-white shadow-xl relative overflow-hidden">
                  <div className="absolute -right-10 -bottom-10 opacity-10 text-9xl font-black font-pop">VIP</div>
                  <div className="relative z-10 max-w-2xl space-y-3">
                    <span className="text-xs font-black font-pop uppercase tracking-widest text-alky-cyan bg-cyan-950 px-3 py-1 rounded-full border border-cyan-800">
                      ⚡ ABONNEMENTS & PASS VIP
                    </span>
                    <h2 className="text-2xl md:text-3xl font-black font-pop">Débloque ton plein potentiel avec AlkyAI+</h2>
                    <p className="text-slate-300 text-xs md:text-sm font-medium leading-relaxed">
                      Profite de défis exclusifs illimités, double tes gains d'Alky à chaque validation et accède aux classements privés de ton école ou de ton groupe d'amis !
                    </p>
                    <div className="pt-2">
                      <button onClick={() => handleRequireAuth('vip')} className="px-6 py-3 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                        DÉCOUVRIR LES OFFRES ⚡
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {currentTab === 'vip-plans' && (
              <div className="space-y-8 max-w-4xl mx-auto py-6">
                <div className="text-center space-y-3">
                  <span className="text-xs font-black font-pop uppercase tracking-widest text-alky-blue bg-blue-50 px-4 py-1.5 rounded-full border border-blue-200">
                    ⚡ BOUTIQUE DES FORFAITS VIP
                  </span>
                  <h1 className="text-3xl md:text-4xl font-black font-pop text-slate-900">Choisis ton abonnement AlkyAI+</h1>
                  <p className="text-slate-500 text-xs md:text-sm font-medium">
                    Connecté en tant que <strong className="text-alky-blue">{profile?.username || session?.user?.email}</strong>
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4">
                  <div className="card-street rounded-3xl p-8 bg-slate-50 flex flex-col justify-between space-y-6">
                    <div className="space-y-4">
                      <div className="flex justify-between items-center">
                        <span className="font-pop font-black text-sm uppercase text-slate-600">Pass Mensuel</span>
                        <span className="text-2xl font-black font-pop text-alky-blue">4.99 € <span className="text-xs text-slate-400 font-normal">/ mois</span></span>
                      </div>
                      <ul className="space-y-3 text-xs text-slate-600 font-medium">
                        <li>✔️ Défis exclusifs illimités</li>
                        <li>✔️ Double tes gains d'Alky</li>
                        <li>✔️ Badge VIP sur le classement</li>
                      </ul>
                    </div>
                    <button 
                      onClick={() => alert("Redirection vers la passerelle de paiement sécurisée pour le Pass Mensuel...")} 
                      className="w-full py-4 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                    >
                      SOUSCRIRE AU PASS MENSUEL
                    </button>
                  </div>

                  <div className="card-street rounded-3xl p-8 bg-slate-900 text-white flex flex-col justify-between space-y-6 border-alky-blue shadow-xl">
                    <div className="space-y-4">
                      <div className="flex justify-between items-center">
                        <span className="font-pop font-black text-sm uppercase text-alky-cyan">Pass Annuel (Best Value)</span>
                        <span className="text-2xl font-black font-pop text-white">39.99 € <span className="text-xs text-slate-400 font-normal">/ an</span></span>
                      </div>
                      <ul className="space-y-3 text-xs text-slate-300 font-medium">
                        <li>✔️ Tous les avantages du Pass Mensuel</li>
                        <li>✔️ 2 mois offerts</li>
                        <li>✔️ Accès anticipé aux nouvelles fonctionnalités</li>
                      </ul>
                    </div>
                    <button 
                      onClick={() => alert("Redirection vers la passerelle de paiement sécurisée pour le Pass Annuel...")} 
                      className="w-full py-4 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                    >
                      PROFITER DU PASS ANNUEL 🚀
                    </button>
                  </div>
                </div>
              </div>
            )}

            {currentTab === 'challenges' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-3xl font-black font-pop text-slate-900">⚡ CATALOGUE DES DÉFIS</h1>
                  <p className="text-slate-500 text-xs mt-1 font-semibold">
                    {session ? "Voici tes défis personnalisés basés sur ton profil." : "Connecte-toi pour voir et relever tes défis personnalisés entre amis !"}
                  </p>
                </div>

                {!session ? (
                  <div className="card-street rounded-3xl p-12 text-center bg-slate-50 space-y-4">
                    <h2 className="text-xl font-black font-pop text-slate-900">🔒 Connexion requise</h2>
                    <p className="text-slate-500 text-xs max-w-md mx-auto font-medium">Pour accéder à tes défis personnalisés, valider tes photos de preuve et gagner des Alky, connecte-toi à ton compte.</p>
                    <button 
                      onClick={() => { setPendingAction(null); setShowAuthModal(true); }} 
                      className="px-8 py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                    >
                      SE CONNECTER / S'INSCRIRE
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <ChallengeCard title="20 Pompes Extérieures" category="SPORT" points="+40 ALKY" color="bg-blue-100 text-blue-700" />
                    <ChallengeCard title="Photo d'un Monument" category="CULTURE" points="+30 ALKY" color="bg-purple-100 text-purple-700" />
                    <ChallengeCard title="Ramasser un déchet" category="ÉCOLOGIE" points="+50 ALKY" color="bg-emerald-100 text-emerald-700" />
                  </div>
                )}
              </div>
            )}

            {currentTab === 'map' && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-3xl font-black font-pop text-slate-900">🗺️ CARTE DES DÉFIS</h1>
                    <p className="text-slate-500 text-xs mt-1 font-semibold">Trouve les missions géolocalisées autour de toi.</p>
                  </div>
                  <button 
                    onClick={handleLocateMe}
                    className="px-6 py-3 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider flex items-center justify-center gap-2"
                  >
                    <span>📍 Me localiser</span>
                  </button>
                </div>
                <div className="h-[500px] card-street rounded-3xl p-2 bg-slate-50 relative overflow-hidden shadow-sm">
                  <MapView userLocation={userLocation} />
                </div>
              </div>
            )}

            {currentTab === 'leaderboard' && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <h1 className="text-3xl font-black font-pop text-slate-900">🏆 CLASSEMENT EN DIRECT</h1>
                <div className="card-street rounded-3xl p-6 bg-slate-50 space-y-3 shadow-sm">
                  {leaderboard.length === 0 ? (
                    <p className="text-center text-slate-400 text-xs font-semibold py-8">Aucun utilisateur dans le classement pour le moment.</p>
                  ) : (
                    leaderboard.map((user, index) => (
                      <div key={index} className="flex justify-between items-center p-4 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div className="flex items-center gap-3">
                          <span className="font-pop font-black text-alky-blue text-base w-6">#{index + 1}</span>
                          <span className="font-black text-slate-800 text-sm">{user.username || 'Explorateur'}</span>
                        </div>
                        <span className="font-pop font-black text-alky-pink text-sm bg-pink-50 px-3 py-1 rounded-xl border border-pink-100">
                          {user.alky_balance || 0} ALKY
                        </span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {currentTab === 'groups' && (
              <div className="space-y-8 max-w-3xl mx-auto py-6">
                <div className="text-center space-y-2">
                  <h1 className="text-3xl font-black font-pop text-slate-900">👥 GESTION DES GROUPES</h1>
                  <p className="text-slate-500 text-xs font-medium">
                    Connecté en tant que <strong className="text-alky-blue">{profile?.username || session?.user?.email}</strong>. Crée ton équipe ou rejoins un groupe existant.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="card-street rounded-3xl p-6 bg-slate-50 space-y-4">
                    <h3 className="text-lg font-black font-pop text-slate-900">🛡️ Créer mon groupe</h3>
                    <div className="space-y-3">
                      <input 
                        type="text" 
                        placeholder="Nom du groupe" 
                        value={groupName} 
                        onChange={e => setGroupName(e.target.value)}
                        className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                      />
                      <input 
                        type="text" 
                        placeholder="Code secret (ex: POTES2026)" 
                        value={groupSecret} 
                        onChange={e => setGroupSecret(e.target.value)}
                        className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                      />
                      <button onClick={() => alert("Groupe créé avec succès !")} className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop">
                        CRÉER LE GROUPE 🚀
                      </button>
                    </div>
                  </div>

                  <div className="card-street rounded-3xl p-6 bg-slate-50 space-y-4">
                    <h3 className="text-lg font-black font-pop text-slate-900">🔗 Rejoindre un groupe</h3>
                    <div className="space-y-3">
                      <input 
                        type="text" 
                        placeholder="Entrer le code d'invitation" 
                        value={joinCode} 
                        onChange={e => setJoinCode(e.target.value)}
                        className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                      />
                      <div className="h-10"></div>
                      <button onClick={() => alert("Recherche et adhésion au groupe...")} className="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop">
                        REJOINDRE L'ÉQUIPE ✨
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {currentTab === 'profile' && session && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <div className="card-street rounded-3xl p-8 bg-slate-50 space-y-6">
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 gradient-alky rounded-2xl flex items-center justify-center text-2xl font-black font-pop text-white shadow-md">
                      {profile?.username?.substring(0, 2).toUpperCase() || 'U'}
                    </div>
                    <div>
                      <h1 className="text-2xl font-black font-pop text-slate-900">{profile?.username || 'Utilisateur'}</h1>
                      <p className="text-xs text-alky-blue font-extrabold mt-0.5">Solde : {profile?.alky_balance || 0} ALKY</p>
                    </div>
                  </div>
                  <div className="pt-4 border-t border-slate-200 flex justify-between items-center">
                    <span className="text-xs text-slate-500 font-semibold">Gère ta session en toute sécurité</span>
                    <button onClick={handleLogout} className="px-5 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-extrabold rounded-xl transition-colors">
                      Déconnexion
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER PROFESSIONNEL */}
          <footer className="mt-20 border-t border-slate-200 bg-slate-50 py-12 px-6">
            <div className="max-w-7xl mx-auto flex flex-col items-center justify-center text-center space-y-6">
              <div className="space-y-2">
                <div className="flex items-center justify-center gap-2">
                  <span className="font-pop font-black text-xl text-slate-900">AlkyAI</span>
                </div>
                <p className="text-xs text-slate-600 font-medium max-w-md">
                  AlkyAI - Défie tes amis. Relève des défis et gagne des récompenses.
                </p>
              </div>
              <div className="flex flex-wrap justify-center gap-6 text-xs font-bold text-slate-600">
                <a href="#" className="hover:text-alky-blue transition-colors">Conditions d'utilisation</a>
                <a href="#" className="hover:text-alky-blue transition-colors">Politique de confidentialité</a>
                <a href="#" className="hover:text-alky-blue transition-colors">Support & Aide</a>
              </div>
              <div className="text-xs text-slate-400 font-bold pt-4 border-t border-slate-200 w-full max-w-md">
                AlkyAI@2026 — Tous droits réservés.
              </div>
            </div>
          </footer>

          {/* MODALE D'AUTHENTIFICATION */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-8 max-w-md w-full relative border border-slate-200 shadow-2xl">
                <button 
                  onClick={() => setShowAuthModal(false)} 
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 font-black text-lg"
                >
                  ✕
                </button>

                <div className="text-center mb-6">
                  <img 
                    src="logo.png" 
                    alt="AlkyAI Logo" 
                    className="h-12 w-auto mx-auto mb-2 object-contain" 
                    style={{ mixBlendMode: 'multiply' }}
                    onError={(e) => { e.target.style.display='none'; }} 
                  />
                  <h2 className="text-2xl font-black font-pop text-slate-900">MON COMPTE</h2>
                  <p className="text-slate-500 text-xs mt-1 font-semibold">Connecte-toi ou crée ton profil</p>
                </div>

                {authError && (
                  <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-extrabold rounded-xl text-center">
                    {authError}
                  </div>
                )}

                <button 
                  type="button"
                  onClick={handleGoogleAuth}
                  className="w-full mb-4 py-3 px-4 bg-white border-2 border-slate-200 hover:border-slate-400 text-slate-700 font-bold text-xs rounded-xl flex items-center justify-center gap-3 transition-all shadow-sm"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  Continuer avec Google
                </button>

                <div className="relative flex py-2 items-center mb-4">
                  <div className="flex-grow border-t border-slate-200"></div>
                  <span className="flex-shrink mx-3 text-[10px] text-slate-400 uppercase font-black">ou par email</span>
                  <div className="flex-grow border-t border-slate-200"></div>
                </div>

                <div className="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 mb-6">
                  <button 
                    onClick={() => setAuthMode('login')} 
                    className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'login' ? 'bg-white text-alky-blue shadow-sm' : 'text-slate-500'}`}
                  >
                    Connexion
                  </button>
                  <button 
                    onClick={() => setAuthMode('register')} 
                    className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'register' ? 'bg-white text-alky-pink shadow-sm' : 'text-slate-500'}`}
                  >
                    Inscription
                  </button>
                </div>

                {authMode === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-4">
                    <input 
                      type="email" 
                      required 
                      placeholder="Adresse Email" 
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <input 
                      type="password" 
                      required 
                      placeholder="Mot de passe" 
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                      SE CONNECTER
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleRegister} className="space-y-4">
                    <input 
                      type="text" 
                      required 
                      placeholder="Pseudonyme" 
                      value={username} 
                      onChange={e => setUsername(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <input 
                      type="date" 
                      required 
                      value={birthdate} 
                      onChange={e => setBirthdate(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <input 
                      type="email" 
                      required 
                      placeholder="Adresse Email" 
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <input 
                      type="password" 
                      required 
                      placeholder="Mot de passe" 
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                      CRÉER MON COMPTE
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    function NavButton({ active, onClick, label }) {
      return (
        <button
          onClick={onClick}
          className={`px-4 py-2 rounded-xl text-xs font-black font-pop tracking-wider transition-all ${
            active 
              ? 'gradient-alky text-white shadow-sm' 
              : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
          }`}
        >
          {label}
        </button>
      );
    }

    function MobileNavButton({ active, onClick, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
            active ? 'text-alky-blue font-black' : 'text-slate-400'
          }`}
        >
          <span className="text-[10px] uppercase font-black font-pop tracking-wider">{label}</span>
        </button>
      );
    }

    function ChallengeCard({ title, category, points, color }) {
      return (
        <div className="card-street rounded-3xl p-6 flex flex-col justify-between bg-slate-50">
          <div>
            <div className="flex items-center justify-between mb-4">
              <span className={`text-[10px] font-black font-pop uppercase px-3 py-1 ${color} rounded-full shadow-sm`}>
                {category}
              </span>
              <span className="text-xs font-black text-alky-blue bg-blue-50 px-2.5 py-1 rounded-full border border-blue-200 font-pop">
                {points}
              </span>
            </div>
            <h3 className="text-lg font-black font-pop text-slate-900 mb-2">{title}</h3>
            <p className="text-slate-500 text-xs font-medium mb-6">Réalise l'action et valide ta photo de preuve.</p>
          </div>
          <button className="w-full gradient-alky text-white font-black font-pop py-3 rounded-xl text-xs shadow-sm btn-pop tracking-wider">
            RELEVER LE DÉFI
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
