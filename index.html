<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AlkyAI - Défie tes amis</title>

  <!-- Favicon pour l'onglet du navigateur -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            alky: {
              white: '#ffffff',
              light: '#f8fafc',
              border: '#e2e8f0',
              text: '#0f172a',
              cyan: '#00d2ff',
              blue: '#0066ff',
              purple: '#8a2be2',
              pink: '#ff2a85'
            }
          }
        }
      }
    }
  </script>

  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin=""></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin=""></script>

  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client -->

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

    body {
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .font-pop {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    .gradient-alky {
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 35%, #8a2be2 70%, #ff2a85 100%);
    }

    .gradient-text-alky {
      background: linear-gradient(135deg, #00d2ff 0%, #8a2be2 50%, #ff2a85 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-pop {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-pop:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 20px -5px rgba(0, 102, 255, 0.35);
    }
    .btn-pop:active {
      transform: translateY(1px) scale(0.98);
    }

    .card-street {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-street:hover {
      border-color: #0066ff;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -10px rgba(0, 102, 255, 0.15);
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      border-radius: 1.25rem;
      z-index: 10;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #ffffff;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="selection:bg-alky-pink selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // CONFIGURATION SUPABASE
    const SUPABASE_URL = "https://hsvxubtiblbdqtpvascr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Bha__1CDuR3ppdQUtSQTqQ_2_KJ2NgP";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SUBSCRIPTION_PLANS = [
      { id: 'gratuit', name: 'Gratuit', price: '0 €', limit: 1, createLimit: 1, color: 'border-slate-200 bg-slate-50' },
      { id: 'premium_399', name: 'Premium Bronze', price: '3,99 €/mois', limit: 3, createLimit: 2, color: 'border-blue-200 bg-blue-50/50' },
      { id: 'premium_799', name: 'Premium Argent', price: '7,99 €/mois', limit: 6, createLimit: 4, color: 'border-purple-200 bg-purple-50/50' },
      { id: 'premium_999', name: 'Premium Or', price: '9,99 €/mois', limit: 10, createLimit: 999, color: 'border-amber-300 bg-amber-50/50 shadow-md' }
    ];

    // BANQUE DE DÉFIS QUOTIDIENS SIMULÉS BASÉS SUR LA GÉOLOCALISATION
    const DAILY_CHALLENGES_POOL = [
      { id: 1, title: "20 Pompes sur un banc public", category: "SPORT", points: "+40 ALKY", latOffset: 0.002, lngOffset: 0.001, desc: "Trouve le parc ou la place la plus proche et enchaîne 20 pompes." },
      { id: 2, title: "Selfie devant la fontaine locale", category: "CULTURE", points: "+30 ALKY", latOffset: -0.001, lngOffset: 0.003, desc: "Repère l'eau qui coule dans ton quartier et prends ton équipe en photo." },
      { id: 3, title: "Ramasser 3 déchets urbains", category: "ÉCOLOGIE", points: "+50 ALKY", latOffset: 0.0015, lngOffset: -0.002, desc: "Nettoie un petit coin de ta rue et jette les déchets à la poubelle." },
      { id: 4, title: "Sprint de 100m chronométré", category: "SPORT", points: "+45 ALKY", latOffset: -0.0025, lngOffset: -0.001, desc: "Choisis une ligne droite sécurisée et tape ton record entre amis." },
      { id: 5, title: "Photo du plus vieux bâtiment du coin", category: "CULTURE", points: "+60 ALKY", latOffset: 0.003, lngOffset: 0.002, desc: "Trouve l'architecture la plus ancienne de ton secteur géographique." },
      { id: 6, title: "Saluer un inconnu avec le signe Alky", category: "SOCIAL", points: "+35 ALKY", latOffset: -0.0015, lngOffset: -0.003, desc: "Fais preuve d'audace et répands la bonne humeur autour de toi." },
      { id: 7, title: "Monter 5 étages par les escaliers", category: "SPORT", points: "+25 ALKY", latOffset: 0.001, lngOffset: 0.0025, desc: "Zéro ascenseur aujourd'hui, que des jambes !" },
      { id: 8, title: "Prendre une photo de rue insolite", category: "CULTURE", points: "+35 ALKY", latOffset: -0.002, lngOffset: 0.0015, desc: "Trouve un détail rigolo ou étrange dans ton quartier." },
      { id: 9, title: "Partager sa gourde d'eau", category: "VIE", points: "+20 ALKY", latOffset: 0.0025, lngOffset: -0.0015, desc: "L'hydratation c'est la base, surtout en pleine session de défis." },
      { id: 10, title: "Faire une pyramide humaine", category: "SPORT", points: "+80 ALKY", latOffset: -0.003, lngOffset: -0.002, desc: "Attention à la stabilité ! Prends une photo mémorable de ton groupe." }
    ];

    function MapView({ userLocation, challengesToShow }) {
      useEffect(() => {
        const center = userLocation ? [userLocation.lat, userLocation.lng] : [48.8566, 2.3522];
        const map = L.map('map').setView(center, 14);

        L.tileLayer('https://{s}.tile.openstreetmap.de/tiles/osmde/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        if (userLocation) {
          L.marker([userLocation.lat, userLocation.lng])
            .addTo(map)
            .bindPopup("<b>Tu es ici !</b>")
            .openPopup();
        }

        // Ajouter les marqueurs des défis du jour autour de la position
        if (challengesToShow && challengesToShow.length > 0) {
          challengesToShow.forEach((ch, idx) => {
            const baseLat = userLocation ? userLocation.lat : 48.8566;
            const baseLng = userLocation ? userLocation.lng : 2.3522;
            const markerLat = baseLat + (ch.latOffset || (idx * 0.001));
            const markerLng = baseLng + (ch.lngOffset || (idx * 0.001));

            L.marker([markerLat, markerLng])
              .addTo(map)
              .bindPopup(`<b>⚡ Défi #${idx + 1}: ${ch.title}</b><br>${ch.points} — ${ch.category}`);
          });
        }

        return () => {
          map.remove();
        };
      }, [userLocation, challengesToShow]);

      return <div id="map" className="w-full h-full"></div>;
    }

    function App() {
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [currentTab, setCurrentTab] = useState('home');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showAgeModal, setShowAgeModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [pendingTab, setPendingTab] = useState(null);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      // CLASSEMENT & GROUPES
      const [leaderboardTab, setLeaderboardTab] = useState('solo');
      const [soloLeaderboard, setSoloLeaderboard] = useState([]);
      const [groupLeaderboard, setGroupLeaderboard] = useState([]);
      const [selectedPublicUser, setSelectedPublicUser] = useState(null);
      const [userLocation, setUserLocation] = useState(null);

      // GESTION DES DÉFIS QUOTIDIENS
      const [dailyChallenges, setDailyChallenges] = useState([]);
      const [selectedChallenge, setSelectedChallenge] = useState(null);
      const [proofFile, setProofFile] = useState(null);
      const [proofMessage, setProofMessage] = useState({ text: '', type: '' });

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [birthdate, setBirthdate] = useState('');
      const [requiredBirthdate, setRequiredBirthdate] = useState('');
      const [authError, setAuthError] = useState('');

      const [newUsername, setNewUsername] = useState('');
      const [profileMessage, setProfileMessage] = useState({ text: '', type: '' });

      // Gestion des groupes
      const [groupName, setGroupName] = useState('');
      const [groupSecret, setGroupSecret] = useState('');
      const [joinCode, setJoinCode] = useState('');
      const [groupMessage, setGroupMessage] = useState({ text: '', type: '' });

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            setSession(session);
            fetchOrCreateProfile(session.user);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) {
            fetchOrCreateProfile(session.user);
            if (pendingTab) {
              setCurrentTab(pendingTab);
              setPendingTab(null);
            }
          } else {
            setProfile(null);
          }
        });

        return () => subscription.unsubscribe();
      }, [pendingTab]);

      useEffect(() => {
        fetchAllLeaderboards();

        const channel = supabase
          .channel('public:profiles')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
            fetchAllLeaderboards();
          })
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, []);

      // Générer les défis du jour selon la formule de l'utilisateur
      useEffect(() => {
        const limit = profile?.daily_challenges_limit || 1;
        // Mélanger ou sélectionner les défis basés sur la date du jour pour que ça change chaque jour
        const todayStr = new Date().toDateString();
        let seed = 0;
        for (let i = 0; i < todayStr.length; i++) {
          seed += todayStr.charCodeAt(i);
        }

        const shuffled = [...DAILY_CHALLENGES_POOL].sort((a, b) => {
          return ((seed * a.id) % 10) - ((seed * b.id) % 10);
        });

        setDailyChallenges(shuffled.slice(0, limit));
      }, [profile]);

      const fetchOrCreateProfile = async (user) => {
        try {
          let { data } = await supabase.from('profiles').select('*').eq('id', user.id).single();
          
          if (!data) {
            const defaultUsername = user.user_metadata?.full_name || user.email.split('@')[0];
            const newProfile = {
              id: user.id,
              username: defaultUsername,
              birthdate: null,
              alky_balance: 0,
              streak_days: 0,
              subscription_tier: 'gratuit',
              daily_challenges_limit: 1,
              last_username_change: null,
              completed_challenges_count: 0,
              group_name: null,
              group_code: null,
              is_group_admin: false,
              group_creations_count: 0,
              last_group_creation_reset: new Date().toISOString(),
              created_at: new Date().toISOString(),
              is_admin: false
            };
            await supabase.from('profiles').upsert([newProfile]);
            setProfile(newProfile);
            setNewUsername(newProfile.username);
            setShowAgeModal(true);
          } else {
            setProfile(data);
            setNewUsername(data.username);
            if (!data.birthdate) {
              setShowAgeModal(true);
            }
          }
        } catch (err) {
          console.error("Erreur profil:", err);
        }
      };

      const fetchAllLeaderboards = async () => {
        const { data: soloData } = await supabase
          .from('profiles')
          .select('id, username, alky_balance, created_at, completed_challenges_count, group_name, group_code, is_group_admin')
          .order('alky_balance', { ascending: false });

        if (soloData) {
          setSoloLeaderboard(soloData);

          const groupMap = {};
          soloData.forEach(user => {
            const gName = user.group_name ? user.group_name.trim() : '';
            
            if (gName) {
              if (!groupMap[gName]) {
                groupMap[gName] = { 
                  name: gName, 
                  totalAlky: 0, 
                  memberCount: 0, 
                  members: [], 
                  adminCode: user.group_code || '' 
                };
              }
              groupMap[gName].totalAlky += (user.alky_balance || 0);
              groupMap[gName].memberCount += 1;
              groupMap[gName].members.push({
                username: user.username,
                alky: user.alky_balance || 0,
                isAdmin: user.is_group_admin
              });
            }
          });

          Object.values(groupMap).forEach(g => {
            g.members.sort((a, b) => b.alky - a.alky);
          });

          const groupsArray = Object.values(groupMap).sort((a, b) => b.totalAlky - a.totalAlky);
          setGroupLeaderboard(groupsArray);
        }
      };

      const handleSaveBirthdate = async (e) => {
        e.preventDefault();
        if (!requiredBirthdate) return;

        const updated = { ...profile, birthdate: requiredBirthdate };
        const { error } = await supabase.from('profiles').upsert([updated]);

        if (!error) {
          setProfile(updated);
          setShowAgeModal(false);
        } else {
          alert("Erreur lors de l'enregistrement de votre date de naissance.");
        }
      };

      const handleUpdateProfileInfo = async (e) => {
        e.preventDefault();
        setProfileMessage({ text: '', type: '' });

        if (!newUsername.trim()) {
          setProfileMessage({ text: "Le pseudonyme ne peut pas être vide.", type: 'error' });
          return;
        }

        if (newUsername === profile.username) {
          setProfileMessage({ text: "Tu as déjà ce pseudonyme actuellement.", type: 'error' });
          return;
        }

        const localLastChange = localStorage.getItem(`alky_last_change_${profile.id}`);
        const lastChangeDateStr = profile.last_username_change || localLastChange;

        if (lastChangeDateStr) {
          const lastChange = new Date(lastChangeDateStr);
          const now = new Date();
          const diffDays = (now - lastChange) / (1000 * 60 * 60 * 24);

          if (diffDays < 14) {
            const remainingDays = Math.ceil(14 - diffDays);
            setProfileMessage({ 
              text: `Impossible de changer de pseudo : tu dois attendre encore ${remainingDays} jour(s).`, 
              type: 'error' 
            });
            return;
          }
        }

        const { data: existingUser } = await supabase
          .from('profiles')
          .select('id')
          .eq('username', newUsername)
          .maybeSingle();

        if (existingUser && existingUser.id !== profile.id) {
          setProfileMessage({ 
            text: `Le pseudonyme "${newUsername}" est déjà pris par un autre utilisateur.`, 
            type: 'error' 
          });
          return;
        }

        const nowIso = new Date().toISOString();
        const updatedData = {
          ...profile,
          username: newUsername,
          last_username_change: nowIso
        };

        let { error: updateError } = await supabase.from('profiles').upsert([updatedData]);

        if (updateError) {
          setProfileMessage({ text: `Erreur : ${updateError.message}`, type: 'error' });
        } else {
          setProfile(updatedData);
          localStorage.setItem(`alky_last_change_${profile.id}`, nowIso);
          setProfileMessage({ text: `Ton pseudonyme a bien été changé en "${newUsername}" !`, type: 'success' });
        }
      };

      const handleCreateGroup = async (e) => {
        e.preventDefault();
        setGroupMessage({ text: '', type: '' });

        if (!groupName.trim() || !groupSecret.trim()) {
          setGroupMessage({ text: "Remplis le nom du groupe et le code secret.", type: 'error' });
          return;
        }

        const currentPlanObj = SUBSCRIPTION_PLANS.find(p => p.id === profile.subscription_tier) || SUBSCRIPTION_PLANS[0];
        const maxCreations = currentPlanObj.createLimit;

        let creationsCount = profile.group_creations_count || 0;
        const lastReset = profile.last_group_creation_reset ? new Date(profile.last_group_creation_reset) : new Date();
        const now = new Date();
        const diffDays = (now - lastReset) / (1000 * 60 * 60 * 24);

        if (diffDays >= 30) creationsCount = 0;

        if (creationsCount >= maxCreations) {
          setGroupMessage({ text: `Limite atteinte pour ta formule (${currentPlanObj.name}) : ${maxCreations} max / mois.`, type: 'error' });
          return;
        }

        const updatedProfile = {
          ...profile,
          group_name: groupName.trim(),
          group_code: groupSecret.trim(),
          is_group_admin: true,
          group_creations_count: creationsCount + 1,
          last_group_creation_reset: diffDays >= 30 ? now.toISOString() : profile.last_group_creation_reset
        };

        const { error } = await supabase.from('profiles').upsert([updatedProfile]);

        if (!error) {
          setProfile(updatedProfile);
          setGroupMessage({ text: `Groupe "${groupName}" créé avec succès !`, type: 'success' });
          setGroupName('');
          setGroupSecret('');
          fetchAllLeaderboards();
        } else {
          setGroupMessage({ text: "Erreur lors de la création du groupe.", type: 'error' });
        }
      };

      const handleJoinGroup = async (e) => {
        e.preventDefault();
        setGroupMessage({ text: '', type: '' });

        if (!joinCode.trim()) {
          setGroupMessage({ text: "Entre un code d'invitation valide.", type: 'error' });
          return;
        }

        const { data: groupMembers, error } = await supabase
          .from('profiles')
          .select('group_name, group_code')
          .eq('group_code', joinCode.trim())
          .limit(1);

        if (error || !groupMembers || groupMembers.length === 0) {
          setGroupMessage({ text: "Aucun groupe ne correspond à ce code secret.", type: 'error' });
          return;
        }

        const targetGroup = groupMembers[0];
        const updatedProfile = {
          ...profile,
          group_name: targetGroup.group_name,
          group_code: targetGroup.group_code,
          is_group_admin: false
        };

        const { error: updateErr } = await supabase.from('profiles').upsert([updatedProfile]);

        if (!updateErr) {
          setProfile(updatedProfile);
          setGroupMessage({ text: `Tu as rejoint le groupe "${targetGroup.group_name}" !`, type: 'success' });
          setJoinCode('');
          fetchAllLeaderboards();
        } else {
          setGroupMessage({ text: "Erreur lors de l'adhésion.", type: 'error' });
        }
      };

      const handleLeaveGroup = async () => {
        if (!confirm("Veux-tu vraiment quitter ton groupe actuel ?")) return;

        const updatedProfile = {
          ...profile,
          group_name: null,
          group_code: null,
          is_group_admin: false
        };

        const { error } = await supabase.from('profiles').upsert([updatedProfile]);
        if (!error) {
          setProfile(updatedProfile);
          setGroupMessage({ text: "Tu as quitté ton groupe.", type: 'success' });
          fetchAllLeaderboards();
        }
      };

      const handleUpdateSubscription = async (plan) => {
        if (!session || !profile) {
          setPendingTab('home');
          setShowAuthModal(true);
          return;
        }

        const isMinor = new Date().getFullYear() - new Date(profile.birthdate).getFullYear() < 18;
        if (plan.id !== 'gratuit' && isMinor) {
          const confirmParent = confirm("Notice de protection des mineurs :\nPour souscrire un abonnement payant, un accord parental est requis. As-tu l'accord de tes parents ?");
          if (!confirmParent) return;
        }

        const updatedProfile = {
          ...profile,
          subscription_tier: plan.id,
          daily_challenges_limit: plan.limit
        };

        const { error } = await supabase.from('profiles').upsert([updatedProfile]);

        if (!error) {
          setProfile(updatedProfile);
          alert(`Félicitations ! Abonnement mis à jour vers "${plan.name}". Tu as désormais ${plan.limit} défi(s) par jour.`);
        } else {
          alert("Erreur lors de la mise à jour de l'abonnement.");
        }
      };

      const handleLocateMe = () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              setUserLocation({
                lat: position.coords.latitude,
                lng: position.coords.longitude
              });
            },
            () => {
              alert("Impossible de récupérer votre position.");
            }
          );
        } else {
          alert("La géolocalisation n'est pas supportée par votre navigateur.");
        }
      };

      const handleSubmitProof = async (e) => {
        e.preventDefault();
        if (!proofFile || !selectedChallenge) return;

        // Simulation de validation de preuve photo et gain d'Alky
        const ptsEarned = parseInt(selectedChallenge.points.replace(/[^0-9]/g, '')) || 30;
        const newBalance = (profile.alky_balance || 0) + ptsEarned;
        const newCompletedCount = (profile.completed_challenges_count || 0) + 1;

        const updatedProfile = {
          ...profile,
          alky_balance: newBalance,
          completed_challenges_count: newCompletedCount
        };

        const { error } = await supabase.from('profiles').upsert([updatedProfile]);

        if (!error) {
          setProfile(updatedProfile);
          setProofMessage({ text: `Preuve validée avec succès ! +${ptsEarned} ALKY ajoutés à ton solde ! 🎉`, type: 'success' });
          setTimeout(() => {
            setSelectedChallenge(null);
            setProofFile(null);
            setProofMessage({ text: '', type: '' });
          }, 2500);
          fetchAllLeaderboards();
        } else {
          setProofMessage({ text: "Erreur lors de la validation de la preuve.", type: 'error' });
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          setAuthError(error.message);
        } else {
          setShowAuthModal(false);
          if (pendingTab) {
            setCurrentTab(pendingTab);
            setPendingTab(null);
          }
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { data, error: signUpError } = await supabase.auth.signUp({ 
          email, 
          password,
          options: {
            data: { username, birthdate }
          }
        });

        if (signUpError) {
          setAuthError(signUpError.message);
          return;
        }

        if (data.user) {
          const newProfile = {
            id: data.user.id,
            username,
            birthdate,
            alky_balance: 0,
            streak_days: 0,
            subscription_tier: 'gratuit',
            daily_challenges_limit: 1,
            last_username_change: new Date().toISOString(),
            completed_challenges_count: 0,
            group_name: null,
            group_code: null,
            is_group_admin: false,
            group_creations_count: 0,
            last_group_creation_reset: new Date().toISOString(),
            created_at: new Date().toISOString(),
            is_admin: false
          };
          await supabase.from('profiles').upsert([newProfile]);
          setProfile(newProfile);
          setNewUsername(username);
          setShowAuthModal(false);
          if (pendingTab) {
            setCurrentTab(pendingTab);
            setPendingTab(null);
          }
        }
      };

      const handleGoogleAuth = async () => {
        setAuthError('');
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });
        if (error) setAuthError(error.message);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setProfile(null);
        setCurrentTab('home');
      };

      const navigateProtectedTab = (targetTab) => {
        if (session) {
          setCurrentTab(targetTab);
        } else {
          setPendingTab(targetTab);
          setShowAuthModal(true);
        }
      };

      const formatDaysPlayed = (dateString) => {
        if (!dateString) return "Membre récent";
        const created = new Date(dateString);
        const now = new Date();
        const diffDays = Math.floor(Math.abs(now - created) / (1000 * 60 * 60 * 24));
        if (diffDays === 0) return "Aujourd'hui";
        if (diffDays === 1) return "Depuis 1 jour";
        return `Depuis ${diffDays} jours`;
      };

      const isVipUser = profile?.subscription_tier && profile.subscription_tier !== 'gratuit';
      const currentPlan = SUBSCRIPTION_PLANS.find(p => p.id === profile?.subscription_tier) || SUBSCRIPTION_PLANS[0];

      const currentGroupIndex = groupLeaderboard.findIndex(g => g.name === profile?.group_name);
      const currentGroupData = currentGroupIndex !== -1 ? groupLeaderboard[currentGroupIndex] : null;
      const groupRank = currentGroupIndex !== -1 ? currentGroupIndex + 1 : '-';
      const topContributor = currentGroupData && currentGroupData.members.length > 0 ? currentGroupData.members[0] : null;

      return (
        <div className="min-h-screen bg-white text-slate-900 flex flex-col font-sans pb-12 md:pb-0 md:pt-20 relative overflow-x-hidden">
          
          {/* HEADER DESKTOP */}
          <header className="hidden md:flex fixed top-0 left-0 right-0 h-20 bg-white/95 backdrop-blur-xl border-b border-slate-200 z-50 px-8 items-center justify-between shadow-sm">
            <div className="cursor-pointer flex items-center" onClick={() => setCurrentTab('home')}>
              <img 
                src="logo.png" 
                alt="AlkyAI Logo" 
                className="h-10 w-auto object-contain hover:scale-105 transition-transform" 
                style={{ mixBlendMode: 'multiply' }}
                onError={(e) => { e.target.style.display='none'; }} 
              />
            </div>

            <nav className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
              <NavButton active={currentTab === 'home'} onClick={() => setCurrentTab('home')} label="ACCUEIL" />
              <NavButton active={currentTab === 'challenges'} onClick={() => setCurrentTab('challenges')} label="DÉFIS" />
              <NavButton active={currentTab === 'map'} onClick={() => setCurrentTab('map')} label="CARTE" />
              <NavButton active={currentTab === 'leaderboard'} onClick={() => setCurrentTab('leaderboard')} label="CLASSEMENT" />
              <NavButton active={currentTab === 'groups'} onClick={() => navigateProtectedTab('groups')} label="GROUPES" />
            </nav>

            <div>
              {session ? (
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-4 py-2 rounded-2xl">
                    <span className="font-black text-alky-blue font-pop text-lg">{profile?.alky_balance || 0}</span>
                    <span className="text-xs text-alky-pink font-extrabold">ALKY</span>
                  </div>
                  <button 
                    onClick={() => setCurrentTab('profile')}
                    className="px-6 py-2.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                  >
                    {profile?.username || 'MON PROFIL'}
                  </button>
                </div>
              ) : (
                <button 
                  onClick={() => { setPendingTab('profile'); setShowAuthModal(true); }} 
                  className="px-6 py-3 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                >
                  MON COMPTE / CONNEXION
                </button>
              )}
            </div>
          </header>

          {/* HEADER MOBILE & BURGER */}
          <header className="md:hidden fixed top-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-xl border-b border-slate-200 z-50 px-4 flex items-center justify-between shadow-sm">
            <div className="cursor-pointer flex items-center" onClick={() => setCurrentTab('home')}>
              <img 
                src="logo.png" 
                alt="AlkyAI Logo" 
                className="h-8 w-auto object-contain" 
                style={{ mixBlendMode: 'multiply' }}
                onError={(e) => { e.target.style.display='none'; }} 
              />
            </div>

            <div className="flex items-center gap-3">
              {session && (
                <div className="flex items-center gap-1.5 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl">
                  <span className="font-black text-alky-blue font-pop text-sm">{profile?.alky_balance || 0}</span>
                  <span className="text-[10px] text-alky-pink font-extrabold">ALKY</span>
                </div>
              )}

              <button 
                onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                className="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-800 transition-colors shadow-sm"
                aria-label="Menu"
              >
                <span className="text-xl font-bold">{isMobileMenuOpen ? '✕' : '☰'}</span>
              </button>
            </div>
          </header>

          {/* MENU DÉROULANT MOBILE (BURGER) */}
          {isMobileMenuOpen && (
            <div className="md:hidden fixed inset-x-0 top-16 bg-white/95 backdrop-blur-xl border-b border-slate-200 shadow-xl z-40 p-4 space-y-2">
              <MobileBurgerButton active={currentTab === 'home'} onClick={() => { setCurrentTab('home'); setIsMobileMenuOpen(false); }} label="ACCUEIL" />
              <MobileBurgerButton active={currentTab === 'challenges'} onClick={() => { setCurrentTab('challenges'); setIsMobileMenuOpen(false); }} label="DÉFIS" />
              <MobileBurgerButton active={currentTab === 'map'} onClick={() => { setCurrentTab('map'); setIsMobileMenuOpen(false); }} label="CARTE" />
              <MobileBurgerButton active={currentTab === 'leaderboard'} onClick={() => { setCurrentTab('leaderboard'); setIsMobileMenuOpen(false); }} label="CLASSEMENT" />
              <MobileBurgerButton active={currentTab === 'groups'} onClick={() => { navigateProtectedTab('groups'); setIsMobileMenuOpen(false); }} label="GROUPES" />
              <div className="pt-2 border-t border-slate-200">
                <button 
                  onClick={() => { session ? setCurrentTab('profile') : setShowAuthModal(true); setIsMobileMenuOpen(false); }} 
                  className="w-full py-3 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md tracking-wider text-center"
                >
                  {session ? 'Mon Profil' : 'Mon Compte / Connexion'}

              </div>
            </div>

                    <img 
                      src="favicon.png" 
                      alt="AlkyAI Logo"

                    </p>
                    
                    <div className="pt-2 flex flex-col sm:flex-row gap-3 justify-center md:justify-start">
                      {!session ? (
                        <button 
                          onClick={() => { setPendingTab('profile'); setShowAuthModal(true); }} 
                          className="w-full sm:w-auto px-6 md:px-8 py-3.5 md:py-4 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-lg btn-pop tracking-wider"
                        >
                          CRÉER UN COMPTE GRATUIT
                        </button>
                      ) : (
                        <button 
                          onClick={() => setCurrentTab('challenges')} 
                          className="w-full sm:w-auto px-6 md:px-8 py-3.5 md:py-4 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-lg btn-pop tracking-wider"
                        >
                          VOIR MES DÉFIS DU JOUR
                        </button>
                      )}
                      <button 
                        onClick={() => setCurrentTab('map')} 
                        className="w-full sm:w-auto px-6 py-3.5 md:py-4 bg-white border-2 border-slate-200 hover:border-alky-blue text-slate-800 font-black font-pop text-xs rounded-2xl transition-all shadow-sm"
                      >
                        VOIR LA CARTE 🗺️
                      </button>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-5 md:gap-6">
                  <div className="card-street rounded-3xl p-6 md:p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-blue-100 text-alky-blue rounded-2xl flex items-center justify-center font-black text-xl mb-4 shadow-sm">📍</div>
                      <h3 className="text-lg md:text-xl font-black font-pop text-slate-900">1. Missions géolocalisées</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Tes défis quotidiens s'affichent sur la carte autour de chez toi. Active ta position GPS !</p>
                    </div>
                    <button onClick={handleLocateMe} className="w-full py-3 bg-blue-50 hover:bg-blue-100 text-alky-blue font-black font-pop text-xs rounded-xl transition-all">
                      {userLocation ? "📍 Position activée !" : "Activer ma position"}
                    </button>
                  </div>

                  <div className="card-street rounded-3xl p-6 md:p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-pink-100 text-alky-pink rounded-2xl flex items-center justify-center font-black text-xl mb-4 shadow-sm">📸</div>
                      <h3 className="text-lg md:text-xl font-black font-pop text-slate-900">2. Preuve photo quotidienne</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Réalise l'action du jour, prends une photo avec tes amis et envoie-la pour valider tes gains.</p>
                    </div>
                    <button onClick={() => setCurrentTab('challenges')} className="w-full py-3 bg-pink-50 hover:bg-pink-100 text-alky-pink font-black font-pop text-xs rounded-xl transition-all">
                      Voir mes défis
                    </button>
                  </div>

                  <div className="card-street rounded-3xl p-6 md:p-8 bg-slate-50 flex flex-col justify-between space-y-4">
                    <div>
                      <div className="w-12 h-12 bg-purple-100 text-alky-purple rounded-2xl flex items-center justify-center font-black text-xl mb-4 shadow-sm">🏆</div>
                      <h3 className="text-lg md:text-xl font-black font-pop text-slate-900">3. Grimpe au classement</h3>
                      <p className="text-slate-500 text-xs mt-2 font-medium leading-relaxed">Chaque défi validé te rapporte des Alky. Vois ton solde grimper et surclasse ta ville !</p>
                    </div>
                    <button onClick={() => setCurrentTab('leaderboard')} className="w-full py-3 bg-purple-50 hover:bg-purple-100 text-alky-purple font-black font-pop text-xs rounded-xl transition-all">
                      Voir le classement
                    </button>
                  </div>
                </div>

                <div className="relative rounded-[2.5rem] md:rounded-[3.5rem] p-6 md:p-16 gradient-alky text-white shadow-2xl overflow-hidden animate-float">
                  <div className="relative z-10 grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-10 items-center">
                    <div className="space-y-4 md:space-y-6 text-center lg:text-left">
                      <span className="inline-block text-[11px] md:text-xs font-black font-pop uppercase tracking-widest text-slate-900 bg-white px-4 py-1.5 rounded-full shadow-md">
                        🔥 MODE GROUPE & AMIS
                      </span>
                      <h2 className="text-2xl md:text-5xl font-black font-pop leading-tight">
                        Joue avec tes amis, créez votre groupe et dominez tout !
                      </h2>
                      <p className="text-white/90 text-xs md:text-base font-medium leading-relaxed">
                        Le cœur d'AlkyAI, c'est l'affrontement entre potes. Rejoins un groupe ou crée ton propre clan pour partager vos exploits et régner sur le classement de la ville.
                      </p>
                      <div>
                        <button 
                          onClick={() => navigateProtectedTab('groups')} 
                          className="w-full sm:w-auto px-8 md:px-10 py-4 bg-slate-900 text-white font-black font-pop text-xs rounded-2xl shadow-xl hover:bg-slate-800 transition-all transform hover:scale-105 tracking-wider"
                        >
                          REJOINDRE OU CRÉER UN GROUPE 🚀
                        </button>
                      </div>
                    </div>

                    <div className="flex items-center justify-center">
                      <div className="w-full h-48 md:h-80 bg-white/10 backdrop-blur-md rounded-3xl border-2 border-white/30 flex flex-col items-center justify-center p-6 text-center shadow-inner">
                        <img 
                          src="favicon.png" 
                          alt="Favicon Animate" 
                          className="w-20 h-20 md:w-28 md:h-28 object-contain mb-3 animate-bounce duration-1000 filter drop-shadow-lg" 
                          onError={(e) => { e.target.style.display='none'; }} 
                        />
                        <p className="text-white font-black font-pop text-xs md:text-sm">AlkyAI au sommet</p>
                        <p className="text-white/70 text-[11px] md:text-xs mt-1 font-medium">Ton application de défis préférée</p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* SECTION ABONNEMENTS / VIP */}
                <div className="space-y-6 pt-4">
                  <div className="text-center space-y-3 px-2">
                    <span className="text-xs font-black font-pop uppercase tracking-widest text-alky-blue bg-blue-50 px-4 py-1.5 rounded-full border border-blue-200">
                      FORMULES D'ABONNEMENT ALKYAI
                    </span>
                    <h2 className="text-2xl md:text-4xl font-black font-pop text-slate-900">Choisis ton accès aux défis</h2>
                    <p className="text-slate-500 text-xs md:text-sm font-medium max-w-xl mx-auto">
                      Augmente ton nombre maximal de défis quotidiens et tes créations de groupes !
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                    {SUBSCRIPTION_PLANS.map((plan) => {
                      const isCurrent = profile?.subscription_tier === plan.id;

                      return (
                        <div key={plan.id} className={`card-street rounded-3xl p-6 flex flex-col justify-between space-y-6 ${plan.color} relative overflow-hidden`}>
                          {isCurrent && (
                            <div className="absolute top-3 right-3 px-3 py-1 bg-emerald-500 text-white font-black text-[9px] rounded-full uppercase tracking-wider">
                              Actif
                            </div>
                          )}
                          <div className="space-y-4">
                            <div>
                              <h3 className="font-pop font-black text-slate-900 text-base">{plan.name}</h3>
                              <p className="text-2xl font-black font-pop text-alky-blue mt-1">{plan.price}</p>
                            </div>
                            <div className="pt-2 border-t border-slate-200/60 space-y-2">
                              <div>
                                <span className="text-xs font-extrabold text-slate-700">Défis quotidiens :</span>
                                <p className="text-sm font-black font-pop text-alky-pink">{plan.limit} défi{plan.limit > 1 ? 's' : ''} / jour</p>
                              </div>
                              <div>
                                <span className="text-xs font-extrabold text-slate-700">Création de groupes :</span>
                                <p className="text-sm font-black font-pop text-alky-purple">{plan.createLimit === 999 ? 'Illimité' : `${plan.createLimit} / mois`}</p>
                              </div>
                            </div>
                          </div>

                          {isCurrent ? (
                            <button 
                              disabled
                              className="w-full py-3 bg-slate-200 text-slate-500 font-black font-pop text-xs rounded-xl cursor-not-allowed"
                            >
                              OFFRE ACTUELLE
                            </button>
                          ) : (
                            <button 
                              onClick={() => handleUpdateSubscription(plan)} 
                              className="w-full py-3 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider"
                            >
                              CHOISIR CETTE OFFRE
                            </button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {currentTab === 'challenges' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-black font-pop text-slate-900">⚡ TES DÉFIS DU JOUR</h1>
                    <p className="text-slate-500 text-xs mt-1 font-semibold">
                      {session ? `Formule : ${currentPlan.name} (${dailyChallenges.length} défi(s) disponible(s) aujourd'hui)` : "Connecte-toi pour découvrir tes défis personnalisés !"}
                    </p>
                  </div>
                  {session && (
                    <button 
                      onClick={handleLocateMe}
                      className="px-5 py-3 bg-blue-50 hover:bg-blue-100 text-alky-blue font-black font-pop text-xs rounded-2xl border border-blue-200 transition-all flex items-center justify-center gap-2"
                    >
                      <span>📍 Actualiser ma position GPS</span>
                    </button>
                  )}
                </div>

                {!session ? (
                  <div className="card-street rounded-3xl p-8 md:p-12 text-center bg-slate-50 space-y-4">
                    <h2 className="text-xl font-black font-pop text-slate-900">🔒 Connexion requise</h2>
                    <p className="text-slate-500 text-xs max-w-md mx-auto font-medium">Pour accéder à tes défis quotidiens, valider tes photos de preuve et gagner des Alky, connecte-toi.</p>
                    <button 
                      onClick={() => { setPendingTab('challenges'); setShowAuthModal(true); }} 
                      className="px-8 py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                    >
                      SE CONNECTER / S'INSCRIRE
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {dailyChallenges.map((ch, idx) => (
                      <div key={ch.id || idx} className="card-street rounded-3xl p-6 flex flex-col justify-between bg-slate-50 space-y-4">
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-[10px] font-black font-pop uppercase px-3 py-1 bg-blue-100 text-blue-700 rounded-full shadow-sm">
                              {ch.category}
                            </span>
                            <span className="text-xs font-black text-alky-pink bg-pink-50 px-2.5 py-1 rounded-full border border-pink-100 font-pop">
                              {ch.points}
                            </span>
                          </div>
                          <h3 className="text-lg font-black font-pop text-slate-900 mb-2">{ch.title}</h3>
                          <p className="text-slate-500 text-xs font-medium leading-relaxed">{ch.desc}</p>
                        </div>
                        <button 
                          onClick={() => setSelectedChallenge(ch)}
                          className="w-full gradient-alky text-white font-black font-pop py-3 rounded-xl text-xs shadow-sm btn-pop tracking-wider"
                        >
                          RELEVER ET VALIDER LA PREUVE 📸
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {currentTab === 'map' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-black font-pop text-slate-900">🗺️ CARTE DES DÉFIS DU JOUR</h1>
                    <p className="text-slate-500 text-xs mt-1 font-semibold">Retrouve tes missions géolocalisées autour de ta position.</p>

                  <h2 className="text-xl md:text-2xl font-black font-pop text-slate-900 mt-2">Information requise</h2>
                  <p className="text-slate-500 text-xs mt-1 font-medium leading-relaxed">
                    Afin de finaliser ton compte en toute sécurité, indique ta date de naissance.
                  </p>
                </div>

                <form onSubmit={handleSaveBirthdate} className="space-y-4">
                  <div className="text-left space-y-1">
                    <label className="text-xs font-extrabold text-slate-700">Date de naissance</label>
                    <input 
                      type="date" 
                      required 
                      value={requiredBirthdate} 
                      onChange={e => setRequiredBirthdate(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold"
                    />
                  </div>
                  <button 
                    type="submit" 
                    className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider"
                  >
                    VALIDER ET CONTINUER 🚀
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODALE D'AUTHENTIFICATION */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full relative border border-slate-200 shadow-2xl">
                <button 
                  onClick={() => setShowAuthModal(false)} 
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 font-black text-lg"
                >
                  ✕
                </button>

                <div className="text-center mb-6">
                  <img 
                    src="logo.png" 
                    alt="AlkyAI Logo" 
                    className="h-10 md:h-12 w-auto mx-auto mb-2 object-contain" 
                    style={{ mixBlendMode: 'multiply' }}
                    onError={(e) => { e.target.style.display='none'; }} 
                  />
                  <h2 className="text-xl md:text-2xl font-black font-pop text-slate-900">MON COMPTE</h2>
                  <p className="text-slate-500 text-xs mt-1 font-semibold">Connecte-toi ou crée ton profil</p>
                </div>

                {authError && (
                  <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-extrabold rounded-xl text-center">
                    {authError}
                  </div>
                )}

                <button 
                  type="button"
                  onClick={handleGoogleAuth}
                  className="w-full mb-4 py-3 px-4 bg-white border-2 border-slate-200 hover:border-slate-400 text-slate-700 font-bold text-xs rounded-xl flex items-center justify-center gap-3 transition-all shadow-sm"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  Continuer avec Google
                </button>

                <div className="relative flex py-2 items-center mb-4">
                  <div className="flex-grow border-t border-slate-200"></div>
                  <span className="flex-shrink mx-3 text-[10px] text-slate-400 uppercase font-black">ou par email</span>
                  <div className="flex-grow border-t border-slate-200"></div>
                </div>

                <div className="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 mb-6">
                  <button 
                    onClick={() => setAuthMode('login')} 
                    className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'login' ? 'bg-white text-alky-blue shadow-sm' : 'text-slate-500'}`}
                  >
                    Connexion
                  </button>
                  <button 
                    onClick={() => setAuthMode('register')} 
                    className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'register' ? 'bg-white text-alky-pink shadow-sm' : 'text-slate-500'}`}
                  >
                    Inscription
                  </button>
                </div>

                {authMode === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-4">
                    <input 
                      type="email" 
                      required 
                      placeholder="Adresse Email" 
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold"
                    />
                    <input 
                      type="password" 
                      required 
                      placeholder="Mot de passe" 
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold"
                    />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                      SE CONNECTER
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleRegister} className="space-y-4">
                    <input 
                      type="text" 
                      required 
                      placeholder="Pseudonyme unique" 
                      value={username} 
                      onChange={e => setUsername(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold"
                    />
                    <input 
                      type="date" 
                      required 
                      value={birthdate} 
                      onChange={e => setBirthdate(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold"
                    />
                    <input 
                      type="email" 
                      required 
                      placeholder="Adresse Email" 
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold"
                    />
                    <input 
                      type="password" 
                      required 
                      placeholder="Mot de passe" 
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue font-bold"
                    />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                      CRÉER MON COMPTE
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    function NavButton({ active, onClick, label }) {
      return (
        <button
          onClick={onClick}
          className={`px-4 py-2 rounded-xl text-xs font-black font-pop tracking-wider transition-all ${
            active 
              ? 'gradient-alky text-white shadow-sm' 
              : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
          }`}
        >
          {label}
        </button>
      );
    }

    function MobileBurgerButton({ active, onClick, label }) {
      return (
        <button
          onClick={onClick}
          className={`w-full text-left px-4 py-3 rounded-xl text-xs font-black font-pop tracking-wider transition-all ${
            active 
              ? 'gradient-alky text-white shadow-sm' 
              : 'text-slate-700 hover:bg-slate-100'
          }`}
        >
          {label}
        </button>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
