<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23160a2e'/%3E%3Cpath d='M32 9a23 23 0 1 0 0 46a23 23 0 1 0 0-46M27 20h10v24H27z' fill='%23d9ff3f'/%3E%3Ccircle cx='49' cy='48' r='7' fill='%23ff3d6e'/%3E%3C/svg%3E">
<title>AlkyAI – Blocus en Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#160a2e;--bg2:#241046;--lime:#d9ff3f;--hot:#ff3d6e;--ice:#7ae7ff;--mint:#5cffb0;--tx:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 'DM Sans',system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg)}
.glass{background:rgba(22,10,46,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid rgba(217,255,63,.55)}
.top{position:fixed;z-index:1000;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.logo{font:400 26px/1 Anton,Impact,sans-serif;letter-spacing:.02em;background:var(--lime);color:var(--bg);padding:10px 14px 8px;transform:rotate(-4deg);box-shadow:4px 4px 0 var(--hot);flex:none}
.sbox{flex:1;max-width:640px;position:relative}
#q{width:100%;height:56px;border-radius:99px;border:3px solid var(--lime);background:#fff;color:var(--bg);padding:0 22px 0 50px;font:700 18px 'DM Sans',sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 0 6px rgba(217,255,63,.18)}
#q::placeholder{color:#6b5a93;font-weight:500}
#q:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.sbox::before{content:'🔎';position:absolute;left:18px;top:14px;font-size:20px;z-index:1}
.tag{position:absolute;right:14px;top:-12px;background:var(--hot);color:#fff;font:400 13px Anton,Impact,sans-serif;letter-spacing:.04em;padding:2px 9px;transform:rotate(3deg)}
#sug{position:absolute;left:0;right:0;top:62px;border-radius:18px;overflow:auto;max-height:50vh}
.sg{display:block;width:100%;text-align:left;font:inherit;color:#fff;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.15);padding:11px 18px;cursor:pointer}
.sg:hover,.sg:focus-visible{background:rgba(217,255,63,.18)}
.sg b{display:block}.sg small{opacity:.75}
.fabs{position:fixed;z-index:1000;right:12px;top:calc(86px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
.fab{width:52px;height:52px;border-radius:16px;font-size:22px;cursor:pointer;color:#fff;display:grid;place-items:center;transition:transform .12s}
.fab:hover{transform:scale(1.08)}
.fab.on{background:var(--lime);color:var(--bg);border-color:var(--lime)}
.fab.hot{background:var(--hot);border-color:#fff}
.fab:focus-visible,button:focus-visible,.item:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.panel{position:fixed;z-index:999;left:12px;top:calc(86px + env(safe-area-inset-top,0px));bottom:12px;width:350px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border:0;background:var(--bg2);color:#fff;cursor:pointer;width:100%;text-align:left;font:inherit}
.ph b{font:400 34px/1 Anton,Impact,sans-serif;color:var(--hot)}
.ph span{flex:1;font-weight:700;font-size:14px;line-height:1.15}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.chip{border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:4px 12px;font:700 13px 'DM Sans',sans-serif;cursor:pointer}
.chip.on{background:var(--lime);color:var(--bg);border-color:var(--lime)}
#list{overflow:auto;padding:12px 14px 14px;flex:1}
.item{display:block;width:100%;text-align:left;font:inherit;color:#fff;background:rgba(255,255,255,.07);border:0;border-left:6px solid var(--c,#fff);border-radius:12px;padding:10px 12px;margin-bottom:9px;cursor:pointer}
.item:hover{background:rgba(255,255,255,.14)}
.item b{display:block;font-size:15px}.item small{opacity:.75}
.k{display:inline-block;font:400 12px Anton,Impact,sans-serif;letter-spacing:.05em;background:var(--c,#fff);color:var(--bg);padding:1px 8px;margin-right:6px;border-radius:4px}
.empty{padding:14px;border:2px dashed rgba(255,255,255,.4);border-radius:12px}
.note{font-size:12px;opacity:.65;padding:0 14px 12px}
@media(max-width:760px){
 .logo{font-size:20px;padding:8px 10px 6px}
 #q{height:50px;font-size:16px}
 .panel{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:42vh}
 .panel.shut{max-height:64px}.panel.shut #list,.panel.shut .chips,.panel.shut .note{display:none}
 .fabs{top:calc(76px + env(safe-area-inset-top,0px))}
}
.mk{display:block;width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid #fff;position:relative;box-shadow:0 0 14px var(--c)}
.mk::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--c);animation:r 2s infinite}
@keyframes r{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.8);opacity:0}}
.me{width:16px;height:16px;border-radius:50%;background:#3b8cff;border:3px solid #fff}
.leaflet-popup-content-wrapper{border-radius:14px;background:#fff;color:var(--bg)}
.leaflet-popup-content{font:500 14px/1.4 'DM Sans',sans-serif}
.pop button{margin-top:8px;background:var(--hot);color:#fff;border:0;border-radius:99px;padding:8px 14px;font:700 14px 'DM Sans',sans-serif;cursor:pointer}
dialog{max-height:90vh;overflow:auto;border:3px solid var(--lime);background:var(--bg2);color:#fff;border-radius:20px;padding:22px;max-width:410px;width:calc(100% - 28px)}
dialog::backdrop{background:rgba(10,4,24,.75)}
dialog h3{font:400 30px Anton,Impact,sans-serif;margin:0 0 6px;color:var(--lime)}
dialog label{display:block;font-weight:700;margin-top:10px;font-size:14px}
dialog input,dialog select,dialog textarea{width:100%;padding:10px 12px;border:2px solid #fff;border-radius:10px;background:var(--bg);color:#fff;font:500 15px 'DM Sans',sans-serif;margin-top:4px}
.go{background:var(--hot);color:#fff;border:0;border-radius:99px;padding:11px 20px;font:700 15px 'DM Sans',sans-serif;cursor:pointer}
.no{background:transparent;color:#fff;border:2px solid #fff;border-radius:99px;padding:9px 18px;font:700 15px 'DM Sans',sans-serif;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160px);background:var(--lime);color:var(--bg);padding:11px 20px;font-weight:700;border-radius:99px;z-index:3000;transition:transform .25s;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
@media(max-width:760px){#toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Ajustements mobiles : mêmes fonctionnalités, commandes plus accessibles */
@media(max-width:760px){
  html,body{min-height:100%;overscroll-behavior:none}
  .top{left:8px;right:8px;gap:8px}
  .logo{font-size:18px;padding:8px 9px 6px;letter-spacing:0}
  .sbox{min-width:0}
  #q{height:46px;padding:0 12px 0 38px;font-size:16px;min-width:0}
  .sbox::before{left:12px;top:11px;font-size:18px}
  .tag{right:8px;top:-10px;font-size:10px;padding:2px 6px}
  #sug{top:54px;max-height:38vh}
  .fabs{right:8px;top:calc(68px + env(safe-area-inset-top,0px));gap:7px}
  .fab{width:44px;height:44px;border-radius:13px;font-size:19px}
  .panel{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:40vh}
  .panel.shut{max-height:56px}
  .ph{padding:10px 12px;gap:8px}
  .ph b{font-size:28px}
  .chips{padding:8px 10px 0;gap:5px}
  .chip{padding:5px 9px;font-size:12px}
  #list{padding:9px 10px 10px}
  .item{padding:10px;margin-bottom:7px}
  dialog{padding:18px;max-height:calc(100dvh - 24px);width:calc(100% - 24px)}
  dialog input,dialog select,dialog textarea{font-size:16px}
  .note{padding:0 10px 10px}
}
@media(max-width:380px){
  .logo{font-size:16px;padding:7px 7px 5px}
  .top{gap:6px}
  .tag{font-size:9px}
  .fab{width:40px;height:40px;font-size:17px}
  .fabs{gap:6px}
}
@media(orientation:landscape) and (max-height:500px) and (max-width:900px){
  .panel{left:8px;right:auto;top:calc(68px + env(safe-area-inset-top,0px));bottom:8px;width:min(320px,44vw);max-height:none}
  .panel.shut{max-height:56px}
  .fabs{top:calc(68px + env(safe-area-inset-top,0px))}
}

</style>
</head>
<body>
<div id="map" role="application" aria-label="Carte de France des blocus"></div>
<div class="top">
  <div class="logo">ALKYAI</div>
  <div class="sbox"><span class="tag">TOUTE LA FRANCE</span><div id="sug" class="glass" style="display:none"></div>
    <input id="q" type="search" autocomplete="off" placeholder="Tape ton lycée, ta fac, ton collège…" aria-label="Rechercher un établissement"></div>
</div>
<div class="fabs">
  <button class="fab glass" id="loc" aria-label="Me localiser" title="Me localiser">📍</button>
  <button class="fab glass on" id="sat" aria-pressed="true" aria-label="Satellite" title="Satellite / plan">🛰️</button>
  <button class="fab glass on" id="sch" aria-pressed="true" aria-label="Afficher les établissements" title="Établissements">🏫</button>
  <button class="fab glass" id="acc" aria-label="Compte et abonnement Pro" title="Compte / Pro">⭐</button>
  <button class="fab hot" id="rep" aria-label="Signaler un blocus" title="Signaler">✊</button>
</div>
<section class="panel glass" id="panel">
  <button class="ph" id="ph" aria-label="Replier ou déplier"><b id="nc">0</b><span id="pt">blocus signalés en France<br><small id="st" style="font-weight:500;opacity:.7">Chargement…</small></span>▾</button>
  <div class="chips" id="chips"></div>
  <div id="list" aria-live="polite"></div>
  <p class="note">Signalements publiés par la communauté, non vérifiés. Jamais de données personnelles : seulement des lieux collectifs. <a href="cgv.html" style="color:#d9ff3f">CGV</a> · <a href="confidentialite.html" style="color:#d9ff3f">Confidentialité</a> · <a href="mentions-legales.html" style="color:#d9ff3f">Mentions</a></p>
</section>
<dialog id="dlg">
  <h3>Signaler un blocus</h3>
  <form method="dialog" id="f">
    <label>Type<select id="ft"><option value="blocus">Blocus</option><option value="manif">Manifestation</option><option value="aide">Secours / eau</option><option value="rdv">Rendez-vous</option></select></label>
    <label>Lieu<input id="fn" required maxlength="80"></label>
    <label>Infos utiles (facultatif)<textarea id="fc" rows="3" maxlength="200"></textarea></label>
    <p style="display:flex;gap:10px;margin:16px 0 0"><button class="go" value="ok">Envoyer</button><button class="no" value="cancel">Annuler</button></p>
  </form>
</dialog>
<dialog id="adlg"><h3>Compte ALKYAI</h3><div id="ab"></div><p><button class="no" id="ac">Fermer</button></p></dialog>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG ===== */
var SB_URL='https://gspingiinfhefdfqwyjf.supabase.co',SB_KEY='sb_publishable_d2GwO2bGEJ5koaTSxDUD_w_ywV8xVBf';   // Supabase (table reports). Vide = mode démo
var DATA_URL='',POST_URL='',REFRESH_MS=15000;
var PAY_PRO='',PAY_COLLECTIF='',PAY_SECOURS='';  // tes liens de paiement (PayPal.me, Lydia, Mollie, HelloAsso…)
var TOKEN=null,USER=null,PRO=false,sb=null;
var TYPES={blocus:['Blocus','#ff3d6e'],manif:['Manif','#d9ff3f'],aide:['Secours','#5cffb0'],rdv:['RDV','#ffffff']};
/* Faits relayés par la presse (positions approximatives, dates = dernier signalement) */
var SAMPLE=[
{id:'s1',type:'manif',name:'Place de la République (Paris)',lat:48.8675,lng:2.3637,status:'Manif samedi 17/10 à 14h',note:'Appel de l’USL ; Unef, Union étudiante, Fage',updated:'2026-10-15T09:00:00Z',source:'Sortiraparis'},
{id:'s2',type:'blocus',name:'Lycée Jacques Deyder (Épinay-sur-Seine)',lat:48.9535,lng:2.3140,status:'Blocage signalé',note:'Environ 3 semaines selon un élève',updated:'2026-10-14T12:00:00Z',source:'Public Sénat'},
{id:'s3',type:'blocus',name:'Lycée Saint-Charles (Marseille)',lat:43.3045,lng:5.3805,status:'Bloqué depuis 6h45',note:'Journée du 13/10',updated:'2026-10-13T05:00:00Z',source:'Euronews'},
{id:'s4',type:'blocus',name:'Lyon et Rhône : 7 établissements perturbés',lat:45.764,lng:4.8357,status:'Perturbations signalées',note:'Selon la préfecture, 13/10',updated:'2026-10-13T09:00:00Z',source:'Euronews'},
{id:'s5',type:'blocus',name:'Lycée Brequigny (Rennes)',lat:48.0906,lng:-1.6948,status:'Tensions signalées',note:'Blocage du 29/09',updated:'2026-09-29T10:00:00Z',source:'AFP / Maritima'},
{id:'s6',type:'blocus',name:'Lycée Magendie (Bordeaux)',lat:44.8444,lng:-0.5820,status:'Entrée bloquée',note:'Blocage du 29/09',updated:'2026-09-29T10:00:00Z',source:'AFP / Maritima'},
{id:'s7',type:'blocus',name:'Lycée César-Baggio (Lille)',lat:50.6244,lng:3.0505,status:'Tensions signalées',note:'Blocage du 29/09',updated:'2026-09-29T10:00:00Z',source:'AFP / Maritima'}
];
var items=[],on={blocus:1,manif:1,aide:1,rdv:1},userPos=null,repMode=false,pending=null,pendingEid=null,me=null,mode='feed',sq=0,terr=0,tmr=0,S={},enc=encodeURIComponent;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(s){var t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},3200)}
function ago(iso){var m=Math.round((Date.now()-new Date(iso))/60000);if(isNaN(m))return'';if(m<60)return'il y a '+Math.max(m,1)+' min';if(m<1440)return'il y a '+Math.round(m/60)+' h';return'il y a '+Math.round(m/1440)+' j'}

function sbh(h){h.apikey=SB_KEY;if(TOKEN)h.Authorization='Bearer '+TOKEN;else if(/^eyJ/.test(SB_KEY))h.Authorization='Bearer '+SB_KEY;return h}
function loadLocal(){try{return(JSON.parse(localStorage.getItem('alkyai_reports'))||[]).filter(function(i){return Date.now()-new Date(i.updated)<9e5}).map(function(i){i.local=true;return i})}catch(e){return[]}}
function saveLocal(){try{localStorage.setItem('alkyai_reports',JSON.stringify(items.filter(function(i){return i.local})))}catch(e){}}
items=loadLocal();
/* ===== Carte (France entière par défaut) ===== */
var map=L.map('map',{zoomControl:false}).setView([46.6,2.4],6);
var sat=L.layerGroup([
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'}),
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})]).addTo(map);
var plan=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
var ml=L.layerGroup().addTo(map),sl=L.layerGroup().addTo(map);
sat.eachLayer(function(l){l.on('tileerror',function(){if(++terr===6&&$('sat').getAttribute('aria-pressed')==='true'){$('sat').click();toast('Satellite bloqué ici : plan affiché. Ouvre la page dans ton navigateur.')}})});
$('sat').onclick=function(){var s=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',s);this.classList.toggle('on',s);if(s){map.removeLayer(plan);sat.addTo(map)}else{map.removeLayer(sat);plan.addTo(map)}};
$('sch').onclick=function(){var s=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',s);this.classList.toggle('on',s);if(s){sl.addTo(map);loadSchools()}else map.removeLayer(sl)};
$('ph').onclick=function(){$('panel').classList.toggle('shut')};
if(innerWidth<=760)$('panel').classList.add('shut');

/* ===== Géolocalisation ===== */
$('loc').onclick=function(){
 if(!navigator.geolocation){toast('Géolocalisation indisponible');return}
 navigator.geolocation.getCurrentPosition(function(p){
  userPos=[p.coords.latitude,p.coords.longitude];
  if(me)map.removeLayer(me);me=L.marker(userPos,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]})}).addTo(map);
  map.flyTo(userPos,14);toast('Carte centrée sur toi');
 },function(){toast('Autorise la localisation (HTTPS requis)')},{enableHighAccuracy:true,timeout:10000});
};

/* ===== Signalements & blocus en direct ===== */
Object.keys(TYPES).forEach(function(k){var b=document.createElement('button');b.className='chip on';b.textContent=TYPES[k][0];b.onclick=function(){on[k]=on[k]?0:1;b.classList.toggle('on',!!on[k]);render()};$('chips').appendChild(b)});
function render(){
 ml.clearLayers();
 var vis=items.filter(function(i){return on[i.type]}).sort(function(a,b){return new Date(b.updated)-new Date(a.updated)});
 $('nc').textContent=items.filter(function(i){return i.type==='blocus'}).length;
 var h='';
 vis.forEach(function(i,n){var t=TYPES[i.type]||TYPES.rdv;
  i._m=L.marker([i.lat,i.lng],{icon:L.divIcon({className:'',html:'<span class="mk" style="--c:'+t[1]+'"></span>',iconSize:[20,20]})}).addTo(ml);
  i._m.bindPopup('<b>'+esc(i.name)+'</b><br>'+esc(i.status||'')+'<br><small>'+esc(i.note||'')+'</small><br><small>Source : '+esc(i.source||'—')+' · '+ago(i.updated)+'</small>');
  h+='<button class="item" style="--c:'+t[1]+'" data-n="'+n+'"><span class="k">'+t[0]+'</span><b>'+esc(i.name)+'</b><small>'+esc(i.status||'')+' · '+ago(i.updated)+'</small></button>'});
 if(mode!=='feed')return;
 $('list').innerHTML=h||'<div class="empty">Aucun signalement. Sois le premier : touche ✊ puis la carte.</div>';
 $('list').querySelectorAll('.item').forEach(function(el){var i=vis[+el.dataset.n];el.onclick=function(){map.flyTo([i.lat,i.lng],15);setTimeout(function(){i._m.openPopup()},700)}});
}
function setSt(d){$('st').textContent=d?'Infos de presse · signalements à venir':(PRO?'En direct · Pro ✓ · maj ':'Retard 10 min · passe Pro pour le direct · maj ')+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function load(){
 if(SB_URL)DATA_URL=SB_URL+'/rest/v1/reports?select=*&order=updated.desc&limit=500&updated=gte.'+enc(new Date(Date.now()-24*3600e3).toISOString());
 var loc=items.filter(function(i){return i.local&&Date.now()-new Date(i.updated)<9e5});
 if(!DATA_URL){items=SAMPLE.concat(loc);setSt(true);render();return}
 fetch(DATA_URL,{cache:'no-store',headers:SB_KEY?sbh({}):{}}).then(function(r){return r.json()}).then(function(d){d.forEach(function(x){x.status=x.status||(x.type==='blocus'?'Blocus signalé':'Signalé')});items=d.concat(loc.filter(function(i){return!d.some(function(x){return x.name===i.name&&x.lat===i.lat&&x.lng===i.lng})}));setSt(false);render()}).catch(function(){items=SAMPLE.concat(loc);setSt(true);render()});
}
$('rep').onclick=function(){repMode=!repMode;this.classList.toggle('on',repMode);map.getContainer().style.cursor=repMode?'crosshair':'';if(repMode)toast('Touche l’endroit exact sur la carte')};
map.on('click',function(e){if(!repMode)return;pending=e.latlng;pendingEid=null;repMode=false;$('rep').classList.remove('on');map.getContainer().style.cursor='';$('f').reset();$('dlg').showModal()});
$('f').onsubmit=function(){
 if(!$('fn').value.trim()||!pending)return;
 var it={id:'u'+Date.now(),type:$('ft').value,name:$('fn').value.trim(),lat:pending.lat,lng:pending.lng,status:'À vérifier',note:$('fc').value.trim(),updated:new Date().toISOString(),source:'Signalement',local:true,eid:pendingEid};
 items.push(it);saveLocal();render();toast(SB_URL||POST_URL?'Publication en cours…':'Enregistré sur ton appareil seulement : pas encore partagé avec les autres');
 if(SB_URL||POST_URL)fetch(SB_URL?SB_URL+'/rest/v1/reports':POST_URL,{method:'POST',headers:SB_URL?sbh({'Content-Type':'application/json',Prefer:'return=minimal'}):{'Content-Type':'application/json'},body:JSON.stringify(SB_URL?{type:it.type,name:it.name,lat:it.lat,lng:it.lng,note:it.note,eid:it.eid||null}:it)}).then(function(r){if(r.ok){saveLocal();load();toast('Signalement publié pour tout le monde')}else toast('Envoi refusé : vérifie la config Supabase')}).catch(function(){toast('Envoi impossible, réessaie')});
};

/* ===== Établissements de toute la France (open data officiel, repli OpenStreetMap) ===== */
var V1='https://data.education.gouv.fr/api/records/1.0/search/?dataset=fr-en-annuaire-education';
var V1E='https://data.enseignementsup-recherche.gouv.fr/api/records/1.0/search/?dataset=fr-esr-principaux-etablissements-enseignement-superieur';
function j(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
function colorOf(t){return/^Lyc/i.test(t)?'#ffffff':/^Coll/i.test(t)?'#7ae7ff':'#d9ff3f'}
function add(o){
 if(S[o.id])return S[o.id];S[o.id]=o;
 o.m=L.circleMarker([o.lat,o.lng],{radius:7,color:'#160a2e',weight:2,fillColor:colorOf(o.type),fillOpacity:1}).addTo(sl);
 o.m.bindPopup('<div class="pop"><b>'+esc(o.name)+'</b><br><small>'+esc(o.type)+(o.pub?' · '+esc(o.pub):'')+'</small><br>'+esc(o.adr)+' '+esc(o.cp)+' '+esc(o.commune)+'<br><button data-sid="'+esc(o.id)+'">✊ Signaler un blocus ici</button></div>');
 return o;
}
function rec(r,uni){
 var f=r.fields||{},g=r.geometry&&r.geometry.coordinates,la,ln;
 if(g){ln=g[0];la=g[1]}else{la=f.latitude;ln=f.longitude}
 var name=f.nom_etablissement||f.uo_lib||f.nom;if(!name||la==null||ln==null)return null;
 return add({id:(uni?'u':'e')+(r.recordid||name+la),name:name,lat:la,lng:ln,type:f.type_etablissement||(uni?'Université':'Établissement'),commune:f.nom_commune||f.com_nom||'',cp:f.code_postal||'',adr:f.adresse_1||f.adresse_uai||'',pub:f.statut_public_prive||''});
}
function edu(u,q,rows,uni){return j(u+'&rows='+rows+q).then(function(d){return(d.records||[]).map(function(r){return rec(r,uni)}).filter(Boolean)})}
function osm(v){
 function one(q){return j('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&countrycodes=fr&q='+enc(q)).then(function(a){return a.filter(function(r){return r.category==='amenity'&&/school|college|university/.test(r.type)}).map(function(r){var p=String(r.display_name).split(',');return add({id:'o'+r.place_id,name:r.name||p[0],lat:+r.lat,lng:+r.lon,type:r.type==='university'?'Université':'Établissement',commune:p.slice(1,3).join(',').trim(),cp:'',adr:'',pub:''})})})}
 return one(v).then(function(r){return r.length?r:one('lycée '+v)});
}
function loadSchools(){
 if(map.getZoom()<12||$('sch').getAttribute('aria-pressed')!=='true')return;
 var c=map.getCenter(),rad=Math.min(20000,Math.round(c.distanceTo(map.getBounds().getNorthEast()))),g='&geofilter.distance='+c.lat+','+c.lng+','+rad;
 edu(V1,g+'&q='+enc('type_etablissement:"Lycée"'),100).catch(function(){return edu(V1,g,100)}).catch(function(){});
 edu(V1E,g,50,true).catch(function(){});
}
function isSec(o){return/^(Lyc|Coll|EREA)/i.test(o.type)}
function safe(p){return p.then(function(r){return{ok:1,r:r}},function(){return{ok:0,r:[]}})}
function rec2(f){var la=f.latitude||(f.position&&f.position.lat),ln=f.longitude||(f.position&&f.position.lon);if(!f.nom_etablissement||la==null||ln==null)return null;return add({id:'e'+(f.identifiant_de_l_etablissement||f.nom_etablissement+la),name:f.nom_etablissement,lat:la,lng:ln,type:f.type_etablissement||'Établissement',commune:f.nom_commune||'',cp:f.code_postal||'',adr:f.adresse_1||'',pub:f.statut_public_prive||''})}
function v2(v){return j('https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-annuaire-education/records?limit=25&where='+enc('search(nom_etablissement,"'+v+'")')).then(function(d){return(d.results||[]).map(rec2).filter(Boolean)})}
function find(v){
 var q='&q='+enc(v);
 return Promise.all([safe(edu(V1,q,25)),safe(edu(V1E,q,8,true))]).then(function(a){
  var sec=a[0].r.filter(isSec),r=(sec.length?sec:a[0].r).concat(a[1].r),down=!a[0].ok&&!a[1].ok;
  if(r.length)return{r:r,down:0};
  return safe(v2(v)).then(function(b){if(b.r.length)return{r:b.r,down:0};
   return safe(osm(v)).then(function(c){return{r:c.r,down:down&&!b.ok&&!c.ok}})});
 });
}
function hideSug(){$('sug').style.display='none'}
function showSug(arr,v,down){
 var h='';
 if(down)h='<div class="sg"><b>Impossible de joindre l’annuaire</b><small>Ouvre cette page dans Chrome/Safari (pas dans l’aperçu Claude) ou héberge-la en ligne.</small></div>';
 else if(!arr.length)h='<div class="sg"><b>Aucun résultat pour « '+esc(v)+' »</b><small>Essaie avec moins de mots, ex. « Jean Moulin ».</small></div>';
 else arr.slice(0,7).forEach(function(o,i){h+='<button class="sg" data-i="'+i+'"><b>'+esc(o.name)+'</b><small>'+esc(String(o.type).split(' ')[0])+' · '+esc(o.cp)+' '+esc(o.commune)+'</small></button>'});
 var d=$('sug');d.innerHTML=h;d.style.display='block';
 d.querySelectorAll('[data-i]').forEach(function(el){var o=arr[+el.dataset.i];el.onmousedown=function(e){e.preventDefault()};el.onclick=function(){hideSug();$('q').value=o.name;go(o)}});
}
function doSearch(v,fly){
 v=v.replace(/["\\]/g,'').trim();var n=++sq;
 if(v.length<3){hideSug();if(!v){mode='feed';$('chips').style.display='';render()}return}
 find(v).then(function(res){
  if(n!==sq)return;var arr=res.r;
  showSug(arr,v,res.down);
  if(!fly)return;
  hideSug();mode='res';$('chips').style.display='none';$('panel').classList.remove('shut');
  var h='<button class="item" id="back" style="--c:#fff"><b>← Retour aux blocus en direct</b></button>';
  if(!arr.length)h+='<div class="empty">Aucun établissement trouvé pour « '+esc(v)+' ».</div>';
  arr.forEach(function(o,i){h+='<button class="item" style="--c:'+colorOf(o.type)+'" data-n="'+i+'"><span class="k">'+esc(String(o.type).split(' ')[0])+'</span><b>'+esc(o.name)+'</b><small>'+esc(o.cp)+' '+esc(o.commune)+'</small></button>'});
  $('list').innerHTML=h;
  $('back').onclick=function(){$('q').value='';mode='feed';$('chips').style.display='';render()};
  $('list').querySelectorAll('[data-n]').forEach(function(el){var o=arr[+el.dataset.n];el.onclick=function(){go(o)}});
  if(arr.length)go(arr[0]);
 });
}
function go(o){if(!sl.hasLayer(o.m))o.m.addTo(sl);map.flyTo([o.lat,o.lng],16);setTimeout(function(){o.m.openPopup()},800)}
function reportSchool(id){var o=S[id];if(!o)return;map.closePopup();pending=L.latLng(o.lat,o.lng);pendingEid=id;$('f').reset();$('fn').value=o.name;$('ft').value='blocus';$('dlg').showModal()}
map.on('popupopen',function(e){var n=e.popup.getElement(),b=n&&n.querySelector('[data-sid]');if(b)b.onclick=function(){reportSchool(b.getAttribute('data-sid'))}});
$('q').addEventListener('input',function(){var v=this.value,t=this;clearTimeout(t._t);t._t=setTimeout(function(){doSearch(v,false)},300)});
$('q').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch(this.value,true)});
$('q').addEventListener('blur',function(){setTimeout(hideSug,200)});
map.on('moveend',function(){clearTimeout(tmr);tmr=setTimeout(loadSchools,500)});
/* ===== Compte, espace étudiant, abonnement Pro (lien de paiement) ===== */
var PROF=null,PE=null;
function km(a,b,c,d){var r=Math.PI/180,x=Math.pow(Math.sin((c-a)*r/2),2)+Math.cos(a*r)*Math.cos(c*r)*Math.pow(Math.sin((d-b)*r/2),2);return 12742*Math.asin(Math.sqrt(x))}
function payCard(t,pr,d,l,k){return '<div class="item" style="--c:#d9ff3f;cursor:default"><b>'+t+' · '+pr+'</b><small>'+d+'</small><br>'+(l?'<a class="go" style="display:inline-block;margin:8px 8px 0 0;text-decoration:none" target="_blank" rel="noopener" href="'+esc(l)+'">Payer</a><button class="no" data-pay="'+k+'" style="margin-top:8px">J’ai payé</button>':'<small>Bientôt disponible</small>')+'</div>'}
function rest(path,opt){opt=opt||{};opt.headers=sbh(opt.headers||{});return fetch(SB_URL+'/rest/v1/'+path,opt)}
function openAcc(){
 if(!sb){toast('Connexion indisponible : vérifie SB_URL');return}
 var h;PE=null;
 if(!USER)h='<p>Crée ton compte ou connecte-toi avec ton e-mail (lien magique, sans mot de passe).</p><p style="font-size:13px">À partir de 15 ans. En continuant, tu acceptes les <a href="cgv.html" style="color:#d9ff3f">CGV</a> et la <a href="confidentialite.html" style="color:#d9ff3f">politique de confidentialité</a>.</p><label>E-mail<input id="ae" type="email" placeholder="ton@email.fr"></label><p><button class="go" id="al">Recevoir mon lien</button></p>';
 else{
  var has=PROF&&PROF.lat!=null,near=has?items.filter(function(i){return i.type==='blocus'&&km(PROF.lat,PROF.lng,i.lat,i.lng)<2}).length:0;
  h='<p>Connecté : <b>'+esc(USER.email)+'</b>'+(PRO?' · <b style="color:var(--lime)">Pro ✓</b>':'')+'</p><h4 style="margin:14px 0 0">Mon espace étudiant</h4>'+
  '<label>Pseudo<input id="pp" maxlength="30" value="'+esc(PROF&&PROF.pseudo)+'"></label>'+
  '<label>Mon établissement<input id="ps" autocomplete="off" placeholder="Tape ton lycée ou ta fac" value="'+esc(PROF&&PROF.etab_name)+'"></label><div id="pr"></div>'+
  '<p><button class="go" id="pv">Enregistrer</button>'+(has?' <button class="no" id="pg">Voir sur la carte</button>':'')+'</p>'+
  (has?'<p><b>'+near+'</b> blocus signalé(s) à moins de 2 km de ton établissement (24 h).</p>':'')+
  '<div id="mr"></div>'+
  (PRO?'<p>Tu vois les blocus en direct. Merci !</p>':'<h4 style="margin:14px 0 4px">Passer Pro</h4><p style="font-size:13px">Paie avec le lien en mettant ton e-mail en message, puis touche « J’ai payé » : ton compte est activé après vérification du paiement.</p>'+payCard('Cortège Pro','2,99 €/mois','Blocus en direct sans retard, alertes',PAY_PRO,'pro')+payCard('Collectif','9,99 €/mois','5 comptes Pro + outils pour les orgas',PAY_COLLECTIF,'collectif')+payCard('Pack Secours','+1 €','Points d’eau, infirmeries, juristes',PAY_SECOURS,'secours'))+
  '<p><button class="no" id="ao">Se déconnecter</button></p>';
 }
 $('ab').innerHTML=h;$('adlg').showModal();
 if($('al'))$('al').onclick=function(){var v=$('ae').value.trim();if(!v)return;sb.auth.signInWithOtp({email:v,options:{emailRedirectTo:location.href.split('#')[0]}}).then(function(r){toast(r.error?'Erreur : '+r.error.message:'Lien envoyé ! Vérifie tes mails');if(!r.error)$('adlg').close()})};
 if(!USER)return;
 $('ao').onclick=function(){sb.auth.signOut();$('adlg').close()};
 if($('pg'))$('pg').onclick=function(){$('adlg').close();map.flyTo([PROF.lat,PROF.lng],15)};
 var t0;$('ps').oninput=function(){var v=this.value;clearTimeout(t0);t0=setTimeout(function(){if(v.trim().length<3){$('pr').innerHTML='';return}
  find(v).then(function(res){var h2='';res.r.slice(0,5).forEach(function(o,i){h2+='<button class="item" style="--c:#fff" data-i="'+i+'"><b>'+esc(o.name)+'</b><small>'+esc(o.cp)+' '+esc(o.commune)+'</small></button>'});$('pr').innerHTML=h2;
   $('pr').querySelectorAll('[data-i]').forEach(function(el){var o=res.r[+el.dataset.i];el.onclick=function(){PE=o;$('ps').value=o.name;$('pr').innerHTML='<small>Sélectionné ✓</small>'}})})},300)};
 $('pv').onclick=function(){
  var o=PE||(PROF&&PROF.lat!=null?{id:PROF.etab_id,name:PROF.etab_name,lat:PROF.lat,lng:PROF.lng,commune:PROF.city}:null);
  rest('profiles?on_conflict=user_id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:USER.id,pseudo:$('pp').value.trim()||null,etab_name:o?o.name:null,etab_id:o?o.id:null,lat:o?o.lat:null,lng:o?o.lng:null,city:o?o.commune||'':null})}).then(function(r){toast(r.ok?'Profil enregistré ✓':'Erreur : profil non enregistré');if(r.ok)checkPro()});
 };
 document.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=function(){rest('pay_requests',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({user_id:USER.id,email:USER.email,plan:b.dataset.pay})}).then(function(r){toast(r.ok?'Demande envoyée : activation après vérification du paiement':'Erreur : demande non envoyée')})}});
 rest('reports?select=type,name,updated&user_id=eq.'+USER.id+'&order=updated.desc&limit=10').then(function(r){return r.json()}).then(function(d){if(!d.length)return;var m='<h4 style="margin:14px 0 4px">Mes signalements</h4>';d.forEach(function(x){m+='<small>'+esc(x.type)+' · '+esc(x.name)+' · '+ago(x.updated)+'</small><br>'});$('mr').innerHTML=m}).catch(function(){});
}
$('acc').onclick=openAcc;$('ac').onclick=function(){$('adlg').close()};
function checkPro(){
 if(!USER){PRO=false;PROF=null;$('acc').classList.remove('on');load();return}
 Promise.all([
  rest('subscriptions?select=status,until&user_id=eq.'+USER.id).then(function(r){return r.json()}).catch(function(){return[]}),
  rest('profiles?select=*&user_id=eq.'+USER.id).then(function(r){return r.json()}).catch(function(){return[]})
 ]).then(function(a){var d=a[0]&&a[0][0];PRO=!!(d&&d.status==='active'&&(!d.until||new Date(d.until)>new Date()));PROF=a[1]&&a[1][0]||null;$('acc').classList.toggle('on',PRO);load()});
}
if(SB_URL&&window.supabase){sb=supabase.createClient(SB_URL,SB_KEY);sb.auth.onAuthStateChange(function(ev,ses){TOKEN=ses?ses.access_token:null;USER=ses?ses.user:null;checkPro()})}
load();setInterval(load,REFRESH_MS);
</script>
