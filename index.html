<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALKYAI - Real Life Challenges</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            alky: {
              white: '#ffffff',
              light: '#f8fafc',
              border: '#e2e8f0',
              text: '#0f172a',
              cyan: '#00d2ff',
              blue: '#0066ff',
              purple: '#8a2be2',
              pink: '#ff2a85'
            }
          }
        }
      }
    }
  </script>

  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

    body {
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-pop {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    .gradient-alky {
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 35%, #8a2be2 70%, #ff2a85 100%);
    }

    .gradient-text-alky {
      background: linear-gradient(135deg, #00d2ff 0%, #8a2be2 50%, #ff2a85 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-pop {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-pop:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 20px -5px rgba(0, 102, 255, 0.35);
    }
    .btn-pop:active {
      transform: translateY(1px) scale(0.98);
    }

    .card-street {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-street:hover {
      border-color: #0066ff;
      transform: translateY(-4px);
      box-shadow: 0 15px 30px -10px rgba(0, 102, 255, 0.15);
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      border-radius: 2rem;
      z-index: 10;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #ffffff;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="selection:bg-alky-pink selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // CONFIGURATION SUPABASE
    const SUPABASE_URL = "https://hsvxubtiblbdqtpvascr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Bha__1CDuR3ppdQUtSQTqQ_2_KJ2NgP";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [currentTab, setCurrentTab] = useState('home');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');

      // Formulaire
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [birthdate, setBirthdate] = useState('2006-01-01');
      const [authError, setAuthError] = useState('');

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) fetchProfile(session.user.id);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) fetchProfile(session.user.id);
          else setProfile(null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const fetchProfile = async (userId) => {
        try {
          const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
          if (data) setProfile(data);
        } catch (err) {
          console.error(err);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) setAuthError(error.message);
        else setShowAuthModal(false);
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { data, error: signUpError } = await supabase.auth.signUp({ 
          email, 
          password,
          options: {
            data: { username, birthdate }
          }
        });

        if (signUpError) {
          setAuthError(signUpError.message);
          return;
        }

        if (data.user) {
          await supabase.from('profiles').upsert([{
            id: data.user.id,
            username,
            birthdate,
            alky_balance: 0,
            streak_days: 0,
            subscription_tier: 'gratuit',
            is_admin: false
          }]);
          fetchProfile(data.user.id);
          setShowAuthModal(false);
        }
      };

      // CONNEXION ET INSCRIPTION VIA GOOGLE
      const handleGoogleAuth = async () => {
        setAuthError('');
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin
          }
        });
        if (error) setAuthError(error.message);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setSession(null);
        setProfile(null);
      };

      return (
        <div className="min-h-screen bg-white text-slate-900 flex flex-col font-sans pb-24 md:pb-0 md:pt-20 relative overflow-hidden">
          
          {/* HEADER DESKTOP */}
          <header className="hidden md:flex fixed top-0 left-0 right-0 h-20 bg-white/95 backdrop-blur-xl border-b border-slate-200 z-50 px-8 items-center justify-between shadow-sm">
            <div className="cursor-pointer flex items-center" onClick={() => setCurrentTab('home')}>
              <img 
                src="logo.png" 
                alt="ALKYAI Logo" 
                className="h-10 w-auto object-contain hover:scale-105 transition-transform" 
                style={{ mixBlendMode: 'multiply' }}
                onError={(e) => { e.target.style.display='none'; }} 
              />
            </div>

            <nav className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
              <NavButton active={currentTab === 'home'} onClick={() => setCurrentTab('home')} label="ACCUEIL" />
              <NavButton active={currentTab === 'challenges'} onClick={() => setCurrentTab('challenges')} label="DÉFIS" />
              <NavButton active={currentTab === 'map'} onClick={() => setCurrentTab('map')} label="CARTE" />
              <NavButton active={currentTab === 'leaderboard'} onClick={() => setCurrentTab('leaderboard')} label="SCORES" />
              <NavButton active={currentTab === 'groups'} onClick={() => setCurrentTab('groups')} label="GROUPES" />
            </nav>

            <div>
              {session ? (
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-4 py-2 rounded-2xl">
                    <span className="font-black text-alky-blue font-pop text-lg">{profile?.alky_balance || 0}</span>
                    <span className="text-xs text-alky-pink font-extrabold">ALKY</span>
                  </div>
                  <button 
                    onClick={() => setCurrentTab('profile')}
                    className="px-6 py-2.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                  >
                    {profile?.username || 'MON PROFIL'}
                  </button>
                  <button onClick={handleLogout} className="text-xs text-slate-400 hover:text-red-500 font-bold transition-colors">Déconnexion</button>
                </div>
              ) : (
                <button 
                  onClick={() => setShowAuthModal(true)} 
                  className="px-6 py-3 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                >
                  MON COMPTE / CONNEXION
                </button>
              )}
            </div>
          </header>

          {/* BARRE DE NAVIGATION MOBILE */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-xl border-t border-slate-200 z-50 px-2 flex items-center justify-around shadow-lg">
            <MobileNavButton active={currentTab === 'home'} onClick={() => setCurrentTab('home')} label="Accueil" />
            <MobileNavButton active={currentTab === 'challenges'} onClick={() => setCurrentTab('challenges')} label="Défis" />
            <MobileNavButton active={currentTab === 'map'} onClick={() => setCurrentTab('map')} label="Carte" />
            <MobileNavButton active={currentTab === 'leaderboard'} onClick={() => setCurrentTab('leaderboard')} label="Scores" />
            <MobileNavButton active={currentTab === 'groups'} onClick={() => setCurrentTab('groups')} label="Groupes" />
            <button 
              onClick={() => session ? setCurrentTab('profile') : setShowAuthModal(true)} 
              className="flex flex-col items-center justify-center font-black text-[11px] text-alky-blue uppercase font-pop"
            >
              <span>{session ? 'Profil' : 'Compte'}</span>
            </button>
          </nav>

          {/* CONTENU PRINCIPAL */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 relative z-10">
            {currentTab === 'home' && (
              <div className="space-y-12">
                <div className="bg-slate-50 border-2 border-slate-200 rounded-[2.5rem] p-8 md:p-12 flex flex-col md:flex-row items-center gap-8 relative overflow-hidden shadow-sm">
                  <div className="shrink-0 flex items-center justify-center">
                    <img 
                      src="logo.png" 
                      alt="ALKYAI Logo" 
                      className="w-48 h-auto object-contain" 
                      style={{ mixBlendMode: 'multiply' }}
                      onError={(e) => { e.target.style.display='none'; }} 
                    />
                  </div>
                  
                  <div className="flex-1 text-center md:text-left">
                    <span className="inline-block text-xs font-black font-pop uppercase tracking-widest text-white gradient-alky px-4 py-1.5 rounded-full shadow-sm mb-3">
                      👑 TRANSFORM' TON QUOTIDIEN EN JEU
                    </span>
                    <h1 className="text-3xl md:text-5xl font-black font-pop text-slate-900 tracking-wide leading-tight">
                      Réalise des défis réels, gagne des <span className="gradient-text-alky">Alky</span> !
                    </h1>
                    <p className="text-slate-600 text-sm md:text-base mt-3 font-medium leading-relaxed max-w-xl">
                      ALKYAI est l'application ultime pour sortir, relever des missions sportives, créatives ou écoresponsables dans le monde réel, et accumuler la monnaie virtuelle <strong>Alky</strong> !
                    </p>
                    
                    {!session && (
                      <div className="mt-6 flex flex-wrap gap-4 justify-center md:justify-start">
                        <button 
                          onClick={() => setShowAuthModal(true)} 
                          className="px-8 py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-2xl shadow-md btn-pop tracking-wider"
                        >
                          COMMENCER MAINTENANT
                        </button>
                        <button 
                          onClick={() => setCurrentTab('challenges')} 
                          className="px-6 py-3.5 bg-white border-2 border-slate-200 hover:border-alky-blue text-slate-800 font-black font-pop text-xs rounded-2xl transition-all"
                        >
                          VOIR LES DÉFIS
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {currentTab === 'challenges' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-3xl font-black font-pop text-slate-900">⚡ CATALOGUE DES DÉFIS</h1>
                  <p className="text-slate-500 text-xs mt-1 font-semibold">Réalise ton défi et envoie ta photo.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <ChallengeCard title="20 Pompes Extérieures" category="SPORT" points="+40 ALKY" color="bg-blue-100 text-blue-700" />
                  <ChallengeCard title="Photo d'un Monument" category="CULTURE" points="+30 ALKY" color="bg-purple-100 text-purple-700" />
                  <ChallengeCard title="Ramasser un déchet" category="ÉCOLOGIE" points="+50 ALKY" color="bg-emerald-100 text-emerald-700" />
                </div>
              </div>
            )}

            {currentTab === 'map' && (
              <div className="space-y-6">
                <h1 className="text-3xl font-black font-pop text-slate-900">🗺️ CARTE DES DÉFIS</h1>
                <div className="h-[500px] card-street rounded-3xl flex items-center justify-center bg-slate-50">
                  <p className="text-slate-400 text-xs font-bold uppercase font-pop">Carte des défis géolocalisés</p>
                </div>
              </div>
            )}

            {currentTab === 'leaderboard' && (
              <div className="space-y-6">
                <h1 className="text-3xl font-black font-pop text-slate-900">🏆 CLASSEMENT MONDIAL</h1>
                <div className="card-street rounded-3xl p-10 text-center text-slate-500 text-xs font-semibold bg-slate-50">
                  Compétition ouverte ! Sois le premier à marquer des points.
                </div>
              </div>
            )}

            {currentTab === 'groups' && (
              <div className="space-y-6">
                <h1 className="text-3xl font-black font-pop text-slate-900">👥 GROUPES & ÉQUIPES</h1>
                <div className="card-street rounded-3xl p-10 text-center text-slate-500 text-xs font-semibold bg-slate-50">
                  Rejoins tes amis pour concourir ensemble.
                </div>
              </div>
            )}

            {currentTab === 'profile' && session && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <div className="card-street rounded-3xl p-8 bg-slate-50">
                  <div className="flex items-center gap-4 mb-4">
                    <div className="w-14 h-14 gradient-alky rounded-2xl flex items-center justify-center text-xl font-black font-pop text-white shadow-md">
                      {profile?.username?.substring(0, 2).toUpperCase() || 'U'}
                    </div>
                    <div>
                      <h1 className="text-2xl font-black font-pop text-slate-900">{profile?.username || 'Utilisateur Google'}</h1>
                      <p className="text-xs text-alky-blue font-extrabold mt-0.5">Solde : {profile?.alky_balance || 0} ALKY</p>
                    </div>
                  </div>
                  <button onClick={handleLogout} className="px-5 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-extrabold rounded-xl transition-colors">
                    Déconnexion
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* MODALE D'AUTHENTIFICATION AVEC GOOGLE */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-8 max-w-md w-full relative border border-slate-200 shadow-2xl">
                <button 
                  onClick={() => setShowAuthModal(false)} 
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 font-black text-lg"
                >
                  ✕
                </button>

                <div className="text-center mb-6">
                  <img 
                    src="logo.png" 
                    alt="ALKYAI Logo" 
                    className="h-12 w-auto mx-auto mb-2 object-contain" 
                    style={{ mixBlendMode: 'multiply' }}
                    onError={(e) => { e.target.style.display='none'; }} 
                  />
                  <h2 className="text-2xl font-black font-pop text-slate-900">MON COMPTE</h2>
                  <p className="text-slate-500 text-xs mt-1 font-semibold">Connecte-toi ou crée ton profil</p>
                </div>

                {authError && (
                  <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-extrabold rounded-xl text-center">
                    {authError}
                  </div>
                )}

                {/* BOUTON GOOGLE */}
                <button 
                  type="button"
                  onClick={handleGoogleAuth}
                  className="w-full mb-4 py-3 px-4 bg-white border-2 border-slate-200 hover:border-slate-400 text-slate-700 font-bold text-xs rounded-xl flex items-center justify-center gap-3 transition-all shadow-sm"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  Continuer avec Google
                </button>

                <div className="relative flex py-2 items-center mb-4">
                  <div className="flex-grow border-t border-slate-200"></div>
                  <span className="flex-shrink mx-3 text-[10px] text-slate-400 uppercase font-black">ou par email</span>
                  <div className="flex-grow border-t border-slate-200"></div>
                </div>

                <div className="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 mb-6">
                  <button 
                    onClick={() => setAuthMode('login')} 
                    className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'login' ? 'bg-white text-alky-blue shadow-sm' : 'text-slate-500'}`}
                  >
                    Connexion
                  </button>
                  <button 
                    onClick={() => setAuthMode('register')} 
                    className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'register' ? 'bg-white text-alky-pink shadow-sm' : 'text-slate-500'}`}
                  >
                    Inscription
                  </button>
                </div>

                {authMode === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-4">
                    <input 
                      type="email" 
                      required 
                      placeholder="Adresse Email" 
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <input 
                      type="password" 
                      required 
                      placeholder="Mot de passe" 
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                      SE CONNECTER
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleRegister} className="space-y-4">
                    <input 
                      type="text" 
                      required 
                      placeholder="Pseudonyme" 
                      value={username} 
                      onChange={e => setUsername(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <input 
                      type="date" 
                      required 
                      value={birthdate} 
                      onChange={e => setBirthdate(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <input 
                      type="email" 
                      required 
                      placeholder="Adresse Email" 
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <input 
                      type="password" 
                      required 
                      placeholder="Mot de passe" 
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-800 focus:outline-none focus:border-alky-blue"
                    />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                      CRÉER MON COMPTE
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    function NavButton({ active, onClick, label }) {
      return (
        <button
          onClick={onClick}
          className={`px-4 py-2 rounded-xl text-xs font-black font-pop tracking-wider transition-all ${
            active 
              ? 'gradient-alky text-white shadow-sm' 
              : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
          }`}
        >
          {label}
        </button>
      );
    }

    function MobileNavButton({ active, onClick, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
            active ? 'text-alky-blue font-black' : 'text-slate-400'
          }`}
        >
          <span className="text-[10px] uppercase font-black font-pop tracking-wider">{label}</span>
        </button>
      );
    }

    function ChallengeCard({ title, category, points, color }) {
      return (
        <div className="card-street rounded-3xl p-6 flex flex-col justify-between bg-slate-50">
          <div>
            <div className="flex items-center justify-between mb-4">
              <span className={`text-[10px] font-black font-pop uppercase px-3 py-1 ${color} rounded-full shadow-sm`}>
                {category}
              </span>
              <span className="text-xs font-black text-alky-blue bg-blue-50 px-2.5 py-1 rounded-full border border-blue-200 font-pop">
                {points}
              </span>
            </div>
            <h3 className="text-lg font-black font-pop text-slate-900 mb-2">{title}</h3>
            <p className="text-slate-500 text-xs font-medium mb-6">Réalise l'action et valide ta photo de preuve.</p>
          </div>
          <button className="w-full gradient-alky text-white font-black font-pop py-3 rounded-xl text-xs shadow-sm btn-pop tracking-wider">
            RELEVER LE DÉFI
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
