                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider">
                      ENREGISTRER LE PSEUDO
                    </button>
                  </form>
                </div>

                {/* SECTION ABONNEMENT EN BAS DE LA PAGE PROFIL */}
                <div className="pt-8 border-t border-slate-200">
                  <SubscriptionSection profile={profile} handleUpdateSubscription={handleUpdateSubscription} />
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="mt-auto py-8 border-t border-slate-200 text-center text-xs text-slate-400 font-bold space-y-2">
            <p>AlkyAI @ 2026 — Tous droits réservés</p>
            <p className="text-[10px] text-slate-400">Transforme ta ville en terrain de jeu géolocalisé</p>
          </footer>

          {/* MODALE SOUMISSION DE PREUVE PHOTO */}
          {selectedChallenge && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full relative border border-slate-200 shadow-2xl space-y-5 text-center">
                <button onClick={() => { setSelectedChallenge(null); setProofFile(null); setProofMessage({text:'', type:''}); }} className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 font-black text-lg">
                  ✕
                </button>

                <div>
                  <span className="text-[10px] font-black font-pop uppercase px-3 py-1 bg-blue-100 text-blue-700 rounded-full">
                    {selectedChallenge.category}
                  </span>
                  <h2 className="text-xl font-black font-pop text-slate-900 mt-2">{selectedChallenge.title}</h2>
                  <p className="text-slate-500 text-xs mt-1 font-medium">{selectedChallenge.desc}</p>
                </div>

                {proofMessage.text ? (
                  <div className={`p-4 rounded-2xl text-xs font-bold ${proofMessage.type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`}>
                    {proofMessage.text}
                  </div>
                ) : (
                  <form onSubmit={handleSubmitProof} className="space-y-4 text-left">
                    <div className="space-y-1">
                      <label className="text-xs font-extrabold text-slate-700">Preuve photo obligatoire 📸</label>
                      <input 
                        type="file" 
                        accept="image/*"
                        required
                        onChange={e => setProofFile(e.target.files[0])}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 font-bold file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-alky-blue file:text-white hover:file:bg-blue-600"
                      />
                    </div>
                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100 text-xs font-bold text-alky-blue">
                      📍 Localisation transmise : {userLocation ? `${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}` : "Aucune position sélectionnée"}
                    </div>
                    <div className="bg-pink-50 p-3 rounded-xl border border-pink-100 flex justify-between items-center text-xs font-black text-slate-700">
                      <span>Récompense :</span>
                      <span className="text-alky-pink font-pop">+1 ALKY (Après validation)</span>
                    </div>
                    <button type="submit" disabled={uploadingProof} className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md btn-pop tracking-wider flex items-center justify-center gap-2">
                      {uploadingProof ? (
                        <>
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                          Envoi de la photo & GPS...
                        </>
                      ) : (
                        "SOUMETTRE LA PREUVE À L'ADMIN ✨"
                      )}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* MODALE D'AUTHENTIFICATION */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full relative border border-slate-200 shadow-2xl">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 font-black text-lg">✕</button>
                <div className="text-center mb-6">
                  <h2 className="text-xl font-black font-pop text-slate-900">MON COMPTE</h2>
                </div>
                {authError && <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-extrabold rounded-xl text-center">{authError}</div>}
                
                {/* BOUTON GOOGLE */}
                <button onClick={handleGoogleLogin} className="w-full mb-4 py-3 bg-white border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-black font-pop text-xs rounded-xl shadow-sm flex items-center justify-center gap-3 transition-all">
                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.11 0 9.8 0 12s.43 3.89 1.18 5.4l4.09-3.16z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                  </svg>
                  Continuer avec Google
                </button>

                <div className="relative flex py-2 items-center">
                  <div className="flex-grow border-t border-slate-200"></div>
                  <span className="flex-shrink mx-4 text-slate-400 text-[10px] font-bold uppercase">ou avec email</span>
                  <div className="flex-grow border-t border-slate-200"></div>
                </div>

                <div className="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 mb-6 mt-2">
                  <button onClick={() => setAuthMode('login')} className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'login' ? 'bg-white text-alky-blue shadow-sm' : 'text-slate-500'}`}>Connexion</button>
                  <button onClick={() => setAuthMode('register')} className={`flex-1 py-2.5 text-xs font-black font-pop rounded-xl transition-all ${authMode === 'register' ? 'bg-white text-alky-pink shadow-sm' : 'text-slate-500'}`}>Inscription</button>
                </div>

                {authMode === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-4">
                    <input type="email" required placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <input type="password" required placeholder="Mot de passe" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md">SE CONNECTER</button>
                  </form>
                ) : (
                  <form onSubmit={handleRegister} className="space-y-4">
                    <input type="text" required placeholder="Pseudonyme" value={username} onChange={e => setUsername(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <input type="email" required placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <input type="password" required placeholder="Mot de passe" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold" />
                    <button type="submit" className="w-full py-3.5 gradient-alky text-white font-black font-pop text-xs rounded-xl shadow-md">CRÉER MON COMPTE</button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function NavButton({ active, onClick, label }) {
      return (
        <button onClick={onClick} className={`px-4 py-2 rounded-xl text-xs font-black font-pop tracking-wider transition-all ${active ? 'gradient-alky text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'}`}>
          {label}
        </button>
      );
    }

    function MobileBurgerButton({ active, onClick, label }) {
      return (
        <button onClick={onClick} className={`w-full text-left px-4 py-3 rounded-xl text-xs font-black font-pop tracking-wider transition-all ${active ? 'gradient-alky text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100'}`}>
          {label}
        </button>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
